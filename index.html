<title>La Maison de Kicuit</title>
<style>
:root{--ink:#2b2350;--cream:#fff8ec;--orange:#ff7a59;--orange-d:#c9553a;--green:#3fbf98;--green-d:#2b8c6f;--blue:#4c8dff;--blue-d:#2f62c2;--grey:#9aa3b8;--grey-d:#6c7590;--sun:#ffd25a;--gold:#ffc83a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#1d1838;overscroll-behavior:none;touch-action:manipulation;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,-apple-system,sans-serif;color:var(--ink)}
body{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1180px;height:820px;transform-origin:center center;overflow:hidden;background:var(--cream)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.full{position:absolute;inset:0;width:100%;height:100%;display:block}
.abs{position:absolute}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:80px;padding:0 30px;border-radius:40px;font-size:30px;font-weight:800;color:#fff;background:var(--c,var(--green));box-shadow:0 7px 0 var(--d,var(--green-d)),0 12px 20px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d,var(--green-d))}
.btn[disabled]{opacity:.45;pointer-events:none}
.b-orange{--c:var(--orange);--d:var(--orange-d)}
.b-blue{--c:var(--blue);--d:var(--blue-d)}
.b-grey{--c:var(--grey);--d:var(--grey-d)}
.iconbtn{position:absolute;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 6px 0 #d9d2e8,0 10px 18px rgba(0,0,0,.15);font-size:40px;display:flex;align-items:center;justify-content:center;z-index:20;overflow:hidden}
.iconbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9d2e8}
.iconbtn svg{width:100%;height:100%}
.gift{overflow:visible;animation:giftbob 1.4s ease-in-out infinite}
.gift .badge{position:absolute;right:-6px;top:-6px;min-width:34px;height:34px;border-radius:17px;background:var(--orange);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.gift.boing{animation:boing .6s ease-out}
@keyframes giftbob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.9)}100%{transform:scale(1)}}

/* bulle de Kicuit */
#bubble{position:absolute;left:122px;top:12px;width:720px;min-height:88px;background:#fff;border-radius:30px;box-shadow:0 8px 22px rgba(43,35,80,.18);display:none;align-items:center;padding:12px 24px 12px 98px;z-index:30;font-size:25px;font-weight:700;line-height:1.25}
#bubble .bh{position:absolute;left:10px;top:50%;width:80px;height:80px;margin-top:-40px}
#bubble.pop{animation:bpop .35s ease-out}
@keyframes bpop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Kicuit */
.kc .kc-float{animation:float 3s ease-in-out infinite}
.kc .kc-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.kc .kc-mouth{transform-box:fill-box;transform-origin:center}
.kc.talking .kc-mouth{animation:talk .16s infinite alternate}
.kc.alarm .kc-eyes rect{fill:#ff6a6a}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.7)}}

/* Wanji */
.wj .e-happy,.wj .e-squint,.wj .m-open,.wj .m-yuck,.wj .cheeks{display:none}
.wj.happy .e-open,.wj.happy .m-normal,.wj.yuck .e-open,.wj.yuck .m-normal,.wj.refuse .e-open,.wj.refuse .m-normal{display:none}
.wj.happy .e-happy,.wj.happy .m-open,.wj.happy .cheeks,.wj.yuck .e-squint,.wj.yuck .m-yuck,.wj.refuse .e-squint,.wj.refuse .m-yuck{display:inline}
.wj .wj-tail{transform-origin:168px 205px;animation:wag 1.4s ease-in-out infinite}
.wj.happy .wj-tail{animation:wag .2s ease-in-out infinite}
.wj .wj-head{transform-origin:120px 130px;transition:transform .35s}
.wj.meh .wj-head{transform:rotate(-16deg)}
.wj.sniff .wj-head{animation:sniff .35s ease-in-out infinite}
.wj.yuck .wj-head{animation:shake .25s ease-in-out 5}
.wj.happy .wj-head{animation:hop .45s ease-in-out infinite}
.wj.refuse{animation:flee 2.8s ease-in-out forwards}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes sniff{0%,100%{transform:translateY(0)}50%{transform:translateY(9px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flee{0%{transform:none}15%{transform:scaleX(-1)}55%{transform:translateX(-330px) scaleX(-1)}75%{transform:translateX(-330px) scaleX(1)}100%{transform:none}}

/* démarrage */
#s-start{background:radial-gradient(circle at 50% 35%,#ffe7b8 0,#ffb487 55%,#ff8a6a 100%)}
.title{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#fff;letter-spacing:1px}
#s-start .title{top:70px;font-size:92px;text-shadow:0 7px 0 #c4513a,0 14px 30px rgba(0,0,0,.2)}
#s-start .sub{position:absolute;left:0;right:0;top:200px;text-align:center;font-size:32px;font-weight:800;color:#7a2f1f}
#startK{left:170px;top:270px;width:280px;height:350px}
#startW{left:740px;top:330px;width:290px;height:300px}
#playBtn{position:absolute;left:440px;top:600px;width:300px;height:118px;font-size:54px;border-radius:60px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* profils */
#s-profile{background:linear-gradient(160deg,#6c5ce7,#a77bf3 60%,#f2a7d8)}
#s-profile .title{top:46px;font-size:70px;text-shadow:0 6px 0 rgba(43,35,80,.35)}
.pcard{position:absolute;top:170px;width:400px;height:560px;border-radius:44px;background:#fff;box-shadow:0 14px 0 rgba(43,35,80,.25),0 20px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;padding-top:30px;transition:transform .1s}
.pcard:active{transform:scale(.97)}
.pcard .av{width:290px;height:290px}
.pcard .pn{font-size:62px;font-weight:900;margin-top:16px}
.pcard .pa{font-size:28px;font-weight:700;opacity:.7;margin-top:4px}
.pcard .pt{margin-top:16px;font-size:24px;font-weight:800;padding:8px 22px;border-radius:20px;color:#fff}
#pAnna{left:150px}#pRafael{left:630px}

/* maison */
#s-hub .room{cursor:pointer}
#s-hub .room:active{filter:brightness(1.12)}
#s-hub .open-pulse{animation:roompulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes roompulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#hubStars{position:absolute;right:220px;top:22px;height:68px;padding:0 20px;border-radius:34px;background:#fff;font-size:32px;font-weight:900;display:flex;align-items:center;gap:8px;box-shadow:0 6px 0 #d9d2e8;z-index:20}
#hubW{left:330px;top:688px;width:120px;height:125px}
#hubK{left:770px;top:690px;width:92px;height:118px}

/* cuisine */
#fridge{left:28px;top:148px;width:254px;height:572px}
.fr-top{position:absolute;left:0;top:0;width:100%;height:132px;background:linear-gradient(90deg,#f7f9fc,#e3e9f3);border:4px solid #7d8aa6;border-radius:24px 24px 8px 8px}
.fr-top::after,.fr-door::after{content:"";position:absolute;right:18px;width:12px;border-radius:6px;background:#9aa6bf}
.fr-top::after{top:34px;height:60px}
.fr-main{position:absolute;left:0;top:138px;width:100%;height:434px}
.fr-in{position:absolute;inset:0;border:4px solid #7d8aa6;border-radius:8px 8px 22px 22px;background:linear-gradient(#f2fbff,#d9eefb);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px 6px}
.fr-in.r4{grid-template-rows:repeat(4,1fr)}.fr-in.r5 .ing svg{width:40px;height:40px}.fr-in.r5 .ing span{font-size:12px}.fr-in.r4 .ing svg{width:48px;height:48px}.fr-in.r4 .ing span{font-size:13px}
.ing.empty{opacity:.35}
.ing{display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:5px solid rgba(125,138,166,.35);transition:transform .1s}
.ing:active{transform:scale(.88)}
.ing svg{width:62px;height:62px}
.ing span{font-size:15px;font-weight:800;margin-top:2px}
.fr-door{position:absolute;inset:0;border:4px solid #7d8aa6;border-radius:8px 8px 22px 22px;background:linear-gradient(90deg,#f7f9fc,#e3e9f3);transform-origin:left center;transition:transform .5s cubic-bezier(.3,1.3,.5,1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.fr-door::after{top:40px;height:110px}
.fr-door.open{transform:scaleX(.07);pointer-events:none}
.fr-door.open>*{opacity:0}

.magnet{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#kicuitK{left:300px;top:150px;width:150px;height:188px;z-index:5}
#bowl{left:478px;top:318px;width:250px;height:156px;z-index:6}
#bowl svg{position:absolute;left:0;top:0;width:250px;height:156px}
#bowlC{position:absolute;left:0;top:0;width:250px;height:90px}
#bowlC .bi{position:absolute;width:56px;height:56px;animation:drop .35s ease-out;cursor:pointer}
#bowlC .bi svg,.wfood svg{width:100%;height:100%}
@keyframes drop{from{transform:translateY(-30px) scale(1.2)}}
#bowlC .pate{position:absolute;left:18px;top:24px;width:214px;height:44px;border-radius:50%;background:var(--c);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),inset 0 6px 0 rgba(255,255,255,.35);animation:drop .4s ease-out}
.whisk{position:absolute;left:90px;top:-70px;width:70px;height:120px;transform-origin:50% 90%;animation:whisk .16s ease-in-out infinite alternate;z-index:8}
@keyframes whisk{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
#plate{left:458px;top:300px;width:290px;height:180px;z-index:7}
#plate .pdish{position:absolute;left:55px;top:18px;width:180px;height:135px}
#plate .pdish svg{width:100%;height:100%}
.st-cru,.st-rate{filter:saturate(.45) brightness(1.2)}
.st-brule,.st-attache{filter:brightness(.5) sepia(.7) saturate(1.5)}
.st-carbonise{filter:brightness(.16) grayscale(.5)}
.st-mou svg{transform:scale(1.15,.6);transform-origin:50% 85%}
.wisp{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--sc,#9ba3b1);opacity:0;animation:wisp 1.8s ease-out infinite;pointer-events:none}
@keyframes wisp{0%{opacity:.75;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-120px) scale(2.2)}}
#kBtns{left:440px;top:502px;width:440px;height:92px;display:flex;gap:16px;justify-content:center;align-items:center;z-index:9}
#kBtns .btn{height:76px;font-size:27px;padding:0 24px}
.glow{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,190,60,0))}50%{filter:drop-shadow(0 0 16px rgba(255,170,40,.95))}}
.app{z-index:4}
.app svg{position:absolute;inset:0;width:100%;height:100%}
.win{position:absolute;overflow:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center}
.win.on{background:radial-gradient(circle at 50% 70%,rgba(255,170,60,.95),rgba(255,110,40,.45) 60%,rgba(45,53,80,0) 100%)}
.disp{position:absolute;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-weight:800;color:#5ff2df;font-size:20px;letter-spacing:1px;pointer-events:none}
#oven{left:905px;top:498px;width:232px;height:214px}
#oven .win{left:30px;top:78px;width:172px;height:96px}
#oven .disp{left:70px;top:12px;width:92px;height:30px}
.wdish{width:120px;height:90px;transform:scale(.75)}
.wdish svg{width:100%;height:100%}
.cook-explose{animation:cexp 3.3s ease-in forwards}
@keyframes cexp{0%{transform:scale(.7)}60%{transform:scale(1.15)}80%{transform:scale(1.4) rotate(-4deg)}90%{transform:scale(1.55) rotate(5deg)}100%{transform:scale(1.85)}}
.cook-brule{animation:cbr 3.3s linear forwards}
@keyframes cbr{to{filter:brightness(.5) sepia(.7) saturate(1.5);transform:scale(.82)}}
.cook-carbonise{animation:cca 3.3s linear forwards}
@keyframes cca{to{filter:brightness(.15) grayscale(.5);transform:scale(.8)}}
.cook-parfait{animation:cpa 3.3s ease-out forwards}
@keyframes cpa{to{transform:scale(.9)}}
.cook-vert{animation:cve 1s ease-in-out infinite}
@keyframes cve{0%,100%{transform:scale(.75)}50%{transform:scale(.88,.7)}}
.cook-cru,.cook-rate{animation:ccr 3.3s ease-out forwards}
@keyframes ccr{to{transform:scale(.78)}}

/* plaque de cuisson */
#plaque{left:856px;top:298px;width:294px;height:176px;z-index:4}

.ust{position:absolute;touch-action:none}

#poele{left:0;top:84px;width:154px;height:72px}
#casserole{left:154px;top:28px;width:138px;height:126px}

.pc.boil{animation:boil .5s ease-in-out infinite alternate}
@keyframes boil{from{transform:scaleY(1)}to{transform:scaleY(1.5) translateY(-2px)}}
.pc.flip{animation:flipA .55s ease-out}
@keyframes flipA{0%{transform:none}45%{transform:translateY(-80px) scaleY(-.6) rotate(10deg)}100%{transform:none}}
.pc.fold{animation:foldA .5s ease-out}
@keyframes foldA{50%{transform:scaleX(.5) translateY(-10px)}}
#plaque .disp{left:118px;top:154px;width:58px;height:20px;font-size:13px}
.meter{position:absolute;left:162px;top:2px;width:124px;height:18px;border-radius:9px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);overflow:hidden;z-index:6;border:3px solid #fff}

.spoon{position:absolute;width:34px;height:92px;pointer-events:none;z-index:7;transform-origin:50% 85%;margin:-80px 0 0 -17px}

#ceil{position:absolute;left:0;top:96px;width:120px;height:44px;z-index:42;pointer-events:none}

#wanjiBox{left:285px;top:560px;width:220px;height:230px;z-index:8}
#wanji{position:absolute;left:0;top:0;width:220px;height:230px}

#order{left:500px;top:598px;width:200px;height:118px;z-index:9;background:#fff;border-radius:40px;box-shadow:0 6px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px}

/* carnet */

/* autocollants */
.sart{position:relative;width:100%;height:100%;border-radius:50%;background:var(--bg,#fff5e0);border:7px solid #fff;box-shadow:0 4px 0 rgba(43,35,80,.12),0 8px 16px rgba(43,35,80,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sart svg{width:82%;height:82%}
.sart .emo{font-size:calc(var(--sz,120px)*.48);line-height:1}
.sart.r-b::after,.sart.r-o::after{content:"";position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);animation:sheen 2.8s ease-in-out infinite;pointer-events:none}
.sart.r-h::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ff6ec7,#ffd36e,#6effa8,#6ec8ff,#c86eff,#ff6ec7);background-size:400% 400%;mix-blend-mode:overlay;opacity:.75;animation:holo 3s linear infinite;pointer-events:none}
.sart.r-h::before{content:"";position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.7) 50%,transparent 58%);animation:sheen 2.2s ease-in-out infinite;pointer-events:none;z-index:2}
.sart.r-o{border-color:var(--gold);box-shadow:0 0 0 4px #fff,0 6px 0 rgba(43,35,80,.12),0 0 24px rgba(255,200,58,.8)}
@keyframes sheen{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
@keyframes holo{to{background-position:400% 0}}
.ghost{filter:grayscale(1) opacity(.22)}

#s-album{background:linear-gradient(160deg,#ffe9b8,#ffd0e0)}
#tabs{position:absolute;left:40px;right:40px;top:112px;height:64px;display:flex;gap:6px}
.tab{flex:1;min-width:0;height:64px;border-radius:22px 22px 0 0;background:rgba(255,255,255,.55);font-size:15px;white-space:nowrap;padding:0 2px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}

#apage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(43,35,80,.06) 1.5px,transparent 1.5px);background-size:26px 26px;pointer-events:none}
.slots{position:absolute;inset:18px 24px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px 10px;align-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot .sh{width:120px;height:120px;border-radius:50%;border:4px dashed rgba(43,35,80,.18);display:flex;align-items:center;justify-content:center;position:relative}
.slot .sh .sart{--sz:112px}
.slot.got .sh{border-color:transparent}
.slots.dense .slot .sh{width:108px;height:108px}.slots.dense .slot .sh .sart{--sz:100px}.slots.dense .ghost{width:94px!important;height:94px!important;--sz:94px!important}.slots.dense .slot .sn{font-size:14px;max-width:124px}
.slots.dense2 .slot .sh{width:92px;height:92px}.slots.dense2 .slot .sh .sart{--sz:84px;border-width:5px}.slots.dense2 .ghost{width:80px!important;height:80px!important;--sz:80px!important}.slots.dense2 .slot .sn{font-size:12px;max-width:100px}
.slots.dense2{gap:2px 6px}
.slots.dense3 .slot .sh{width:82px;height:82px}.slots.dense3 .slot .sh .sart{--sz:76px}.slots.dense3 .ghost{width:72px!important;height:72px!important;--sz:72px!important}.slots.dense3 .slot .sn{font-size:11px;max-width:92px;min-height:28px}
.slot .sq{font-size:56px;font-weight:900;color:rgba(43,35,80,.18)}
.slot .sn{font-size:15px;font-weight:800;text-align:center;line-height:1.1;max-width:136px;min-height:34px}
.slot.target .sh{border-color:var(--orange);animation:pulse 1s infinite;background:rgba(255,122,89,.08)}
.slot.just .sh .sart{animation:stick .5s ease-out}

/* pochette */
#packM{z-index:85}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes foil{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.pkwrap{position:relative;width:620px;height:660px;display:flex;flex-direction:column;align-items:center}
.pkcount{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:20px;padding:4px 16px;font-size:22px;font-weight:900;white-space:nowrap}
.packet{position:relative;width:300px;height:420px;margin-top:60px;border-radius:24px;--t:0;cursor:grab;touch-action:none;animation:wobble 1.6s ease-in-out infinite}
.packet .pbody{position:absolute;inset:0;border-radius:24px;background:var(--pk);box-shadow:0 20px 40px rgba(0,0,0,.35);overflow:hidden}
.packet .pbody::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;animation:foil 2.2s linear infinite}
.packet .pbody::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(255,255,255,.18) 0 40px,transparent 41px),radial-gradient(circle at 85% 30%,rgba(255,255,255,.15) 0 30px,transparent 31px)}
.packet .pl{position:absolute;left:0;right:0;top:96px;text-align:center;color:#fff;font-size:46px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.packet .ppg{position:absolute;right:20px;top:150px;font-size:56px;transform:rotate(12deg);filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.packet .pk{position:absolute;left:70px;top:170px;width:120px;height:150px}
.packet .pname{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-size:24px;font-weight:900;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.packet .flap{position:absolute;left:0;right:0;top:0;height:78px;border-radius:24px 24px 0 0;background:var(--pk);overflow:hidden;z-index:3;transform-origin:4% 100%;transform:translateY(calc(var(--t) * -16px)) rotate(calc(var(--t) * -16deg));box-shadow:0 6px 10px rgba(0,0,0,.12)}
.packet .flap::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;animation:foil 2.2s linear infinite}
.packet .tearline{position:absolute;left:0;right:0;bottom:6px;height:0;border-bottom:5px dashed rgba(255,255,255,.85)}
.packet .tearline::after{content:"";position:absolute;left:0;bottom:-5px;height:5px;width:calc(var(--t) * 100%);background:#fff;border-radius:3px}
.packet .pglow{position:absolute;left:8px;right:8px;top:64px;height:30px;border-radius:50%;background:var(--glow);filter:blur(8px);opacity:calc(var(--t) * 1.2);z-index:2;transform:scaleY(calc(.4 + var(--t)))}
.pkwrap.leak:not(.r-c) .packet .pglow{animation:leak .5s ease-in-out infinite alternate}
.pkwrap.leak.r-h .packet .pglow{background:linear-gradient(90deg,#ff6ec7,#ffd36e,#6effa8,#6ec8ff,#c86eff);animation:leak .4s ease-in-out infinite alternate,hue 1s linear infinite}
.pkwrap.leak:not(.r-c) .packet{animation:rumble .12s linear infinite}
.pkwrap.leak.r-b .packet{animation:rumble .2s linear infinite}
@keyframes leak{from{filter:blur(8px) brightness(1)}to{filter:blur(14px) brightness(1.6)}}
@keyframes hue{to{filter:blur(10px) hue-rotate(360deg)}}
@keyframes rumble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-1deg)}50%{transform:translate(2px,-2px) rotate(1deg)}75%{transform:translate(3px,2px) rotate(0)}100%{transform:translate(0,0)}}
.packet .swipeh{position:absolute;left:0;top:30px;font-size:60px;z-index:4;pointer-events:none;animation:swipeh 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.packet.touched .swipeh{display:none}
@keyframes swipeh{0%{transform:translate(-20px,0);opacity:0}15%{opacity:1}75%{transform:translate(260px,0);opacity:1}100%{transform:translate(280px,0);opacity:0}}
.pktip{margin-top:26px;color:#fff;font-size:24px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.packet.gone{animation:none;transition:transform .6s ease-in,opacity .6s;transform:translateY(520px) rotate(8deg);opacity:0;pointer-events:none}
/* carte qui sort et se retourne */
.reveal{position:relative;width:620px;height:660px;display:flex;flex-direction:column;align-items:center}
.rays{position:absolute;left:50%;top:190px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(var(--ray,rgba(255,214,90,.5)) 0 12deg,transparent 12deg 24deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);opacity:0;transition:opacity .5s}
.reveal.shown .rays{opacity:1}
.r-h .rays{--ray:rgba(200,110,255,.55);animation:spin 5s linear infinite,hue 3s linear infinite}
.r-o .rays{--ray:rgba(255,200,58,.75)}
.c3d{position:relative;width:250px;height:330px;margin-top:30px;perspective:1300px;z-index:2;cursor:pointer}
.c3d.rise{animation:rise .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes rise{0%{transform:translateY(260px) scale(.7)}100%{transform:none}}
.c3d.wait .cin{animation:hover 1.2s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.cin{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,1.4,.5,1)}
.c3d.flipped .cin{transform:rotateY(180deg);animation:none}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 36px rgba(0,0,0,.35)}
.face.back{background:repeating-linear-gradient(45deg,#4c6fd8 0 18px,#5b7fe6 18px 36px);border:8px solid #fff}
.face.back .bk{width:130px;height:160px}
.face.back b{position:absolute;bottom:18px;font-size:44px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.r-b .face.back{box-shadow:0 0 0 6px #e8eef8,0 0 40px 10px rgba(220,230,255,.9)}
.r-h .face.back{box-shadow:0 0 0 6px #fff,0 0 50px 16px #ff6ec7;animation:hologlow 1.2s linear infinite}
.r-o .face.back{box-shadow:0 0 0 6px #fff3c4,0 0 50px 16px #ffc83a}
@keyframes hologlow{0%{box-shadow:0 0 0 6px #fff,0 0 50px 16px #ff6ec7}33%{box-shadow:0 0 0 6px #fff,0 0 50px 16px #6ec8ff}66%{box-shadow:0 0 0 6px #fff,0 0 50px 16px #6effa8}100%{box-shadow:0 0 0 6px #fff,0 0 50px 16px #ff6ec7}}
.face.front{transform:rotateY(180deg);background:#fff}
.face.front .fa{width:220px;height:220px;--sz:220px}
.stamp{position:absolute;right:-30px;top:-22px;z-index:5;font-size:26px;font-weight:900;color:#fff;padding:8px 16px;border-radius:14px;transform:rotate(12deg);box-shadow:0 6px 14px rgba(0,0,0,.25);opacity:0}
.stamp.new{background:#ff5a5a}.stamp.dbl{background:var(--blue)}
.reveal.shown .stamp{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) .35s both}
@keyframes stamp{0%{transform:scale(3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(12deg);opacity:1}}
.reveal .rl,.reveal .rn,.reveal .pfoot,.reveal .rtip{position:relative;opacity:0;transition:opacity .4s .3s,transform .4s .3s;transform:translateY(16px)}
.reveal.shown .rl,.reveal.shown .rn,.reveal.shown .pfoot{opacity:1;transform:none}
.reveal .rtip{margin-top:26px;color:#fff;font-size:24px;font-weight:900;opacity:1;transform:none;text-shadow:0 2px 0 rgba(0,0,0,.25)}

.reveal .rl{margin-top:22px;font-size:22px;font-weight:900;color:#fff;padding:6px 18px;border-radius:16px;background:var(--rc,var(--blue))}

.pkflash{position:absolute;inset:0;z-index:95;pointer-events:none;background:#fff;animation:pkflash .7s ease-out forwards}

<script>
'use strict';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
/* Tap fiable sur iPad : validé au relâchement du doigt, même si l'élément bouge. */
function onTap(el,fn){
  let sx=0,sy=0,down=false;
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;down=true;sx=e.clientX;sy=e.clientY;},{passive:true});
  el.addEventListener('pointerup',e=>{if(!down)return;down=false;if(Math.hypot(e.clientX-sx,e.clientY-sy)>45)return;fn(e);});
  el.addEventListener('pointercancel',()=>{down=false;});
}

/* ---------- mise à l'échelle ---------- */
let SCALE=1;
/* taille de l'écran réel : on lit le viewport de mise en page (pas innerWidth, faussé quand Safari a zoomé) */
function vpW(){return document.documentElement.clientWidth||innerWidth}
function vpH(){return document.documentElement.clientHeight||innerHeight}
function fit(){SCALE=Math.min(vpW()/1180,vpH()/820);$('stage').style.transform=`translate(-50%,-50%) scale(${SCALE})`;window.scrollTo(0,0);}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
document.addEventListener('touchmove',e=>{if(!e.target.closest('input,.blist,#tray,.mlist'))e.preventDefault()},{passive:false});
/* Anti-zoom iPad : Safari ignore user-scalable=no, on bloque donc le double-tap et le pincement nous-mêmes.
   Les touches du jeu passent par les événements pointer, elles ne sont pas affectées. */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouchEnd<450&&!e.target.closest('input'))e.preventDefault();lastTouchEnd=n;},{passive:false});
/* on annule le geste par défaut de Safari dès le premier contact (zoom, double-tap, défilement) ;
   les touches du jeu passent par les événements pointer, qui restent actifs. */
document.addEventListener('touchstart',e=>{if(e.touches.length>1||!e.target.closest('input,.blist,#tray,.mlist'))e.preventDefault();},{passive:false});
/* si un zoom passe quand même, on revient automatiquement à la vue normale */
function unzoom(){const m=document.querySelector('meta[name=viewport]');if(!m)return;const c='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  m.setAttribute('content',c.replace('maximum-scale=1','maximum-scale=1.0001')+', minimum-scale=1');
  setTimeout(()=>{m.setAttribute('content',c);window.scrollTo(0,0);fit();},80);
  [300,700,1200].forEach(t=>setTimeout(()=>{window.scrollTo(0,0);fit();},t));}
if(window.visualViewport){let zt=null;const chk=()=>{if(visualViewport.scale>1.01||visualViewport.offsetTop>1||visualViewport.offsetLeft>1){clearTimeout(zt);zt=setTimeout(unzoom,400);}};visualViewport.addEventListener('resize',chk);visualViewport.addEventListener('scroll',chk);}
addEventListener('scroll',()=>{if(scrollX||scrollY)window.scrollTo(0,0);});
function stagePt(e){const s=$('stage').getBoundingClientRect();return {x:(e.clientX-s.left)/SCALE,y:(e.clientY-s.top)/SCALE};}
function pos(el){const r=el.getBoundingClientRect(),s=$('stage').getBoundingClientRect();return {x:(r.left-s.left+r.width/2)/SCALE,y:(r.top-s.top+r.height/2)/SCALE};}

/* ---------- sauvegarde ---------- */
const blank=()=>({st:{},found:{},stars:0,packs:[],tray:[],free:[],c:{booms:0,streak:0,pets:0,ktaps:0}});
let DB={anna:blank(),rafael:blank(),voice:true};
try{const s=JSON.parse(localStorage.getItem('kicuit_v1')||'null');if(s)DB=Object.assign(DB,s);}catch(e){}
['anna','rafael'].forEach(k=>{DB[k]=Object.assign(blank(),DB[k]||{});DB[k].c=Object.assign(blank().c,DB[k].c||{});});
function saveDB(){try{localStorage.setItem('kicuit_v1',JSON.stringify(DB))}catch(e){}}

const S={player:null,screen:'s-start',k:{bowl:[],mixed:false,phase:'prep',app:null,heat:null,time:null,result:null,order:null,lastOrder:null}};
const P=()=>DB[S.player];
const isA=()=>S.player==='anna';
const T=(a,r)=>isA()?a:r;

/* ---------- sons ---------- */
let AC=null,NB=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type='sine',vol=.2,delay=0){
  const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol=.3,type='lowpass',freq=800,delay=0){
  const a=ac();if(!a)return;
  if(!NB){NB=a.createBuffer(1,a.sampleRate*1.5,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=NB;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.05);
}
const sfx={
  pop:()=>tone(420,900,.09,'sine',.22),
  click:()=>tone(700,500,.05,'triangle',.12),
  whisk:()=>{for(let i=0;i<8;i++)noise(.07,.16,'highpass',2600,i*.14)},

let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^fr[-_]FR/i.test(v.lang)&&/Am[eé]lie|Audrey|Marie|Aur[eé]lie/i.test(v.name))||vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let talkTimer=null;
function talking(on){document.querySelectorAll('.kc').forEach(k=>k.classList.toggle('talking',on))}
function speak(text,immediate){
  clearTimeout(talkTimer);talking(true);
  const clean=text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{2B06}\u{2194}-\u{21FF}]/gu,'').replace(/°C/g,' degrés').replace(/–/g,' à ');
  talkTimer=setTimeout(()=>talking(false),Math.min(6000,600+clean.length*55));
  if(!DB.voice||!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(clean);u.lang='fr-FR';if(VOICE)u.voice=VOICE;u.rate=isA()?.95:1.03;u.pitch=1.25;
  u.onend=u.onerror=()=>talking(false);
  speechSynthesis.cancel();
  if(immediate)speechSynthesis.speak(u);else setTimeout(()=>speechSynthesis.speak(u),70);
}
let lastSay='';
/* say(texte, voix) : sans 2e argument, Nana entend le texte et Raf le lit en silence.
   voix=false : bulle seule. voix='…' : on dit cette phrase courte (pour les deux). */
function say(text,v){
  lastSay=text;$('bubbleText').textContent=text;const b=$('bubble');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  const sp=v===undefined?(isA()?text:null):v;
  if(sp)speak(sp);else{clearTimeout(talkTimer);talking(true);talkTimer=setTimeout(()=>talking(false),500);}
}
onTap($('bubble'),()=>lastSay&&speak(lastSay));

const REAL=Object.keys(RECIPES).filter(k=>!RECIPES[k].mystery);
const ORDERABLE=['gateau','gateauFraise','pizza','gratin','quiche','oeufCocotte','crepes','omelette','soupe'];
const JARDIN=10;
const WHERE={four:'au four',poele:'à la poêle',casserole:'dans la casserole'};
const APPN={four:'🔥 Le four',poele:'🍳 La poêle',casserole:'🍲 La casserole'};
const APPI={four:'🔥',poele:'🍳',casserole:'🍲'};
function candidates(list){const s=new Set(list);return REAL.filter(id=>{const R=RECIPES[id];return R.req.every(k=>s.has(k))&&[...s].every(k=>R.req.includes(k)||R.opt.includes(k));});}
function resolve(list,app){const c=candidates(list);if(!c.length)return {rid:'mystere'};const m=c.find(id=>RECIPES[id].app===app);return m?{rid:m}:{rid:c[0],wrong:true};}
const fmtMin=m=>`${m} min`;

/* le cœur du jeu : que devient la préparation ? (avant les gestes) */
function evaluate(r,app,heat,time,list){
  const {rid,wrong}=r,R=RECIPES[rid];
  if(app==='four'&&heat>=260)return time>=5?{st:'explose',why:"Plus de 260 °C ! L'eau de la pâte se transforme en vapeur trop vite : ça gonfle… et BOUM !"}:{st:'brule',why:'Beaucoup trop chaud : ça a brûlé en quelques minutes.'};
  if(app==='casserole'&&list.includes('lait')&&heat>=8)return {st:'deborde',why:"Feu trop vif : le lait bout, mousse et déborde de la casserole ! Il faut un feu doux ou moyen."};
  if(R.mystery)return {st:'vert',why:'Ces ingrédients ne vont pas ensemble… Essaie une vraie recette !'};
  if(wrong)return {st:'rate',why:`${cap(R.art)}, ça se cuit ${WHERE[R.app]}, pas ${WHERE[app]} !`,anna:`Oups, mauvais ustensile ! ${cap(R.art)}, ça se cuit ${WHERE[R.app]}.`};
  const [r0,r1]=R.r,[m0,m1]=R.m,unit=app==='four'?' °C':'';
  const hN=app==='four'?`${heat} °C`:`feu ${heat}`;
  if(app==='four'&&heat<r0-50)return {st:'cru',why:`Le four est presque froid ! Il faut entre ${r0} et ${r1} °C.`};
  const oT=heat>r1,oM=time>m1,uT=heat<r0,uM=time<m0;
  if(oT&&oM)return {st:'carbonise',why:`Trop chaud ET trop long : tout est carbonisé ! Vise ${app==='four'?`${r0}–${r1} °C`:`un feu ${r0} à ${r1}`} pendant ${m0}–${m1} min.`};
  if(oT)return {st:'brule',why:app==='four'?`Trop chaud : le dessus brûle avant que l'intérieur cuise. Reste sous ${r1} °C.`:`Feu trop fort : ça brûle avant d'être cuit. Reste à ${r1} maximum.`};
  if(oM)return {st:'brule',why:`Trop long : après ${m1} min, ça noircit.`};
  if(uT)return {st:'cru',why:app==='four'?`Pas assez chaud : il faut au moins ${r0} °C.`:`Feu trop doux : il faut au moins ${r0}.`};
  if(uM)return {st:'cru',why:`Pas assez de temps : laisse au moins ${m0} min.`};
  return {st:'parfait',why:`${hN} pendant ${time} min : parfait !`};
}

const VIS=()=>STICK.filter(s=>!(isA()&&s.raf));
const SID=Object.fromEntries(STICK.map(s=>[s.id,s]));
const RARN={c:'',b:'Brillant !',h:'Holographique !!',o:'Doré !'};
const RARC={c:'#4c8dff',b:'#8a96ad',h:'linear-gradient(90deg,#ff6ec7,#6ec8ff,#c86eff)',o:'#e0a91f'};
function sart(id){const s=SID[id];return `<div class="sart r-${s.rar}" style="--bg:${s.bg}">${s.dish?dishSVG(s.dish):s.svg?s.svg():`<span class="emo">${s.e}</span>`}</div>`;}
const owned=id=>!!P().st[id];
const pending=id=>P().packs.some(t=>t.id===id&&!t.d)||P().tray.some(t=>t.id===id&&!t.d);
let toastQ=Promise.resolve();
function award(id,{dbl=false}={}){
  if(!S.player||!SID[id])return;
  const p=P(),have=owned(id)||pending(id);
  if(have&&!dbl)return;
  p.packs.push({id,d:have});saveDB();updGift();
  toastQ=toastQ.then(async()=>{await sleep(700);$('toastPk').style.setProperty('--pk',PACKPG[SID[id].pg]||PACKPG.cuisine);$('toast').classList.add('on');sfx.tear();document.querySelectorAll('.gift').forEach(g=>{g.classList.remove('boing');void g.offsetWidth;g.classList.add('boing')});await sleep(2000);$('toast').classList.remove('on');await sleep(400);});
}
function updGift(){
  const n=S.player?P().packs.length+P().tray.length:0;
  document.querySelectorAll('.gift').forEach(g=>{g.classList.toggle('hidden',!n);g.querySelector('.badge').textContent=n;});
}
function checkGold(pg){
  const list=VIS().filter(s=>s.pg===pg&&s.rar!=='o');const gold=STICK.find(s=>s.pg===pg&&s.rar==='o');
  if(gold&&list.every(s=>owned(s.id)))award(gold.id);
}

const PACKPG={cuisine:'linear-gradient(160deg,#ffae5a,#ff5a6a)',catas:'linear-gradient(160deg,#ff7a4a,#c8365a)',amis:'linear-gradient(160deg,#d0a476,#80583a)',jardin:'linear-gradient(160deg,#86da6c,#2f9a5a)',fromage:'linear-gradient(160deg,#ffd86a,#e0961f)',corps:'linear-gradient(160deg,#ff8aa8,#d9466e)',ateliers:'linear-gradient(160deg,#6ec8ff,#4c6fd8)',secrets:'linear-gradient(160deg,#b58bff,#5a3ec8)'};
const RGLOW={c:'#ffffff',b:'#e4ecff',h:'#ff9ae0',o:'#ffd23a'};
const PK={t:0,done:false,it:null,leak:false,rip:0};
function confetti(n,cols){
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.style.background=pick(cols);$('stage').appendChild(c);
    const x=rnd(40,1140),dx=rnd(-120,120),r=rnd(-720,720),dur=rnd(1600,2800);
    c.animate([{transform:`translate(${x}px,-30px) rotate(0)`},{transform:`translate(${x+dx}px,860px) rotate(${r}deg)`}],{duration:dur,delay:rnd(0,500),easing:'cubic-bezier(.3,.1,.6,1)',fill:'both'}).onfinish=()=>c.remove();}
}
function pkFlash(k){const f=document.createElement('div');f.className='pkflash '+k;$('stage').appendChild(f);setTimeout(()=>f.remove(),800);}
function openPacks(){
  const p=P();
  if(!p.packs.length){if(p.tray.length){$('packM').classList.add('hidden');enterAlbum(pageOfTray());}return;}
  const it=p.packs[0],s=SID[it.id],pg=PAGES.find(x=>x.id===s.pg)||PAGES[0],n=p.packs.length;
  Object.assign(PK,{t:0,done:false,it,leak:false,rip:0});
  $('packIn').innerHTML=`<div class="pkwrap r-${s.rar}" id="pkWrap">${n>1?`<div class="pkcount">🎁 ${n} pochettes</div>`:''}
    <div class="packet" id="packet" style="--pk:${PACKPG[s.pg]||PACKPG.cuisine};--glow:${RGLOW[s.rar]}">
      <div class="pbody"><div class="pl">Kicuit</div><div class="ppg">${pg.e}</div><div class="pk">${kicuitSVG()}</div><div class="pname">${pg.n}</div></div>
      <div class="pglow"></div><div class="flap"><div class="tearline"></div></div><div class="swipeh">👆</div>
    </div><div class="pktip">${T('Glisse ton doigt sur les pointillés !','Déchire le long des pointillés ✂️')}</div></div>`;
  $('packM').classList.remove('hidden');
  say(T('Déchire la pochette avec ton doigt !',`Pochette${n>1?` (${n} à ouvrir)`:''} : glisse le doigt sur les pointillés pour la déchirer.`));
  const pk=$('packet');let d=null;
  pk.addEventListener('pointerdown',e=>{if(PK.done)return;const q=stagePt(e);d={x:q.x,y:q.y,lx:q.x,ly:q.y,dist:0};pk.classList.add('touched');try{pk.setPointerCapture(e.pointerId)}catch(_){}});
  pk.addEventListener('pointermove',e=>{if(!d||PK.done)return;const q=stagePt(e),step=Math.abs(q.x-d.lx)+Math.abs(q.y-d.ly)*.4;d.lx=q.x;d.ly=q.y;d.dist+=step;setTear(PK.t+step/300);});
  const up=()=>{if(!d||PK.done){d=null;return;}const tap=d.dist<14;d=null;if(tap){sfx.tear();pk.animate([{transform:'translateX(-8px) rotate(-3deg)'},{transform:'translateX(8px) rotate(3deg)'},{transform:'none'}],{duration:260});setTear(PK.t+.5);}};
  pk.addEventListener('pointerup',up);pk.addEventListener('pointercancel',up);
}
function setTear(t){
  if(PK.done)return;t=Math.min(1,t);const s=SID[PK.it.id],pk=$('packet');if(!pk)return;
  if(Math.floor(t*10)>PK.rip){PK.rip=Math.floor(t*10);noise(.06,.18,'highpass',2000+PK.rip*260);}
  PK.t=t;pk.style.setProperty('--t',t.toFixed(3));
  if(t>.45&&!PK.leak){PK.leak=true;$('pkWrap').classList.add('leak');
    if(s.rar!=='c'){tone(500,1400,.5,'sine',.12);say(T('Oh ! Ça brille…',s.rar==='h'?'Ça brille de toutes les couleurs…':s.rar==='o'?'Une lumière dorée…':'Ça brille…'),T(undefined,false));}}
  if(t>=.97)tearDone();
}
async function tearDone(){
  PK.done=true;const it=PK.it,s=SID[it.id],pk=$('packet');
  sfx.tear();setTimeout(sfx.tear,90);
  const fl=pk.querySelector('.flap');fl.animate([{transform:getComputedStyle(fl).transform},{transform:'translate(260px,-320px) rotate(-70deg)',opacity:0}],{duration:600,easing:'ease-out',fill:'forwards'});
  await sleep(260);
  $('pkWrap').classList.remove('leak');pk.classList.add('gone');
  /* la carte sort de la pochette */
  const p=P();p.packs.shift();p.tray.push(it);saveDB();updGift();
  const lab=it.d?'':RARN[s.rar];
  const wrap=document.createElement('div');wrap.className=`reveal r-${s.rar}`;wrap.id='pkRev';
  wrap.innerHTML=`<div class="rays"></div><div class="c3d rise wait" id="c3d"><div class="cin"><div class="face back"><div class="bk">${kicuitSVG()}</div><b>?</b></div><div class="face front"><div class="fa">${sart(it.id)}</div></div></div><div class="stamp ${it.d?'dbl':'new'}">${it.d?'DOUBLE':'NOUVEAU !'}</div></div>
    <div class="rtip">${T('Touche la carte !','Touche la carte pour la retourner')}</div>
    ${lab?`<div class="rl" style="--rc:${RARC[s.rar]}">${lab}</div>`:''}<div class="rn">${s.n}</div>
    <div class="pfoot"><button class="btn b-orange" id="pkGo">📒 Coller dans l'album</button>${p.packs.length?`<button class="btn" id="pkNext">🎁 Encore ${p.packs.length}</button>`:''}</div>`;
  await sleep(250);
  $('packIn').innerHTML='';$('packIn').appendChild(wrap);
  /* suspense : roulement qui monte, plus long pour les rares */
  const rolls={c:3,b:5,h:8,o:8}[s.rar];for(let i=0;i<rolls;i++)tone(300+i*70,0,.07,'triangle',.1,i*.09);

/* ---------- animations ---------- */
function fly(html,fromEl,toEl,{dur=650,size=64,arc=120,spin=0,scaleTo=1,to=null}={}){
  return new Promise(res=>{
    const a=pos(fromEl),b=to||pos(toEl),d=document.createElement('div');d.className='flyer';
    d.style.width=size+'px';d.style.height=size+'px';d.innerHTML=html;$('stage').appendChild(d);
    const mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-arc,fr=[];
    for(let i=0;i<=14;i++){const t=i/14,x=(1-t)*(1-t)*a.x+2*(1-t)*t*mx+t*t*b.x,y=(1-t)*(1-t)*a.y+2*(1-t)*t*my+t*t*b.y;
      fr.push({transform:`translate(${x-size/2}px,${y-size/2}px) scale(${1+(scaleTo-1)*t}) rotate(${spin*t}deg)`});}
    d.animate(fr,{duration:dur,easing:'ease-in-out',fill:'forwards'}).onfinish=()=>{d.remove();res();};
  });
}
function burst(el,chars,n=8,spread=140){
  const c=pos(el);
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='particle';p.textContent=pick(chars);$('stage').appendChild(p);
    const dx=rnd(-spread,spread),dy=rnd(-spread*1.3,-40);
    p.animate([{transform:`translate(${c.x-20}px,${c.y-20}px) scale(.4)`,opacity:1},{transform:`translate(${c.x-20+dx}px,${c.y-20+dy}px) scale(1.2)`,opacity:0}],{duration:rnd(900,1500),easing:'ease-out',delay:i*60,fill:'both'}).onfinish=()=>p.remove();
  }
}
function smokeFrom(el,color,count=1){
  const c=pos(el);
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='particle';p.style.cssText=`width:40px;height:40px;border-radius:50%;background:${color}`;$('stage').appendChild(p);
    const x=c.x+rnd(-40,40);
    p.animate([{transform:`translate(${x}px,${c.y-60}px) scale(.4)`,opacity:.8},{transform:`translate(${x+rnd(-30,30)}px,${c.y-200}px) scale(2.4)`,opacity:0}],{duration:1500,easing:'ease-out',fill:'forwards'}).onfinish=()=>p.remove();
  }
}

/* cuisson */
async function cook(){
  $('panel').classList.add('hidden');
  const app=S.k.app,heat=S.k.heat,time=S.k.time,list=[...S.k.bowl];
  const r=resolve(list,app),rid=r.rid,R=RECIPES[rid];
  let res=evaluate(r,app,heat,time,list);
  const gg=G_();let fromG=false;['tomate','fraise','farine','lait'].forEach(k=>{if(list.includes(k)&&gg.fridge[k]>0){gg.fridge[k]--;fromG=true;}});LIMITED.forEach(k=>{if(list.includes(k)&&limStock(k)>0){limUse(k);if(k==='pdt')fromG=true;}});saveDB();updFridge();
  S.k.phase='cooking';renderBtns();
  const plaque=app!=='four';
  const el=plaque?$(app):$('oven'),disp=(plaque?$('plaque'):$('oven')).querySelector('.disp');
  sfx.click();

  const target=plaque?el.querySelector('.pc'):el.querySelector('.win');
  await fly(`<div style="width:100%;height:100%;border-radius:50%;background:${mixColor()};box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)"></div>`,$('bowl'),target,{dur:600,size:80,arc:80});
  S.k.bowl=[];S.k.mixed=false;renderBowl();
  const D=plaque?5200:3300;
  let gesture=null;
  if(!plaque){
    const win=target;win.classList.add('on');win.innerHTML=`<div class="wdish cook-${res.st}">${dishSVG(rid)}</div>`;
    say(T('Le four chauffe…',`Cuisson à ${heat} °C pendant ${time} min…`),false);sfx.hum(3.4);
  }else{
    const pc=target;pc.style.setProperty('--pc',R.cook||R.pate);
    if(app==='casserole')pc.classList.add('boil');
    $(app==='poele'?'burnP':'burnC').classList.add('on');sfx.sizzle(5);
    if(!r.wrong&&!R.mystery&&R.gesture&&res.st!=='deborde'){gesture=R.gesture;setupGesture(gesture,app);}
    else say(T('Ça chauffe…',`Feu ${heat} pendant ${time} min…`),false);
  }
  const total=time*60,t0=performance.now();let smokeT=null,darkened=false,boiled=false;
  const smokeCol=res.st==='vert'?'rgba(110,210,80,.75)':res.st==='explose'?'rgba(200,200,210,.7)':res.st==='deborde'?'rgba(255,255,255,.85)':'rgba(90,90,100,.75)';
  if(['brule','carbonise','vert','explose','deborde'].includes(res.st))smokeT=setInterval(()=>{if(performance.now()-t0>D*.35)smokeFrom(el,smokeCol,res.st==='carbonise'?2:1)},260);
  await new Promise(done=>{(function tick(){
    const el2=performance.now()-t0,p=Math.min(1,el2/D),s=Math.round(total*(1-p));
    disp.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    if(plaque){
      const pc=target;
      if(!darkened&&p>.5&&['brule','carbonise'].includes(res.st)){darkened=true;pc.style.filter=res.st==='carbonise'?'brightness(.2)':'brightness(.55) sepia(.6)';}
      if((gesture==='flip'||gesture==='fold')&&el2>1400&&!G.flipOpen)flipPrompt();
      if(G.flip==='plafond')return done();
      if(res.st==='deborde'&&!boiled&&p>.5){boiled=true;sfx.splash();}
    }
    if(p<1)requestAnimationFrame(tick);else done();})();});
  clearInterval(smokeT);
  if(plaque){document.querySelectorAll('.cue,.meter,.spoon').forEach(x=>x.remove());$(app==='poele'?'burnP':'burnC').classList.remove('on');}
  else{target.classList.remove('on');target.innerHTML='';}
  disp.textContent='';
  /* effets des gestes */
  if(gesture){
    G.on=false;G.flipOpen=false;
    if(gesture==='stir'&&G.stir<G.need&&['parfait','cru'].includes(res.st))res={st:'attache',why:'Il faut remuer pendant toute la cuisson, sinon ça colle au fond et ça brûle.'};
    if((gesture==='flip'||gesture==='fold')){
      if(G.flip==='plafond'){clearPans();plafond(rid);return;}
      if(G.flip==='weak'&&res.st==='parfait')res={st:'mou',why:'Geste trop mou : la crêpe s\'est repliée sur elle-même. Un petit coup sec vers le haut !'};
      if(!G.flip&&res.st==='parfait')res={st:'brule',why:gesture==='flip'?'Il fallait la retourner : un côté a brûlé !':"Il fallait plier l'omelette : le dessous a brûlé !",anna:gesture==='flip'?'Oups, tu as oublié de retourner la crêpe !':"Oups, tu as oublié de plier l'omelette !"};
    }
  }

  sfx.ding();
  $('bowl').classList.add('hidden');
  const smoky=['brule','carbonise','vert','attache'].includes(res.st),wc=res.st==='vert'?'#7ddc5a':'#8f96a3';
  $('plate').innerHTML=plateSVG+`<div class="pdish st-${res.st}">${dishSVG(rid)}</div>`+(smoky?[0,1,2].map(i=>`<div class="wisp" style="left:${100+i*40}px;top:40px;--sc:${wc};animation-delay:${i*.5}s"></div>`).join(''):'');
  $('plate').classList.remove('hidden');
  const p=P();
  if(res.st==='parfait'){burst($('plate'),['✨','⭐','✨'],10);p.found[rid]=true;S.k.result.fresh=!(owned('r_'+rid)||pending('r_'+rid));p.c.streak++;award('r_'+rid);if(fromG){award('assiette');gEv('dish');}if(p.c.streak>=5)award('chef5');if(REAL.filter(k=>!(isA()&&SID['r_'+k]&&SID['r_'+k].raf)).every(k=>p.found[k]))award('carnet');}
  else p.c.streak=0;
  saveDB();
  ({vert:'vert',carbonise:'carbo',attache:'attache',rate:'rate'})[res.st]&&award(({vert:'vert',carbonise:'carbo',attache:'attache',rate:'rate'})[res.st]);
  S.k.phase='result';renderBtns();
  say(T(res.anna||(res.st==='rate'?`${LINES.rate[0]} ${cap(R.art)}, ça se cuit ${WHERE[R.app]}.`:LINES[res.st][0]),LINES[res.st][1]+res.why),isA()?undefined:LINES[res.st][1]);
}

function renderTools(){$('gTools').innerHTML=TOOLS().map(t=>`<button class="tool ${t.seed?'seed':''} ${GS.tool===t.id?'sel':''}" data-t="${t.id}"><div class="ti">${toolIcon(t)}</div>${t.n}</button>`).join('');}
function renderInv(){
  const g=G_(),row=(ico,n,act,cls,key)=>`<div class="inv ${n?'':'empty'}" data-k="${key}"><div class="ii">${ico}</div>${n}${act?`<span class="ia ${cls||''}">${act}</span>`:''}</div>`;
  $('gInv').innerHTML='<h3>🧺 Mon panier</h3>'+
    row('<span>🥕</span>',g.stock.carotte,g.stock.carotte?'🐶 Wanji':'',g.stock.carotte?'go':'','carotte')+
    row(RADIS,g.stock.radis,g.stock.radis?'🐶 Wanji':'',g.stock.radis?'go':'','radis')+
    row('<span>🌾</span>',g.stock.ble,g.stock.ble?'→ moulin':'','','ble')+
    row(FLOWER(g.flowers[0]||'#ff5c8a'),g.flowers.length,g.flowers.length>=3?'Bouquet':'',g.flowers.length>=3?'go':'','fleurs')+
    row('<span>🍓</span>',g.fridge.fraise,'frigo','','fraise')+
    row('<span>🍅</span>',g.fridge.tomate,'frigo','','tomate')+
    row(FARINE,g.fridge.farine,'frigo','','farine')+(fromOpen()?row('<span>🥔</span>',g.fridge.pdt||0,'frigo','','pdt'):'');
}
function plotHTML(i){
  const p=G_().plots[i],A=isA();
  let h=SOIL;
  if(p.c){
    h+=`<div class="pl">${p.dead?plantSVG({...p,st:Math.max(p.st,2)}):plantSVG(p)}</div>`;
    if(p.w>100)h+='<div class="puddle"></div>';
    if(p.aph)h+=APH;
    if(!p.dead&&p.w<25)h+='<div class="thirst">💧</div>';
    if(p.pol&&p.st===3)h+='<div class="pol">✨</div>';
    if(!A&&!p.dead)h+=`<div class="gauge"><i style="width:${Math.min(100,p.w)}%" class="${p.w>100?'hi':p.w<25?'lo':''}"></i></div>`;
  }
  if(p.weed)h+=`<div class="weeds">${WEEDS}</div>`;
  return h;
}
function plotSig(p){return [p.c,p.st,p.dead,p.weed,p.aph>0,p.w>100,p.w<25,p.pol,p.burn>0,p.w<=0].join('|');}
function renderPlot(i,force){
  const p=G_().plots[i],el=document.querySelector(`.plot[data-i="${i}"]`);if(!el)return;
  const sig=plotSig(p);
  if(force||GS.sig[i]!==sig){GS.sig[i]=sig;el.innerHTML=plotHTML(i);
    el.classList.toggle('dry',!!p.c&&!p.dead&&p.w<=0);el.classList.toggle('dead',!!p.dead);el.classList.toggle('burn',p.burn>0);el.classList.toggle('ripe',p.st===4&&!p.dead);}
  else if(!isA()){const gi=el.querySelector('.gauge i');if(gi){gi.style.width=Math.min(100,p.w)+'%';}}
}
function renderGarden(){
  $('gPlots').innerHTML=PLOTXY.map(([x,y],i)=>`<div class="plot" data-i="${i}" style="left:${x}px;top:${y}px"></div>`).join('');
  GS.sig=[];G_().plots.forEach((_,i)=>renderPlot(i,true));renderTools();renderInv();renderObj();renderDeco();updGift();
}
function seen(k){const g=G_();if(g.seen[k])return true;g.seen[k]=1;saveDB();return false;}

function enterGarden(){
  go('s-garden');G_();renderGarden();
  $('gWanji').innerHTML=wanjiSVG();
  clearInterval(GS.timer);GS.timer=setInterval(gTick,250);
  if(!G_().obj)newObj();
  if(!seen('intro'))say(T('Bienvenue au jardin ! Choisis une graine, puis touche la terre.','Le jardin ! Plante, arrose, protège tes plantes. Les abeilles aident les fraises et les tomates à faire des fruits.'));
  else{const o=G_().obj;say(T(o.x+' !','Objectif : '+o.x+'.'));}
}
function leaveGarden(){clearInterval(GS.timer);GS.timer=null;if(GS.bee){GS.bee.el.remove();GS.bee=null;}saveDB();}

/* le temps qui passe (seulement quand on est au jardin) */
let gSave=0;
function gTick(){
  if(S.screen!=='s-garden'){leaveGarden();return;}
  const A=isA(),g=G_();
  g.plots.forEach((p,i)=>{
    if(!p.c){if(!p.weed&&Math.random()<(A?.0006:.0012))p.weed=true;renderPlot(i);return;}
    if(p.dead){renderPlot(i);return;}
    p.w=Math.max(0,p.w-(A?.3:.55)-(p.w>100?.8:0));
    if(!p.weed&&Math.random()<(A?.0012:.0025))p.weed=true;
    if(p.st>=1&&p.st<4&&p.aph<3&&Math.random()<(A?.001:.002)){p.aph++;if(!seen('aph'))say(T('Des pucerons ! Écrase-les avec la main ou appelle les coccinelles.','Des pucerons ! Écrase-les à la main, ou envoie les coccinelles : elles les mangent.'));}
    if(p.w<=0){p.dry=(p.dry||0)+1;if(!A&&p.dry>40){p.dead=true;say('Oh non, une plante est morte de soif ! Arrache-la avec la main.');}}else p.dry=0;
    if(p.w<25)p.everDry=1;
    if(p.w<25&&p.w>0&&!p.thirsty){p.thirsty=1;if(!seen('thirst'))say(T('Ta plante a soif ! Prends l\'arrosoir.','Une plante a soif : surveille la jauge bleue.'));}
    if(p.w>=25)p.thirsty=0;
    let m=1;if(p.f===1)m*=1.7;if(p.weed)m*=.3;if(p.aph)m*=.3;if(p.burn>0){m=0;p.burn--;}
    if(p.w<=0||p.w>100||p.st===4)m=0;
    const fruit=CROPS[p.c].fruit;
    if(p.st===3&&fruit&&!p.pol&&p.gr>=100)m=0;
    p.gr+=(A?2:1.25)*CROPS[p.c].sp*m;
    if(p.gr>=100&&p.st<4&&!(p.st===3&&fruit&&!p.pol)){p.st++;p.gr=0;if(p.st===4&&!seen('ripe'))say(T("C'est prêt ! Récolte avec la main.",'Une plante est mûre : récolte-la avec la main.'));}
    renderPlot(i);
  });
  /* abeilles : elles viennent quand une fleur de fraisier ou de tomate attend */
  if(!GS.bee){GS.beeWait++;const i=g.plots.findIndex(p=>p.c&&!p.dead&&p.st===3&&CROPS[p.c].fruit&&!p.pol&&p.gr>=40);
    if(i>=0&&GS.beeWait>(gUnl().ruche?3:10)){GS.beeWait=0;launchBee(i);}}
  if(GS.tickN=(GS.tickN||0)+1,GS.tickN%8===0)gEv('state');
  if(++gSave>20){gSave=0;saveDB();}
}
function plotCenter(i){const [x,y]=PLOTXY[i];return {x:x+140,y:y+70};}
function launchBee(i){
  const el=document.createElement('div');el.className='bee';el.textContent='🐝';$('s-garden').appendChild(el);
  const t=plotCenter(i),sx=1200,sy=rnd(140,300);
  const bee={el,i,state:'fly'};GS.bee=bee;
  const fr=[];for(let k=0;k<=20;k++){const u=k/20;fr.push({transform:`translate(${sx+(t.x-sx)*u-28}px,${sy+(t.y-sy)*u+Math.sin(u*12)*30-28}px) scaleX(-1)`});}
  bee.anim=el.animate(fr,{duration:2600,easing:'ease-in-out',fill:'forwards'});
  sfx.bzz();
  bee.anim.onfinish=async()=>{
    if(GS.bee!==bee)return;bee.state='hover';
    el.animate([{transform:`translate(${t.x-28}px,${t.y-28}px) rotate(-8deg)`},{transform:`translate(${t.x-24}px,${t.y-32}px) rotate(8deg)`}],{duration:220,iterations:8,direction:'alternate'});
    await sleep(1800);if(GS.bee!==bee)return;
    const p=G_().plots[i];if(p.c&&p.st===3){p.pol=true;renderPlot(i,true);burst(document.querySelector(`.plot[data-i="${i}"]`),['✨','🌼'],5,70);award('abeille');
      if(!seen('bee'))say(T("L'abeille butine la fleur : bientôt un fruit !","L'abeille a pollinisé la fleur : le fruit va pouvoir pousser."));}
    beeAway(bee);
  };
  onTap(el,()=>{if(GS.bee!==bee)return;say(T("Laisse-la ! L'abeille aide les fleurs à devenir des fruits.","Ne chasse pas les abeilles : sans elles, pas de fraises ni de tomates !"));beeAway(bee);});
}
function beeAway(bee){
  if(GS.bee===bee)GS.bee=null;GS.beeWait=0;
  const c=pos(bee.el);bee.anim&&bee.anim.cancel();
  bee.el.animate([{transform:`translate(${c.x-28}px,${c.y-28}px)`},{transform:`translate(${c.x+300}px,${c.y-400}px)`}],{duration:1200,easing:'ease-in',fill:'forwards'}).onfinish=()=>bee.el.remove();
}

/* ---------- objectifs du jardin ---------- */
const OBJ_NANA=[
  {t:'harvest',crop:'carotte',n:2,x:'Récolte 2 carottes'},{t:'harvest',crop:'fraise',n:3,x:'Récolte 3 fraises'},
  {t:'harvest',crop:'radis',n:2,x:'Récolte 2 radis'},{t:'harvest',crop:'fleurs',n:2,x:'Cueille 2 fleurs'},
  {t:'harvest',crop:'tomate',n:2,x:'Récolte 2 tomates'},{t:'water',n:5,x:'Arrose 5 fois tes plantes'},
  {t:'wanji',crop:'carotte',n:1,x:'Donne une carotte à Wanji'},{t:'full',n:6,x:'Plante dans les 6 parcelles'},
  {t:'bouquet',n:1,x:'Fais un bouquet'},{t:'weed',n:3,x:'Arrache 3 mauvaises herbes'}];
const OBJ_RAF=[
  {t:'harvest',crop:'fraise',n:6,x:'Récolte 6 fraises'},{t:'harvest',crop:'tomate',n:4,x:'Récolte 4 tomates'},
  {t:'harvest',crop:'carotte',n:4,x:'Récolte 4 carottes'},{t:'moulin',n:2,x:'Fais 2 sacs de farine au moulin'},
  {t:'cocci',n:2,x:'Sauve 2 plantes des pucerons avec les coccinelles'},{t:'weed',n:6,x:'Arrache 6 mauvaises herbes'},
  {t:'diverse',n:4,x:'Fais pousser 4 cultures différentes en même temps'},{t:'full',n:6,x:'Occupe les 6 parcelles en même temps'},
  {t:'nothirst',n:3,x:"Récolte 3 plantes qui n'ont jamais eu soif"},{t:'bouquetc',n:4,x:'Fais un bouquet de 4 couleurs différentes'},
  {t:'dish',n:1,x:'Réussis un plat avec une récolte du jardin'},{t:'wanji',crop:'carotte',n:2,x:'Donne 2 carottes à Wanji'}];
/* cadeaux du jardin, débloqués par le nombre d'objectifs réussis */
const UNLOCKS=[{k:'epouvantail',at:1,n:'un épouvantail'},{k:'ruche',at:3,n:'une ruche : les abeilles viennent plus vite'},{k:'tournesol',at:5,n:'des graines de tournesol'},{k:'tuyau',at:7,n:'un tuyau qui arrose tout le jardin'}];
function gUnl(){const d=S.player?(G_().objDone||0):0;return Object.fromEntries(UNLOCKS.map(u=>[u.k,d>=u.at]));}
function objIcon(o){return {harvest:cropIcon(o.crop||'carotte'),water:CAN,wanji:'<span>🐶</span>',full:'<span>🌱</span>',bouquet:'<span>💐</span>',bouquetc:'<span>💐</span>',weed:'<span>🌿</span>',moulin:'<span>🥖</span>',cocci:'<span>🐞</span>',diverse:'<span>🧑‍🌾</span>',nothirst:'<span>💧</span>',dish:'<span>🍽️</span>'}[o.t];}
function newObj(){
  const g=G_(),pool=isA()?OBJ_NANA:OBJ_RAF;let o;
  do{o=pick(pool);}while(pool.length>1&&g.lastObj===o.x);
  g.obj={...o,p:0};g.lastObj=o.x;saveDB();renderObj();
}
function renderObj(){
  const el=$('gObj');if(!el)return;const o=G_().obj;if(!o){el.classList.add('hidden');return;}
  el.classList.remove('hidden');const pr=Math.min(o.p,o.n);
  const next=UNLOCKS.find(u=>(G_().objDone||0)<u.at);
  el.innerHTML=`<div class="oi">${objIcon(o)}</div><div class="ot"><div class="ox">${o.x}</div>${isA()?`<div class="od">${Array.from({length:o.n},(_,k)=>`<i class="${k<pr?'on':''}"></i>`).join('')}</div>`:`<div class="ob"><i style="width:${pr/o.n*100}%"></i></div><div class="on">${pr}/${o.n}${next?` · prochain cadeau : ${next.n.split(' :')[0]} (${G_().objDone||0}/${next.at})`:''}</div>`}</div><div class="orw">⭐</div>`;
}
function gEv(type,d={}){
  if(!S.player)return;const g=G_(),o=g.obj;if(!o||o.done)return;const before=o.p;
  if(o.t==='harvest'&&type==='harvest'&&d.c===o.crop)o.p+=d.n;
  else if(o.t==='nothirst'&&type==='harvest'&&d.nothirst)o.p++;
  else if(o.t==='bouquetc'&&type==='bouquet'&&new Set(d.cols).size>=o.n)o.p=o.n;
  else if(o.t==='wanji'&&type==='wanji'&&d.c===o.crop)o.p++;
  else if(['water','bouquet','moulin','cocci','weed','dish'].includes(o.t)&&type===o.t)o.p++;
  else if(type==='state'&&(o.t==='full'||o.t==='diverse')){const alive=g.plots.filter(p=>p.c&&!p.dead);o.p=Math.max(o.p,o.t==='full'?alive.length:new Set(alive.map(p=>p.c)).size);}
  if(o.p===before)return;
  saveDB();if(S.screen==='s-garden')renderObj();
  if(o.p>=o.n)objDone();
}
async function objDone(){
  const g=G_(),p=P();g.obj.done=true;g.objDone=(g.objDone||0)+1;p.stars++;saveDB();
  sfx.fanfare();if(S.screen==='s-garden'){const el=$('gObj');el.classList.add('win');burst(el,['⭐','✨','🎉'],12,180);}
  award('obj1');if(g.objDone>=10)award('obj10');if(p.stars>=5)award('star5');if(p.stars>=JARDIN)award('star10');if(p.stars>=20)award('star20');
  const u=UNLOCKS.find(x=>x.at===g.objDone);
  say(T('Objectif réussi ! Une étoile !'+(u?' Cadeau : '+u.n.split(' :')[0]+' !':''),`Objectif réussi : +1 étoile (${p.stars}).`+(u?` Nouveau : ${u.n}.`:'')),T(undefined,'Objectif réussi !'));
  await sleep(2600);if(S.screen==='s-garden'){$('gObj').classList.remove('win');renderDeco();renderTools();}
  newObj();
}
function renderDeco(){
  const u=gUnl();
  $('gScare').classList.toggle('hidden',!u.epouvantail);$('gHive').classList.toggle('hidden',!u.ruche);
}
onTap($('gScare'),()=>{sfx.flip();$('gScare').animate([{transform:'rotate(0)'},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'rotate(0)'}],{duration:600});say(T("C'est l'épouvantail ! Il fait peur aux oiseaux.","L'épouvantail éloigne les oiseaux qui picorent les graines."),T(undefined,false));});
onTap($('gHive'),()=>{sfx.bzz();burst($('gHive'),['🐝','🍯'],4,70);say(T('La ruche ! Les abeilles font du miel.','La ruche : les abeilles butinent plus souvent les fleurs.'),T(undefined,false));});
onTap($('gObj'),()=>{const o=G_().obj;if(o)say(T(o.x+' !','Objectif : '+o.x+'.'),T(o.x+' !',false));});

/* outils */
onTap($('gTools'),e=>{const b=e.target.closest('[data-t]');if(!b)return;GS.tool=b.dataset.t;sfx.click();renderTools();});
onTap($('gPlots'),e=>{
  const el=e.target.closest('.plot');if(!el)return;const i=+el.dataset.i,g=G_(),p=g.plots[i],A=isA(),t=GS.tool;
  if(t.startsWith('seed:')){
    const c=t.slice(5);
    if(p.c){say(T(p.st===4?"C'est prêt ! Prends la main pour récolter.":'Il y a déjà une plante ici.',p.st===4?'Récolte d\'abord avec la main.':'Parcelle occupée.'));return;}
    if(p.weed){say(T("Arrache d'abord les mauvaises herbes avec la main !",'Désherbe avant de semer.'));return;}
    g.plots[i]={c,st:0,gr:0,w:A?60:45,f:0,weed:false,aph:0,pol:false,dry:0,dead:false,burn:0,col:pick(FCOL)};
    sfx.pop();renderPlot(i,true);burst(el,['🌱'],3,50);gEv('plant',{c});
    if(!seen('plant'))say(T('Bravo ! Maintenant, arrose avec l\'arrosoir.','Semé. Garde la jauge d\'eau dans le bleu.'));
    saveDB();return;
  }
  if(t==='eau'){
    sfx.splash();burst(el,['💧','💦'],5,70);
    if(!p.c)return;
    gEv('water');
    if(A){if(p.w>=95){award('noyee');say("Elle a assez bu ! Trop d'eau, ça noie les racines.");}p.w=Math.min(100,p.w+35);}
    else{p.w+=35;if(p.w>100){award('noyee');if(!seen('noyee'))say("Trop d'eau : les racines se noient et la plante ne pousse plus tant que ça n'a pas séché.");}}
    renderPlot(i,true);return;
  }
  if(t==='tuyau'){
    sfx.splash();g.plots.forEach((q,j)=>{if(q.c&&!q.dead){q.w=A?Math.min(100,q.w+35):q.w+35;renderPlot(j,true);burst(document.querySelector(`.plot[data-i="${j}"]`),['💧'],3,60);}});
    gEv('water');if(!A&&g.plots.some(q=>q.c&&q.w>100)){award('noyee');say('Attention, le tuyau arrose tout : certaines plantes ont trop d\'eau !');}
    return;
  }
  if(t==='engrais'){
    if(!p.c||p.dead){say(T("Il faut d'abord une plante !",'Rien à nourrir ici.'));return;}
    if(A){if(p.f>=1){say('Une seule dose suffit !');return;}p.f=1;}
    else{p.f=(p.f||0)+1;if(p.f>=2){p.f=1;p.burn=32;renderPlot(i,true);say("Trop d'engrais : les feuilles brûlent et jaunissent ! Une seule dose suffit.");return;}}
    sfx.pop();burst(el,['✨','🌿'],4,60);if(!seen('engrais'))say(T('Miam, ça fait pousser plus vite !','Engrais : la plante pousse plus vite. Une dose, pas plus.'));renderPlot(i,true);return;
  }
  if(t==='cocci'){
    if(!p.aph){say(T("Pas de pucerons ici !",'Aucun puceron sur cette plante.'));return;}
    const c=pos(el);fly('<span style="font-size:44px">🐞</span>',$('gTools'),null,{dur:700,size:50,arc:120,to:{x:c.x,y:c.y-20}}).then(()=>{p.aph=0;renderPlot(i,true);burst(el,['🐞','🐞','✨'],5,60);sfx.crunch();award('coccinelle');gEv('cocci');
      if(!seen('cocci'))say(T('Les coccinelles ont mangé les pucerons !','Les coccinelles mangent les pucerons : un allié naturel du jardin.'));});
    return;
  }
  /* la main : écraser, désherber, arracher, récolter */
  if(p.aph){p.aph=0;sfx.squish();burst(el,['💥'],3,50);renderPlot(i,true);return;}
  if(p.weed){p.weed=false;g.c.weeds++;sfx.squish();burst(el,['🌿'],4,70);if(g.c.weeds>=10)award('desherbe');gEv('weed');renderPlot(i,true);saveDB();return;}
  if(p.dead){g.plots[i]={c:null};sfx.trash();renderPlot(i,true);saveDB();return;}
  if(p.c&&p.st===4){harvest(i,el);return;}
  if(p.c)say(T("Pas encore prêt ! Attends qu'il pousse.",'Pas encore mûr.'),false);
  else say(T('Choisis une graine en bas !','Choisis une graine dans la barre du bas.'),false);
});
async function harvest(i,el){
  const g=G_(),p=g.plots[i],c=p.c,n=CROPS[c].yield;
  g.plots[i]={c:null};renderPlot(i,true);sfx.pop();
  await fly(c==='fleurs'?FLOWER(p.col):c==='tournesol'?'<span style="font-size:52px">🌻</span>':cropIcon(c).replace('<span>','<span style="font-size:52px">'),el,$('gInv'),{dur:600,size:64,arc:100});
  if(c==='fleurs')g.flowers.push(p.col);else if(c==='tournesol')for(let k=0;k<n;k++)g.flowers.push('#ffc83a');else if(c==='fraise'||c==='tomate'||c==='pdt')g.fridge[c]=(g.fridge[c]||0)+n;else g.stock[c]+=n;
  g.c.harv++;sfx.ding();award('j_'+c);if(g.c.harv>=30)award('recolte30');saveDB();renderInv();
  say(T(c==='fraise'||c==='tomate'?`Super récolte ! Elles vont dans le frigo de la cuisine.`:`Super récolte !`,c==='fraise'||c==='tomate'?`Récolte : ${n} ${CROPS[c].n.toLowerCase()}s, rangées dans le frigo.`:`Récolte : ${CROPS[c].n.toLowerCase()}.`));
  gEv('harvest',{c,n,nothirst:!p.everDry});
}

/* panier : Wanji, moulin, bouquet */
onTap($('gInv'),e=>{
  const r=e.target.closest('.inv');if(!r)return;const k=r.dataset.k,g=G_();
  if((k==='carotte'||k==='radis')&&g.stock[k]>0){
    g.stock[k]--;renderInv();
    fly(k==='radis'?RADIS:'<span style="font-size:52px">🥕</span>',r,$('gWanji'),{dur:600,size:60,arc:80}).then(()=>{
      const w=$('gWanji').querySelector('.wj');w.classList.remove('happy','yuck');void w.offsetWidth;
      if(k==='carotte'){w.classList.add('happy');sfx.bark();sfx.crunch();burst($('gWanji'),['❤️','🥕'],6,80);award('wcarotte');gEv('wanji',{c:'carotte'});say(T('Wanji adore les carottes !','Les carottes sont bonnes pour les chiens : Wanji adore !'));}
      else{w.classList.add('yuck');sfx.yuck();burst($('gWanji'),['😝'],3,60);say(T('Beurk, ça pique ! Wanji fait la grimace.','Le radis pique un peu : Wanji fait la grimace.'));}
      setTimeout(()=>w.classList.remove('happy','yuck'),2200);saveDB();});
    return;

/* barre des étapes */
function renderBar(){

    `<button class="btn b-blue fbtn2" id="fCaveBtn">🕯️ Cave${F_().cave.length?` (${F_().cave.length})`:''}</button><button class="btn fbtn2" id="fPlatBtn">🧀 Plateau</button>`;
}
function fNext(){FS.i++;runStep();}
function chooseRow(opts,key,cb){return `<div class="frow">${opts.map(([l,v,ico])=>`<button class="fopt" data-k="${key}" data-v="${v}">${ico||''}<span>${l}</span></button>`).join('')}</div>`;}

function runStep(){
  renderBar();const id=FS.ch,c=CH[id],s=FS.steps[FS.i],A=isA();
  const W=$('fWork');
  if(s==='chauffe'){
    W.innerHTML=`<div class="fstep"><h3>🔥 Chauffe le lait</h3><div class="cuve" id="fCuve">${cuveSVG('lait')}</div>${A?chooseRow([['Froid',12,'❄️'],['Tiède',32,'🌤️'],['Chaud',55,'🔥']],'temp'):`<div class="rrow"><button class="step" data-fs="-1">−</button><div class="rval" id="fT">${FS.temp||20} °C</div><button class="step" data-fs="1">+</button></div><input type="range" id="fTr" min="5" max="70" value="${FS.temp||20}"><div class="pfoot"><button class="btn b-orange" id="fGo">🔥 Chauffer</button></div>`}</div>`;
    if(!A){FS.temp=FS.temp||20;}
    say(T('Le lait doit être tiède, ni froid ni chaud !',`Chauffe le lait. ${c.n} : autour de ${Math.round((c.t[0]+c.t[1])/2)} °C.`));
    return;
  }
  if(s==='presure'){
    W.innerHTML=`<div class="fstep"><h3>💧 Présure et ferments</h3><div class="cuve small">${cuveSVG('chaud')}</div><div class="drops"><button class="dropper" id="fDrop">🧪 Ajouter une goutte</button><div class="dc" id="fDc">${FS.drops} goutte${FS.drops>1?'s':''}</div></div>${A?'':`<div class="frow sm">${[['Aucune','none','⚪'],['Blanche','blanche','🤍'],['Bleue','bleue','💙'],['Rouge','rouge','🧡']].map(([l,v,i])=>`<button class="fopt ${FS.flore===v?'sel':''}" data-k="flore" data-v="${v}">${i}<span>${l}</span></button>`).join('')}</div>`}<div class="pfoot"><button class="btn b-orange" id="fGo" ${A?'disabled':''}>Suivant</button></div></div>`;
    say(T('3 gouttes de présure : elle transforme le lait en flan !',`Présure : ${c.d[0]} à ${c.d[1]} gouttes, elle fait cailler le lait. Flore : blanche = duvet blanc, bleue = bleu, rouge = croûte orange qui sent fort, aucune = pâte nature.`));
    return;
  }
  if(s==='caille'){
    W.innerHTML=`<div class="fstep"><h3>⏳ Le lait caille…</h3><div class="cuve" id="fCuve">${cuveSVG('chaud')}</div><div class="fhint2" id="fCh">Attends…</div></div>`;
    say(T('On attend que le lait devienne du caillé…','Caillage en cours…'),false);
    setTimeout(()=>{
      if(FS.steps[FS.i]!=='caille')return;
      const okT=FS.temp>=c.t[0]-3&&FS.temp<=c.t[1]+3,okD=FS.drops>=c.d[0];
      if(!okT||!okD){fFail(!okT?(FS.temp>c.t[1]?'Lait trop chaud : les ferments sont morts, rien ne caille !':'Lait trop froid : rien ne caille !'):'Pas assez de présure : rien ne caille !');return;}
      $('fCuve').innerHTML=cuveSVG('caille');$('fCh').textContent=T('Touche le caillé avec ton doigt !','Teste le caillé du doigt : il doit se casser net.');
      FS.ready=true;say(T('Touche le caillé avec ton doigt !','Teste le caillé du doigt.'));
    },3200);
    FS.ready=false;return;
  }
  if(s==='tranche'){
    FS.passes=0;
    W.innerHTML=`<div class="fstep"><h3>🎼 Tranche le caillé</h3><div class="harp" id="fHarp"><div class="hl" id="fHl"></div></div><div class="dc" id="fPc">0 passage</div>${A?'':'<div class="pfoot"><button class="btn b-orange" id="fGo">Suivant</button></div>'}</div>`;
    say(c.g[0]>=7?T('Coupe, coupe, coupe ! Tout petit, comme des grains de riz : comme ça l\'eau s\'en va.','Tranche à la harpe : grains fins comme du riz. Plus les grains sont petits, plus le petit-lait s\'échappe, plus le fromage sera dur.')
      :c.g[0]>=4?T('Coupe en morceaux comme des noisettes !','Tranche à la harpe : grains moyens, comme des noisettes. Une partie de l\'eau s\'en va.')
      :T('Pas trop ! De gros morceaux, pour un fromage tout mou.','Tranche à la harpe : quelques passages seulement. De gros morceaux gardent leur eau : la pâte restera molle.'));
    return;
  }
  if(s==='cuisson'){
    FS.ct=32;
    W.innerHTML=`<div class="fstep"><h3>🥄 Cuis le caillé en remuant</h3><div class="cuve stir" id="fStir">${cuveSVG('caille','#f8e7b6')}</div><div class="rval" id="fCt">32 °C</div><div class="pfoot"><button class="btn b-orange" id="fGo">✋ Stop</button></div></div>`;
    say(T('Remue ! En chauffant, les grains rétrécissent et crachent leur eau.','Remue pour chauffer le caillé, arrête vers 54 °C : les grains rétrécissent et rejettent encore du petit-lait.'));
    return;
  }
  if(s==='moule'){
    FS.meter=0;FS.louche=0;
    W.innerHTML=c.m==='louche'?`<div class="fstep"><h3>🥄 Moule à la louche</h3><div class="moulds" id="fMould">${[0,1,2,3,4].map(k=>`<div class="mould"><i style="height:0%"></i></div>`).join('')}</div><button class="btn b-blue" id="fLouche">🥄 Une louche</button>${A?'':'<div class="pfoot"><button class="btn b-orange" id="fGo">Suivant</button></div>'}</div>`
      :`<div class="fstep"><h3>🗜️ Presse le fromage</h3><div class="press" id="fPress">${cheeseSVG(id)}</div><div class="meter2"><i id="fPm"></i></div><button class="btn b-blue" id="fLever">⬇️ Appuie sur le levier</button></div>`;
    say(c.m==='louche'?T('5 louches, une par moule ! On ne presse pas : il reste tout mou.','Une louche par moule : 5 louches. Pas de presse : l\'eau s\'égoutte toute seule, la pâte restera molle.'):T('Appuie fort ! Ouste, l\'eau !','Presse pour chasser le petit-lait : moins d\'eau, pâte plus ferme.'));
    return;
  }
  if(s==='sel'){
    FS.meter=0;
    W.innerHTML=`<div class="fstep"><h3>🧂 Sale le fromage</h3><div class="rub" id="fRub">${cheeseSVG(id)}</div><div class="meter2"><i id="fRm"></i></div><div class="fhint2">${T('Frotte avec ton doigt !','Frotte le sel sur toute la croûte.')}</div>${A?'':'<div class="pfoot"><button class="btn b-grey" id="fNoSel">Sans sel</button></div>'}</div>`;
    say(T('Frotte le sel avec ton doigt !','Frotte le sel.'));
    return;
  }
  if(s==='sign')return runSign();
  if(s==='cave'){
    if(F_().cave.length>=6){say(T('La cave est pleine ! Sors un fromage.','Cave pleine (6 places) : sors un fromage prêt.'));openCave();return;}
    W.innerHTML=`<div class="fstep"><h3>🕯️ Direction la cave</h3><div class="fc big">${cheeseSVG(id)}</div>${A?'<div class="pfoot"><button class="btn b-orange" id="fCaveGo" data-cv="froide">🕯️ Dans la cave</button></div>':'<div class="frow">'+[['Cave froide (12 °C)','froide','❄️'],['Cave chaude (22 °C)','chaude','🌡️']].map(([l,v,i])=>`<button class="fopt" id="fCaveGo" data-cv="${v}">${i}<span>${l}</span></button>`).join('')+'</div>'}</div>`;
    say(T(c.chaud?'Dans la cave chaude, des bactéries vont faire des bulles… des petits prouts dans le fromage !':`Il doit dormir en cave !`,`${c.n} : ${c.days} jours de cave. Choisis la cave${c.chaud?' (les trous ont besoin de chaleur)':''}.`));
    return;
  }
  if(s==='degust')return fDegust({ch:id,q:FS.q});
}

/* gestes : boutons et doigts dans la zone de travail */

$('fWork').addEventListener('pointerdown',e=>{

      if(A&&FS.louche>=5)setTimeout(()=>{if(FS.steps[FS.i]==='moule')fNext();},600);return;}

      if(FS.meter>=1)setTimeout(()=>{if(FS.steps[FS.i]==='moule')fNext();},400);return;}
    if(b.id==='fNoSel'){FS.q.nosel=1;sfx.click();fNext();return;}
    if(b.id==='fGo'&&s==='sign'){if(FS.meter<1){if(c.sg==='piquer')FS.q.blanc=1;else if(c.sg==='fondre')FS.q.attache=1;else FS.q.sign=1;}fNext();return;}

  }
  FD2={x:p.x,y:p.y,lx:p.x,ly:p.y,s};

    sfx[c.sg==='piquer'?'click':'squish']();burst($('fSign'),[{egoutter:'💧',presser:'✋',sangle:'🌲',piquer:'📍'}[c.sg]],1,60);

  }
});
$('fWork').addEventListener('pointermove',e=>{

/* cave */
function toCave(cv){
  const id=FS.ch,c=CH[id],f=F_();
  if(!isA()&&((c.chaud&&cv!=='chaude')||(!c.chaud&&cv==='chaude')))FS.q.cave=c.chaud?'froide':'chaude';
  f.cave.push({ch:id,start:Date.now(),q:{...FS.q},care:null,careSince:0});saveDB();fEv('cave',{ch:id});
  sfx.pop();FS.ch=null;
  const mins=Math.ceil(c.days*DAYMS(id)/60000);
  say(T(`Il dort en cave ! Reviens dans ${mins} minutes.`,`${c.n} en cave : prêt dans environ ${mins} min (${c.days} jours de fromage).`));
  renderChooser();
}
function caveDays(it){return (Date.now()-it.start)/DAYMS(it.ch);}
function openCave(){$('fCaveM').classList.remove('hidden');renderCave();sfx.click();
  say(T('La cave ! Les fromages dorment ici.','La cave : retourne et frotte les fromages quand ils le demandent.'),false);}

/* dégustation */
function fGrade(q){
  const major=['grain','flore','nosel','poilu','blanc','attache','cave','cuit'].filter(k=>q[k]);
  if(!major.length&&!q.amer&&!q.forme&&!q.sign)return {g:'parfait'};
  if(!major.length)return {g:'bon'};
  return {g:'rate',k:major[0]};
}
const RATE_TXT={grain:['Grains mal coupés : la pâte est ratée.','Mauvaise taille de grains : la texture est ratée.'],flore:['Pas la bonne flore !','Mauvaise flore : la croûte et le goût ne sont pas les bons.'],nosel:['Il est tout fade, sans sel !','Sans sel : fade et il se conserve mal.'],poilu:['Il est tout poilu !','Oublié en cave : une moisissure poilue a tout envahi.'],blanc:["Il est tout blanc, pas de bleu !","Pas piqué : l'air n'est pas entré, le bleu n'a pas poussé."],attache:['Ça a attaché au fond !','Ça a attaché : il fallait remuer.'],cave:['Mauvaise cave !',"Mauvaise cave : l'emmental a besoin de la cave chaude pour faire ses trous, les autres de la cave froide."],cuit:['Le caillé a mal cuit !','Cuisson du caillé ratée : il faut s\'arrêter entre 50 et 56 °C.']};
function fDegust(it){
  const id=it.ch,c=CH[id],r=isA()?{g:'parfait'}:fGrade(it.q),f=F_();FS.ch=null;FS.taste={id,r};
  renderBar();
  const label={parfait:T('Parfait !','Parfait !'),bon:T('Bon !','Bon, mais perfectible.'),rate:T('Raté…','Raté.')}[r.g];
  const fm=FAM[c.fam];
  $('fWork').innerHTML=`<div class="fstep"><h3>${c.n} : ${label}</h3><div class="dgrow"><div class="fc big ${it.q&&it.q.poilu?'poilu':''} ${r.g==='rate'?'bad':''}">${cheeseSVG(id)}</div><div class="dgfam"><b>${fm.e} ${fm.n}</b>${famLadder(c.fam)}${isA()?'':`<div class="dgx">${fm.x[1]}</div>`}</div></div><div class="frow"><button class="btn b-orange" id="fWanji">🐶 Faire goûter à Wanji</button><button class="btn" id="fKeep">🧀 Au frigo</button></div></div>`;
  if(r.g!=='rate'){f.stock[id]=(f.stock[id]||0)+1;f.made[id]=1;}
  if(r.g==='parfait'){f.found[id]=1;award(FST(id));burst($('fWork'),['✨','⭐','🧀'],10,200);sfx.fanfare();

    fEv('parfait',{ch:id});}
  else if(r.g==='rate'){if(r.k==='poilu')award('f_poilu');sfx.whine();}
  saveDB();
  const why=r.g==='rate'?RATE_TXT[r.k]:null;
  say(T(r.g==='rate'?why[0]:`${c.n} ! ${label}`,r.g==='rate'?why[1]:r.g==='bon'?`${c.n} réussi, avec un petit défaut (${it.q.amer?'trop de présure, amer':it.q.forme?'mauvais nombre de louches':'geste imparfait'}).`:`${c.n} parfait ! Famille : ${fm.n.toLowerCase()}.`),T(undefined,label));

}

function fEv(type,d={}){
  if(!S.player)return;const f=F_(),o=f.obj;if(!o||o.done)return;const b=o.p;
  if(o.t==='traite'&&type==='traite'&&(!o.a||o.a===d.a))o.p++;
  else if(o.t==='parfait'&&type==='parfait'&&d.ch===o.ch)o.p++;
  else if(o.t==='cave'&&type==='cave'&&d.ch===o.ch)o.p++;
  else if(o.t==='distinct'&&type==='parfait')o.p=Object.keys(f.found).length;
  else if(['wanji','soin','plateau'].includes(o.t)&&type===o.t)o.p++;
  if(o.p===b)return;saveDB();if(S.screen==='s-fromage')fObjRender();
  if(o.p>=o.n)fObjDone();
}

/* glisser un élément de l'écran avec le doigt */
function dragEl(el,{onMove,onUp,onDown}={}){
  let d=null;
  el.addEventListener('pointerdown',e=>{if(onDown&&onDown(e)===false)return;const p=stagePt(e);d={x:p.x,y:p.y,ox:parseFloat(el.style.left)||0,oy:parseFloat(el.style.top)||0,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.zIndex=30;e.stopPropagation();});
  el.addEventListener('pointermove',e=>{if(!d)return;const p=stagePt(e);if(Math.hypot(p.x-d.x,p.y-d.y)>6)d.moved=true;el.style.left=(d.ox+p.x-d.x)+'px';el.style.top=(d.oy+p.y-d.y)+'px';onMove&&onMove(p,d);});
  const up=e=>{if(!d)return;const p=stagePt(e),dd=d;d=null;el.style.zIndex='';onUp&&onUp(p,dd);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
