  const dbl=(x,y,ww,hh)=>longB(x-ww*.18,y,ww*.8,hh)+longB(x+ww*.38,y,ww*.8,hh);
  const skull=(x,y,ww,hh)=>`<ellipse cx="${x+ww/2}" cy="${y+hh*.42}" rx="${ww*.46}" ry="${hh*.42}" ${st}/><ellipse cx="${x+ww*.34}" cy="${y+hh*.48}" rx="${ww*.12}" ry="${hh*.1}" fill="#5a4a3a"/><ellipse cx="${x+ww*.66}" cy="${y+hh*.48}" rx="${ww*.12}" ry="${hh*.1}" fill="#5a4a3a"/><path d="M${x+ww*.5} ${y+hh*.6} l-${ww*.05} ${hh*.1} h${ww*.1}z" fill="#5a4a3a"/>`;
  const jaw=(x,y,ww,hh)=>`<path d="M${x+4} ${y+4} q${ww/2-4} ${hh*1.6} ${ww-8} 0 l-${ww*.12} ${hh*.1} q-${ww*.38} ${hh} -${ww*.76} 0z" ${st}/><g fill="#fff" stroke="${BS}" stroke-width="1.5">${[.3,.42,.54,.66].map(t=>`<rect x="${x+ww*t-4}" y="${y+2}" width="8" height="9" rx="2"/>`).join('')}</g>`;
  const ribs=(x,y,ww,hh)=>{let r='';for(let i=0;i<6;i++){const yy=y+12+i*(hh-24)/5,sp=ww*(.42-.03*Math.abs(i-2));r+=`<path d="M${x+ww/2} ${yy} q-${sp} 0 -${sp} ${hh*.08} M${x+ww/2} ${yy} q${sp} 0 ${sp} ${hh*.08}" fill="none" stroke="${BS}" stroke-width="9" stroke-linecap="round"/><path d="M${x+ww/2} ${yy} q-${sp} 0 -${sp} ${hh*.08} M${x+ww/2} ${yy} q${sp} 0 ${sp} ${hh*.08}" fill="none" stroke="${BC}" stroke-width="5" stroke-linecap="round"/>`;}
    return r+`<rect x="${x+ww/2-7}" y="${y+6}" width="14" height="${hh*.7}" rx="6" ${st}/>`;};
  const spine=(x,y,ww,hh)=>{let r='';const n=Math.round(hh/18);for(let i=0;i<n;i++)r+=`<rect x="${x+2}" y="${y+i*hh/n+1}" width="${ww-4}" height="${hh/n-3}" rx="4" ${st}/>`;return r;};
  const pelvis=(x,y,ww,hh)=>`<path d="M${x+ww/2} ${y+hh*.2} q-${ww*.5} -${hh*.3} -${ww*.48} ${hh*.4} q${ww*.08} ${hh*.5} ${ww*.3} ${hh*.55} q${ww*.12} -${hh*.3} ${ww*.18} -${hh*.3} q${ww*.06} 0 ${ww*.18} ${hh*.3} q${ww*.22} -${hh*.05} ${ww*.3} -${hh*.55} q${ww*.02} -${hh*.7} -${ww*.48} -${hh*.4}z" ${st}/><circle cx="${x+ww*.32}" cy="${y+hh*.62}" r="${ww*.07}" fill="#5a4a3a" opacity=".5"/><circle cx="${x+ww*.68}" cy="${y+hh*.62}" r="${ww*.07}" fill="#5a4a3a" opacity=".5"/>`;
  if(k==='crane')s=skull(0,0,w,h);
  else if(k==='machoire')s=jaw(0,0,w,h);
  else if(k==='cotes')s=ribs(0,0,w,h);
  else if(k==='colonne')s=spine(0,0,w,h);
  else if(k==='bassin')s=pelvis(0,0,w,h);

}

function pulseStart(){
  const A=isA();RN.phase='pulse';RN.taps=0;RN.good=0;RN.samp=[];RN.t0=0;if(A)RN.bpm=80;
  $('rCtl').innerHTML=`<div class="rnum">${T('Tape sur le cœur en même temps : boum, boum !','Prends ton pouls : touche le cœur à chaque battement pendant 10 secondes.')}</div><button class="pheart" id="pHeart">❤️</button><div class="rnum" id="pInfo" style="text-align:center">${A?'':'⏱️ Touche pour commencer'}</div>`;
  $('pHeart').addEventListener('pointerdown',pulseTap);
  say(T('Tape sur le cœur en même temps : boum, boum !','Touche le cœur à chaque battement pendant 10 secondes. Je multiplierai par 6.'));
}
function pulseTap(){
  const A=isA(),now=performance.now();if(RN.phase!=='pulse')return;
  if(A){const ph=now-RN.lastBeat,per=60000/RN.bpm,near=Math.min(ph,per-ph)<280;RN.taps++;if(near){RN.good++;burst($('pHeart'),['💓'],1,50);}
    $('pInfo').textContent='💓'.repeat(RN.good);if(RN.good>=6||RN.taps>=14)pulseEnd(true);return;}
  if(!RN.t0){RN.t0=now;RN.samp=[];cLater(()=>pulseEnd(),10000);const tick=cEvery(()=>{const s=Math.max(0,10-Math.floor((performance.now()-RN.t0)/1000));const i=$('pInfo');if(i)i.textContent=`⏱️ ${s} s · ${RN.taps} battements`;},200);}
  RN.taps++;
}
function pulseEnd(){
  const A=isA();RN.phase='rest';
  let ok=true,msg;
  if(A){msg='Bravo ! Tu as senti le cœur battre !';}
  else{const real=Math.round(RN.samp.reduce((a,b)=>a+b,0)/Math.max(1,RN.samp.length)),est=RN.taps*6;ok=Math.abs(est-real)<=Math.max(12,real*.12);
    msg=ok?`${RN.taps} battements en 10 s × 6 = ${est} par minute. Ton cœur battait à ${real} : bien compté ! Au repos, un enfant de 10 ans est entre 70 et 110.`:`Tu as compté ${est} par minute, le cœur battait à ${real}. Réessaie en touchant à chaque « boum ».`;}
  if(ok){award('c_pouls');firstStar('pouls'+AB());sfx.ding();}else sfx.whine();
  $('rCtl').innerHTML=`<div class="rnum">${msg}</div><div class="rspd" style="margin-top:10px">${ok?'':'<button class="lopt" data-rgo="pulse">💓<span>Recompter</span></button>'}<button class="lopt" data-rgo="sleep">😴<span>Faire dodo</span></button><button class="lopt" data-rgo="again">🏃<span>Rejouer</span></button></div>`;
  say(msg,T(undefined,ok?'Bien compté !':false));
}
function runGo(k){
  sfx.click();
  if(k==='again')return runStart();
  if(k==='pulse')return pulseStart();
  if(k==='sleep'){RN.phase='sleep';$('rTrack').insertAdjacentHTML('beforeend','<div class="zzz">💤</div>');
    say(T('Chut… le cœur ralentit quand on dort.','Pendant le sommeil, le cœur et la respiration ralentissent : le corps se répare.'));
    cLater(()=>{award('c_dodo');burst($('rBody'),['💤','⭐'],5,100);},6000);}
}

function ouieStart(){SN.n=0;SN.ok=0;SN.used=[];ouieRound();}
function ouieRound(){

  else{const s=pick(SOUNDS.filter(x=>!SN.used.includes(x.id)));SN.used.push(s.id);const ch=shuf([s,...shuf(SOUNDS.filter(x=>x!==s)).slice(0,2)]);SN.q={s,lock:false};

/* ===== circuit électrique ===== */
/* composants : pile (B+ / B-), ampoule (a/b), ampoule 2, interrupteur, LED (p = patte +, n = patte −) */
const CIRC_LV={
  nana:[{c:['bulb'],x:'Allume l\'ampoule !'},{c:['bulb','sw'],x:"Allume l'ampoule avec l'interrupteur !"}],
  raf:[{c:['bulb'],x:"Allume l'ampoule : le courant doit faire une boucle complète."},{c:['bulb','sw'],x:"Ajoute l'interrupteur dans la boucle, puis ferme-le."},{c:['bulb','bulb2'],x:'Allume les deux ampoules en série (une seule boucle).'},{c:['led'],x:'Allume la LED. Attention : elle a un sens, la patte + vers le + de la pile !'},{c:['bulb','sw','led'],x:"Boucle finale : pile, interrupteur, ampoule et LED dans le bon sens."}]
};
const CPOS={bulb:{x:620,y:110},bulb2:{x:620,y:250},sw:{x:460,y:390},led:{x:800,y:250}};
const CL={lv:0,wires:[],sel:null,sw:false};
function cTerms(c){const P0=CPOS[c];return c==='sw'?[{id:c+':a',x:P0.x-50,y:P0.y},{id:c+':b',x:P0.x+50,y:P0.y}]:c==='led'?[{id:c+':p',x:P0.x-22,y:P0.y+70,l:'+'},{id:c+':n',x:P0.x+22,y:P0.y+70,l:'−'}]:[{id:c+':a',x:P0.x-22,y:P0.y+64},{id:c+':b',x:P0.x+22,y:P0.y+64}];}
function circuitStart(){const L=L_(),lv=(isA()?CIRC_LV.nana:CIRC_LV.raf);CL.lv=Math.min(L.circ,lv.length-1);CL.wires=[];CL.sel=null;CL.sw=false;renderCircuit();say(T(lv[CL.lv].x+' Touche un rond, puis un autre.',lv[CL.lv].x),T(undefined,false));}
function circLevel(){return (isA()?CIRC_LV.nana:CIRC_LV.raf)[CL.lv];}
function allTerms(){const t=[{id:'B+',x:170,y:150,l:'+'},{id:'B-',x:170,y:330,l:'−'}];circLevel().c.forEach(c=>t.push(...cTerms(c)));return t;}
function evalCircuit(){
  const lv=circLevel(),adj={},add=(a,b,comp,dir)=>{(adj[a]=adj[a]||[]).push({to:b,comp,dir});};
  CL.wires.forEach(([a,b])=>{add(a,b,null);add(b,a,null);});
  lv.c.forEach(c=>{if(c==='sw'){if(CL.sw){add('sw:a','sw:b','sw');add('sw:b','sw:a','sw');}}
    else if(c==='led')add('led:p','led:n','led');else{add(c+':a',c+':b',c);add(c+':b',c+':a',c);}});
  const lit=new Set();let short=false;
  (function dfs(n,seen,comps){if(n==='B-'){const lamps=comps.filter(x=>x!=='sw');if(!lamps.length)short=true;lamps.forEach(x=>lit.add(x));return;}
    (adj[n]||[]).forEach(e=>{if(seen.has(e.to))return;seen.add(e.to);dfs(e.to,seen,e.comp?comps.concat(e.comp):comps);seen.delete(e.to);});})('B+',new Set(['B+']),[]);
  return {lit:short?new Set():lit,short};
}
function renderCircuit(){
  const lv=circLevel(),r=evalCircuit(),T_=allTerms(),pos=Object.fromEntries(T_.map(t=>[t.id,t]));
  let done=lv.c.filter(c=>c!=='sw').every(c=>r.lit.has(c));
  if(done&&lv.c.includes('sw')){const keep=CL.sw;CL.sw=false;const r2=evalCircuit();CL.sw=keep;if(r2.lit.size){done=false;if(!CL.warnBy){CL.warnBy=1;say(T("Le courant passe à côté de l'interrupteur ! Fais passer un fil par lui.","Le courant contourne l'interrupteur : il doit être dans la boucle."),false);}}}

async function dropObj(o,pred){
  FL.busy=true;const L=L_(),box=$('tankObj');

  el.animate([{transform:'translateY(-260px)'},{transform:'translateY(40px)'}],{duration:500,easing:'ease-in',fill:'forwards'});

  if(pred!=null){if(pred===o.f){L.pred++;msg+='Bonne prédiction ! ';sfx.ding();}else{msg+='Raté, ';sfx.yuck();}}

const COL_GOALS={nana:[{n:'vert',rgb:[0,255,0]},{n:'orange',rgb:[255,128,0]},{n:'bleu',rgb:[0,0,255]}],
  raf:[{n:'vert',rgb:[0,255,0]},{n:'rouge',rgb:[255,0,0]},{n:'bleu',rgb:[0,0,255]},{n:'orange',rgb:[255,128,0]},{n:'noir',rgb:[0,0,0]}]};
const CM={c:0,m:0,y:0,mode:'peinture',lights:null};
function mixRGB(){const mx=Math.max(CM.c,CM.m,CM.y,1);return [255*(1-CM.c/mx),255*(1-CM.m/mx),255*(1-CM.y/mx)].map(Math.round);}
function colName(rgb){const N=[['blanc',[255,255,255]],['noir',[0,0,0]],['rouge',[255,0,0]],['vert',[0,255,0]],['bleu',[0,0,255]],['jaune',[255,255,0]],['cyan',[0,255,255]],['magenta',[255,0,255]],['orange',[255,128,0]],['vert d\'eau',[0,255,128]],['violet',[128,0,255]],['rose',[255,0,128]],['vert clair',[128,255,0]],['bleu ciel',[0,128,255]]];
  let best=N[0],bd=1e9;N.forEach(n=>{const d=n[1].reduce((s,v,i)=>s+(v-rgb[i])**2,0);if(d<bd){bd=d;best=n;}});return best[0];}
function couleurStart(){
  CM.c=CM.m=CM.y=0;const L=L_(),goals=isA()?COL_GOALS.nana:COL_GOALS.raf;
  $('lWork').innerHTML=`<div class="lhead"><button class="lmode ${CM.mode==='peinture'?'on':''}" data-cm="peinture">🎨 Peinture</button><button class="lmode ${CM.mode==='lumiere'?'on':''}" data-cm="lumiere">🔦 Lumière</button><span class="lx" id="colGoal"></span></div><div id="colZone"></div>`;
  CM.mode==='peinture'?paintZone(goals):lightZone();
}
function paintZone(goals){
  const L=L_(),left=goals.filter(g=>!L.cols[g.n]);
  $('colGoal').textContent=left.length?T(`Fabrique du ${left[0].n} !`,`Objectif : fabrique ${left.map(g=>g.n).join(', ')}.`):T('Bravo, toutes les couleurs !','Toutes les couleurs sont trouvées !');
  const rgb=mixRGB(),empty=!CM.c&&!CM.m&&!CM.y;
  $('colZone').innerHTML=`<div class="paint"><div class="pots">${[['c','#00b7eb','cyan'],['m','#ff1f8e','magenta'],['y','#ffe600','jaune']].map(([k,c,n])=>`<button class="pot" data-pot="${k}"><svg viewBox="0 0 80 90"><path d="M10 20 h60 l-6 62 h-48z" fill="#e8edf5" stroke="#8a96ad" stroke-width="3"/><ellipse cx="40" cy="22" rx="30" ry="8" fill="${c}"/><path d="M14 30 h52 l-5 48 h-42z" fill="${c}"/></svg><span>${n} (${CM[k]})</span></button>`).join('')}</div>
  <div class="bowlc"><svg viewBox="0 0 260 180"><path d="M10 50 q0 120 120 124 q120 -4 120 -124z" fill="#fff" stroke="#c9d2e3" stroke-width="5"/><ellipse cx="130" cy="52" rx="118" ry="26" fill="${empty?'#f3f6fb':`rgb(${rgb})`}" stroke="#c9d2e3" stroke-width="4"/></svg><div class="cname">${empty?'Mets de la peinture !':colName(rgb)}</div></div>
  <button class="btn b-grey" id="potClean">🚿 Laver le pot</button></div>`;
}
function lightZone(){
  $('colGoal').textContent=T('Mélange les 3 lumières pour faire du blanc !','Lumière : rouge + vert + bleu = blanc. Fais du blanc en superposant les trois.');
  $('colZone').innerHTML=`<div class="dark" id="dark">${[['r','#ff0000',260,140],['g','#00ff00',520,140],['b','#0000ff',390,300]].map(([k,c,x,y])=>`<div class="lspot" data-l="${k}" style="left:${x}px;top:${y}px;background:radial-gradient(circle,${c} 55%,rgba(0,0,0,0) 70%)"></div>`).join('')}</div>`;

}
function checkWhite(){
  const s=[...document.querySelectorAll('.lspot')].map(el=>pos(el));
  const close=s.every(a=>s.every(b=>Math.hypot(a.x-b.x,a.y-b.y)<60));
  if(close){sfx.fanfare();award('l_lumiere');firstStar('lumiere'+(isA()?'n':'r'));say(T('Du blanc ! Les trois lumières ensemble font du blanc !','Blanc ! En lumière, les couleurs s\'additionnent : rouge + vert + bleu = blanc. En peinture, elles se soustraient.'),T(undefined,'Du blanc !'));}
}
$('lWork').addEventListener('pointerup',e=>{
  if(LS.tab!=='couleur')return;

  if(goals.every(g=>L.cols[g.n])){award('l_couleur');firstStar('couleur'+(isA()?'n':'r'));}
  paintZone(goals);
});

function gearPath(r){const n=Math.max(8,Math.round(r/5)),pts=[];for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?r-6:r+5;pts.push(`${(Math.cos(a)*rr).toFixed(1)},${(Math.sin(a)*rr).toFixed(1)}`);}return `<polygon points="${pts.join(' ')}"/>`;}
function gearLevels(){return isA()?GEAR_LV.nana:GEAR_LV.raf;}
function gearStart(){const L=L_();GS2.lv=Math.min(L.gear,gearLevels().length-1);GS2.sizes=gearLevels()[GS2.lv].pegs.map(()=>null);renderGears();say(T(gearLevels()[GS2.lv].x+' Touche les ronds pour mettre une roue.',gearLevels()[GS2.lv].x+' Touche un emplacement pour changer la taille de la roue.'),T(undefined,false));}
function gearSolve(lv){
  const nodes=[{...MOTOR,id:'m'}].concat(lv.pegs.map((p,i)=>GS2.sizes[i]?{x:p.x,y:p.y,r:GR[GS2.sizes[i]],id:'p'+i}:null).filter(Boolean)).concat([{...lv.t,id:'t'}]);
  const mesh=(a,b)=>Math.abs(Math.hypot(a.x-b.x,a.y-b.y)-(a.r+b.r))<=8;
  const spin={m:1},q=['m'],byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  while(q.length){const id=q.shift(),a=byId[id];nodes.forEach(b=>{if(spin[b.id]===undefined&&mesh(a,b)){spin[b.id]=-spin[id];q.push(b.id);}});}
  /* blocage : deux roues engrenées tournant dans le même sens */
  let jam=false;nodes.forEach(a=>nodes.forEach(b=>{if(a!==b&&spin[a.id]!==undefined&&spin[b.id]!==undefined&&mesh(a,b)&&spin[a.id]===spin[b.id])jam=true;}));
  return {nodes,spin,jam};
}
function renderGears(){
  const lv=gearLevels()[GS2.lv],{nodes,spin,jam}=gearSolve(lv),turns=!jam&&spin.t!==undefined;
  let ok=turns;if(ok&&lv.dir)ok=spin.t===lv.dir;if(ok&&lv.fast)ok=lv.t.r<MOTOR.r;
  const g=(n,col)=>{const s=jam?0:spin[n.id],dur=(4*n.r/MOTOR.r).toFixed(2);return `<g transform="translate(${n.x} ${n.y})"><g class="${s?'spin':''}" style="animation-duration:${dur}s;animation-direction:${s===-1?'reverse':'normal'}" fill="${col}" stroke="#2b2350" stroke-width="3">${gearPath(n.r)}<circle r="${n.r*.3}" fill="#fff"/><circle r="6" fill="#2b2350"/></g></g>`;};
  const objSVG={manege:'🎠',moulin:'🌬️',horloge:'🕰️',ventilo:'🌀'}[lv.obj];
  $('lWork').innerHTML=`<div class="lhead">${gearLevels().map((_,i)=>`<span class="lv ${i<L_().gear?'ok':''} ${i===GS2.lv?'on':''}">${i+1}</span>`).join('')}<span class="lx">${lv.x}</span></div>
  <svg viewBox="0 0 700 380" class="board gears">
  ${lv.pegs.map((p,i)=>GS2.sizes[i]?'':`<g class="peg" data-p="${i}"><circle cx="${p.x}" cy="${p.y}" r="22" fill="#fff" stroke="#8a96ad" stroke-width="4" stroke-dasharray="6 5"/><text x="${p.x}" y="${p.y+7}" text-anchor="middle" font-size="22" font-weight="900" fill="#8a96ad">+</text></g>`).join('')}
  ${nodes.map(n=>g(n,n.id==='m'?'#ffc83a':n.id==='t'?'#4c8dff':'#3fbf98')).join('')}
  ${lv.pegs.map((p,i)=>GS2.sizes[i]?`<circle class="peg" data-p="${i}" cx="${p.x}" cy="${p.y}" r="${GR[GS2.sizes[i]]}" fill="transparent"/>`:'').join('')}
  <text x="${MOTOR.x}" y="${MOTOR.y+MOTOR.r+34}" text-anchor="middle" font-size="18" font-weight="900" fill="#2b2350">Manivelle</text>
  <g transform="translate(${lv.t.x+lv.t.r+30} ${lv.t.y-60})"><text font-size="64" class="${turns?'spin':''}" style="transform-box:fill-box;transform-origin:center;animation-duration:${(2*lv.t.r/MOTOR.r).toFixed(2)}s">${objSVG}</text></g>
  ${jam?'<text x="350" y="40" text-anchor="middle" font-size="26" font-weight="900" fill="#e2263e">Bloqué !</text>':''}</svg>
  <div class="lfoot"><span class="ghint">${T('Petite, moyenne, grande : touche encore pour changer.','Tailles : petite (30), moyenne (50), grande (70). Les roues doivent se toucher.')}</span>${ok?'<button class="btn b-orange" id="gNext">Niveau suivant ▶</button>':''}</div>`;
  if(jam&&!GS2.wasJam){sfx.alert();if(!isA())say('Bloqué : trois roues qui se touchent toutes ne peuvent pas tourner (deux tourneraient dans le même sens).',false);}
  GS2.wasJam=jam;
  if(turns&&!ok&&!GS2.wasOk&&!isA()){say(lv.dir?'Ça tourne, mais pas dans le bon sens. Chaque roue inverse le sens de la suivante.':'Ça tourne, mais pas assez vite. Une petite roue entraînée par une grande tourne plus vite.',false);}
  if(ok&&!GS2.wasOk){sfx.ding();const L=L_();award('l_engrenage');if(GS2.lv>=L.gear){L.gear=GS2.lv+1;saveDB();firstStar('gear'+GS2.lv+(isA()?'n':'r'));}
    if(L.gear>=gearLevels().length&&!isA())award('l_engrenages');
    say(T('Ça tourne ! Bravo !',lv.dir?"Bravo ! Avec une roue au milieu, le sens s'inverse deux fois.":lv.fast?'Bravo ! La petite roue tourne plus vite que la grande.':'Ça tourne : les roues se transmettent le mouvement.'),T(undefined,'Ça tourne !'));}
  GS2.wasOk=ok;
}
$('lWork').addEventListener('pointerup',e=>{
  if(LS.tab!=='engrenage'||S.screen!=='s-labo')return;
  if(e.target.closest('#gNext')){const n=gearLevels().length;if(GS2.lv>=n-1){say(T('Tu as fini tous les engrenages !','Tous les niveaux sont réussis !'));return;}GS2.lv++;GS2.sizes=gearLevels()[GS2.lv].pegs.map(()=>null);GS2.wasOk=false;sfx.click();renderGears();say(gearLevels()[GS2.lv].x,T(undefined,false));return;}
  const p=e.target.closest('.peg');if(!p)return;const i=+p.dataset.p,cyc=[null,'S','M','L'];
  GS2.sizes[i]=cyc[(cyc.indexOf(GS2.sizes[i])+1)%4];sfx.click();renderGears();
});

  roues:[{id:'velo',n:'Roues de vélo',g:.6},{id:'normales',n:'Roues normales',g:1},{id:'tt',n:'Tout-terrain',g:1.4},{id:'monster',n:'Monster',g:1.2}]
};
const PAINTS=['#ff5a5a','#ff9a3c','#ffd23a','#3fbf55','#4c8dff','#a77bf3','#ff7fb0','#2b2350','#ffffff'];

function CAR_(){const p=P();p.car=p.car||{chassis:'voiture',moteur:'petit',roues:'normales',col:'#ff5a5a',dots:[]};return p.car;}
const GA={tab:'chassis',mission:'route',color:'#4c8dff',busy:false};
function bodyPath(ch){return {kart:'M60 150 h300 q14 0 14 14 v14 h-328 v-14 q0 -14 14 -14z',voiture:'M50 160 q0 -26 30 -30 l60 -8 q30 -40 80 -40 h50 q40 0 66 40 l40 8 q24 4 24 30 v30 h-350z',camion:'M40 70 h200 v120 h-200z M240 110 h70 q34 0 46 34 l14 26 v20 h-130z'}[ch];}
function carSVG(c,{scale=1,driver=true,id='car'}={}){
  const R={velo:{r:34,t:4},normales:{r:30,t:12},tt:{r:38,t:16},monster:{r:54,t:20}}[c.roues];
  const wy=c.chassis==='camion'?196:186,wx=c.chassis==='kart'?[100,320]:c.chassis==='camion'?[100,320]:[110,320];
  const wheel=x=>`<g class="wheel" transform="translate(${x} ${wy})"><g class="wspin"><circle r="${R.r}" fill="#2b2b33"/>${c.roues==='tt'||c.roues==='monster'?Array.from({length:10},(_,i)=>`<rect x="-5" y="${-R.r-5}" width="10" height="10" fill="#2b2b33" transform="rotate(${i*36})"/>`).join(''):''}<circle r="${R.r-R.t}" fill="${c.roues==='velo'?'none':'#c9d2e3'}" stroke="#9aa6bf" stroke-width="3"/>${c.roues==='velo'?Array.from({length:8},(_,i)=>`<line x1="0" y1="0" x2="${(R.r-4)*Math.cos(i*Math.PI/4)}" y2="${(R.r-4)*Math.sin(i*Math.PI/4)}" stroke="#c9d2e3" stroke-width="2"/>`).join(''):`<line x1="${-(R.r-R.t-4)}" y1="0" x2="${R.r-R.t-4}" y2="0" stroke="#9aa6bf" stroke-width="4"/>`}<circle r="6" fill="#5d6c8c"/></g></g>`;
  const lift=c.roues==='monster'?-26:c.roues==='tt'?-8:0;
  const motor={pedales:`<g transform="translate(160 186)"><circle r="14" fill="none" stroke="#5d6c8c" stroke-width="4"/><rect x="-22" y="-4" width="44" height="8" rx="3" fill="#5d6c8c" transform="rotate(30)"/></g>`,
    petit:`<rect x="${c.chassis==='camion'?280:300}" y="${c.chassis==='kart'?128:116}" width="46" height="30" rx="6" fill="#9aa6bf" stroke="#5d6c8c" stroke-width="3"/>`,
    gros:`<g><rect x="${c.chassis==='camion'?270:286}" y="${c.chassis==='kart'?98:84}" width="72" height="46" rx="8" fill="#c9d2e3" stroke="#5d6c8c" stroke-width="3"/>${[0,1,2].map(i=>`<rect x="${(c.chassis==='camion'?276:292)+i*22}" y="${c.chassis==='kart'?86:72}" width="12" height="16" rx="3" fill="#9aa6bf"/>`).join('')}</g>`,
    fusee:`<g><path d="M14 120 h60 l24 20 l-24 20 h-60z" fill="#e8edf5" stroke="#5d6c8c" stroke-width="3"/><path d="M14 126 l-30 14 l30 14z" class="flame" fill="#ff9a1a"/></g>`}[c.moteur];
  const drv=driver?`<g transform="translate(${c.chassis==='camion'?262:c.chassis==='kart'?168:206} ${c.chassis==='kart'?72:c.chassis==='camion'?92:70}) scale(.36)">${avatar(S.player||'anna').replace('<svg viewBox="0 0 200 200">','<svg viewBox="0 0 200 200" width="200" height="200">').replace(/<circle cx="100" cy="100" r="99"[^>]*\/>/,'')}</g>`:'';
  const win=c.chassis==='voiture'?'<path d="M150 124 q24 -32 66 -32 h40 q30 0 52 32z" fill="#bfe3ff" stroke="#2b2350" stroke-width="3"/>':c.chassis==='camion'?'<path d="M252 118 h52 q20 0 30 26 h-82z" fill="#bfe3ff" stroke="#2b2350" stroke-width="3"/>':'<rect x="150" y="118" width="60" height="34" rx="10" fill="#5d6c8c"/>';
  return `<svg viewBox="-40 0 470 ${260} " style="width:${470*scale}px;height:${260*scale}px;overflow:visible"><defs><clipPath id="cl_${id}"><path d="${bodyPath(c.chassis)}"/></clipPath><clipPath id="wl_${id}"><path d="${c.chassis==='camion'?'M252 118 h52 q20 0 30 26 h-82z':'M150 124 q24 -32 66 -32 h40 q30 0 52 32z'}"/></clipPath></defs>
  <g transform="translate(0 ${lift})"><path d="${bodyPath(c.chassis)}" fill="${c.col}" stroke="#2b2350" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#cl_${id})">${(c.dots||[]).map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="${d[3]||9}" fill="${d[2]}" opacity=".9"/>`).join('')}</g>
  <path d="${bodyPath(c.chassis)}" fill="none" stroke="#2b2350" stroke-width="4" stroke-linejoin="round"/>${win}${c.chassis==='kart'?drv:c.chassis==='voiture'?`<g clip-path="url(#wl_${id})">${drv}</g><path d="M150 124 q24 -32 66 -32 h40 q30 0 52 32z" fill="#bfe3ff" opacity=".25" stroke="#2b2350" stroke-width="3"/>`:`<g clip-path="url(#wl_${id})">${drv}</g><path d="M252 118 h52 q20 0 30 26 h-82z" fill="#bfe3ff" opacity=".25" stroke="#2b2350" stroke-width="3"/>`}${motor}</g>
  ${wheel(wx[0])}${wheel(wx[1])}</svg>`;
}
function enterGarage(){go('s-garage');CAR_();GA.busy=false;renderGarage();updGift();
  say(T('Construis ta voiture ! Choisis les pièces, puis essaie-la.','Garage : châssis, moteur, roues et peinture. Puis teste-la sur une mission.'));}
function renderGarage(){
  const c=CAR_(),A=isA();
  $('gaTabs').innerHTML=[['chassis','🚙 Châssis'],['moteur','⚙️ Moteur'],['roues','🛞 Roues'],['peinture','🎨 Peinture']].map(([k,n])=>`<button class="ltab ${GA.tab===k?'on':''}" data-gt="${k}">${n}</button>`).join('');
  $('gaCar').innerHTML=carSVG(c,{scale:1.55,id:'big'});
  let h='';
  if(GA.tab==='peinture')h=`<div class="paints">${PAINTS.map(col=>`<button class="pcol ${GA.color===col?'sel':''}" data-col="${col}" style="background:${col}"></button>`).join('')}</div><div class="ghint">${T('Touche une couleur, puis frotte la voiture avec ton doigt !','Choisis une couleur et peins au pistolet sur la carrosserie.')}</div><div class="frow"><button class="btn b-blue" id="gaFill">🪣 Tout peindre</button><button class="btn b-grey" id="gaErase">🧽 Effacer</button></div>`;
  else h=`<div class="parts">${PARTS[GA.tab].map(p=>`<button class="part ${c[GA.tab]===p.id?'sel':''}" data-part="${p.id}"><div class="pp">${partIcon(GA.tab,p.id)}</div><span>${p.n}</span></button>`).join('')}</div>`;

  $('gaGo').innerHTML=(A?'':`<div class="missions">${Object.entries(MISSIONS).map(([k,m])=>`<button class="mis ${GA.mission===k?'sel':''} ${(P().gm||{})[k]?'ok':''}" data-mis="${k}">${m.e} ${m.n}</button>`).join('')}</div>`)+`<button class="btn b-orange" id="gaDrive">🏁 Essayer${A?' sur la route':''} !</button>`;

function partIcon(t,id){const base={...CAR_(),[t]:id,dots:[],col:CAR_().col};return carSVG(base,{scale:.32,driver:false,id:'ic_'+t+id});}
onTap($('gaTabs'),e=>{const b=e.target.closest('[data-gt]');if(!b)return;GA.tab=b.dataset.gt;sfx.click();renderGarage();});
onTap($('gaPanel'),e=>{
  const c=CAR_(),p=e.target.closest('[data-part]');

  const col=e.target.closest('[data-col]');if(col){GA.color=col.dataset.col;sfx.pop();renderGarage();return;}
  if(e.target.closest('#gaFill')){c.col=GA.color;c.dots=[];sfx.splash();saveDB();renderGarage();return;}

onTap($('gaGo'),e=>{const m=e.target.closest('[data-mis]');if(m){GA.mission=m.dataset.mis;sfx.click();renderGarage();say(MISSIONS[GA.mission].x,false);return;}if(e.target.closest('#gaDrive'))drive();});
/* pistolet à peinture : glisser le doigt sur la voiture */
let SPR=null;
$('gaCar').addEventListener('pointerdown',e=>{if(GA.tab!=='peinture'||GA.busy)return;SPR=1;spray(e);});
$('gaCar').addEventListener('pointermove',e=>{if(SPR)spray(e);});
['pointerup','pointercancel','pointerleave'].forEach(t=>$('gaCar').addEventListener(t,()=>{if(SPR){SPR=null;saveDB();renderGarage();}}));
function spray(e){
  const svg=$('gaCar').querySelector('svg');if(!svg)return;const r=svg.getBoundingClientRect(),c=CAR_();
  const x=-40+(e.clientX-r.left)/r.width*470,y=(e.clientY-r.top)/r.height*260-(c.roues==='monster'?-26:c.roues==='tt'?-8:0);
  if(c.dots.length>600)c.dots.shift();c.dots.push([Math.round(x),Math.round(y),GA.color,Math.round(rnd(6,13))]);
  if(Math.random()<.3)noise(.05,.05,'highpass',4000);
  const g=svg.querySelector('g[clip-path]');if(g)g.insertAdjacentHTML('beforeend',`<circle cx="${x}" cy="${y}" r="10" fill="${GA.color}" opacity=".9"/>`);
  if(c.dots.length>=40)award('g_peinture');
}
/* essai sur route */
function carOutcome(c,mission){
  const ch=PARTS.chassis.find(x=>x.id===c.chassis),mo=PARTS.moteur.find(x=>x.id===c.moteur),ro=PARTS.roues.find(x=>x.id===c.roues);
  const w=ch.w+(c.moteur==='gros'?1:0),ratio=mo.p/w,speed=ratio*ro.g;
  if(c.moteur==='fusee'&&w<6)return {o:'vole',x:T("Décollage ! La fusée est trop puissante pour une si petite voiture : elle s'envole !","Fusée sur un véhicule léger : la poussée dépasse le poids, la voiture décolle !")};
  if(c.roues==='velo'&&w>=3)return {o:'ecrase',x:T('Les roues de vélo s\'écrasent sous le poids !',"Roues de vélo trop fragiles pour ce poids : elles s'écrasent.")};
  if(c.moteur==='gros'&&c.chassis==='kart')return {o:'wheelie',x:T('Le kart se cabre sur ses roues arrière !','Gros moteur sur un kart léger : la voiture se cabre (wheelie).')};
  if(c.moteur==='pedales'&&w>=3)return {o:'escargot',x:T('Trop lourd pour des pédales… elle avance comme un escargot !','Pédales pour un véhicule lourd : puissance trop faible, elle avance à peine.')};
  if(c.roues==='monster'&&c.chassis==='kart')return {o:'rebond',x:T('Boing boing ! Le kart rebondit sur ses grosses roues !','Roues monster sur un kart : trop hautes et trop légères, ça rebondit partout.')};
  if(mission==='colline'&&ratio<1)return {o:'recule',x:`Pas assez de puissance pour le poids (${mo.p} pour ${w}) : la voiture redescend la colline.`};
  if(mission==='boue'&&!['tt','monster'].includes(c.roues))return {o:'patine',x:'Les roues patinent dans la boue : il faut des roues qui accrochent (tout-terrain ou monster).'};
  const time=+(10/Math.max(.3,speed)).toFixed(1);
  if(mission==='course'&&time>6)return {o:'lent',time,x:`Arrivée en ${String(time).replace('.',',')} s : trop lent. Plus de puissance ou moins de poids !`};
  return {o:'roule',time,x:T('Elle roule super bien ! Bravo !',mission==='course'?`Arrivée en ${String(time).replace('.',',')} s : gagné !`:mission==='colline'?'Assez de puissance : la colline est montée !':mission==='boue'?'Les roues accrochent : la boue est traversée !':'Une voiture bien équilibrée : elle roule parfaitement.')};
}
async function drive(){
  if(GA.busy)return;GA.busy=true;const c=CAR_(),mission=isA()?'route':GA.mission,r=carOutcome(c,mission);
  const D=$('gaDrive2');D.classList.remove('hidden');
  D.innerHTML=`<div class="road ${mission}"><div class="scroll"></div>${mission==='colline'?'<div class="hill"></div>':''}${mission==='boue'?'<div class="mud"></div>':''}${mission==='course'?'<div class="flag">🏁</div>':''}<div class="dcar" id="dCar">${carSVG(c,{scale:.9,id:'drive'})}</div></div><div class="dres hidden" id="dRes"></div>`;
  const car=$('dCar'),sc=D.querySelector('.scroll');sfx.hum(4.5);award('g_voiture');
  const anim={
    roule:[[{transform:'translateX(0)'},{transform:'translateX(520px)'}],4200],
    lent:[[{transform:'translateX(0)'},{transform:'translateX(260px)'}],4200],
    vole:[[{transform:'translate(0,0) rotate(0)'},{transform:'translate(200px,-20px) rotate(-10deg)'},{transform:'translate(700px,-520px) rotate(-30deg)'}],3600],
    ecrase:[[{transform:'translateX(0)'},{transform:'translateX(120px) scaleY(.75)'},{transform:'translateX(140px) scaleY(.6) rotate(3deg)'}],2600],
    wheelie:[[{transform:'translateX(0) rotate(0)'},{transform:'translateX(200px) rotate(-22deg)'},{transform:'translateX(440px) rotate(-26deg)'}],3800],
    escargot:[[{transform:'translateX(0)'},{transform:'translateX(60px)'}],4200],
    rebond:[[{transform:'translate(0,0)'},{transform:'translate(100px,-90px)'},{transform:'translate(200px,0)'},{transform:'translate(300px,-80px)'},{transform:'translate(400px,0)'}],3600],
    recule:[[{transform:'translate(0,0) rotate(0)'},{transform:'translate(260px,-120px) rotate(-24deg)'},{transform:'translate(40px,0) rotate(0)'}],4000],
    patine:[[{transform:'translateX(0)'},{transform:'translateX(240px)'},{transform:'translateX(250px)'},{transform:'translateX(244px)'}],3600]
  }[r.o];
  car.querySelectorAll('.wspin').forEach(w=>w.classList.add('spin'));
  if(['roule','lent','wheelie','vole'].includes(r.o))sc.classList.add('move');
  car.animate(anim[0],{duration:anim[1],easing:'ease-in-out',fill:'forwards'});
  if(r.o==='vole'){sfx.boom();burst(car,['🔥','💨'],8,120);}if(r.o==='ecrase'){setTimeout(()=>{sfx.squish();burst(car,['💥','⭐'],6,90);},1200);}
  await sleep(anim[1]+300);
  const good=r.o==='roule';
  const key={vole:'g_fusee',wheelie:'g_wheelie',ecrase:'g_ecrase'}[r.o];if(key)award(key);
  if(good){sfx.fanfare();award('g_parfait');if(mission!=='route'){const gm=P().gm=P().gm||{};if(!gm[mission]){gm[mission]=1;saveDB();}award('g_'+mission);firstStar('garage_'+mission);}else firstStar('garage_route'+(isA()?'n':'r'));}
  else sfx.whine();
  $('dRes').classList.remove('hidden');$('dRes').innerHTML=`<div class="dtxt">${good?'🏆 ':'😅 '}${r.x}</div><button class="btn" id="dBack">🔧 Retour au garage</button>`;
  say(r.x,T(undefined,good?'Bravo !':'Oups !'));
  onTap($('dBack'),()=>{sfx.click();$('gaDrive2').classList.add('hidden');GA.busy=false;renderGarage();});
}
