<style>

html,body{margin:0;height:100%;overflow:hidden;background:#1d1838;overscroll-behavior:none;touch-action:manipulation;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,-apple-system,sans-serif;color:var(--ink)}

button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:80px;padding:0 30px;border-radius:40px;font-size:30px;font-weight:800;color:#fff;background:var(--c,var(--green));box-shadow:0 7px 0 var(--d,var(--green-d)),0 12px 20px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s;white-space:nowrap}

.b-orange{--c:var(--orange);--d:var(--orange-d)}
.b-blue{--c:var(--blue);--d:var(--blue-d)}
.b-grey{--c:var(--grey);--d:var(--grey-d)}
.iconbtn{position:absolute;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 6px 0 #d9d2e8,0 10px 18px rgba(0,0,0,.15);font-size:40px;display:flex;align-items:center;justify-content:center;z-index:20;overflow:hidden}
.iconbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9d2e8}

/* bulle de Kicuit */
#bubble{position:absolute;left:122px;top:12px;width:760px;min-height:88px;background:#fff;border-radius:30px;box-shadow:0 8px 22px rgba(43,35,80,.18);display:none;align-items:center;padding:12px 24px 12px 98px;z-index:30;font-size:25px;font-weight:700;line-height:1.25}
#bubble .bh{position:absolute;left:10px;top:50%;width:80px;height:80px;margin-top:-40px}
#bubble.pop{animation:bpop .35s ease-out}
@keyframes bpop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Kicuit */
.kc .kc-float{animation:float 3s ease-in-out infinite}
.kc .kc-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.kc .kc-mouth{transform-box:fill-box;transform-origin:center}
.kc.talking .kc-mouth{animation:talk .16s infinite alternate}
.kc.alarm .kc-eyes rect{fill:#ff6a6a}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.7)}}

/* Wanji */
.wj .e-happy,.wj .e-squint,.wj .m-open,.wj .m-yuck,.wj .cheeks{display:none}
.wj.happy .e-open,.wj.happy .m-normal,.wj.yuck .e-open,.wj.yuck .m-normal,.wj.refuse .e-open,.wj.refuse .m-normal{display:none}
.wj.happy .e-happy,.wj.happy .m-open,.wj.happy .cheeks,.wj.yuck .e-squint,.wj.yuck .m-yuck,.wj.refuse .e-squint,.wj.refuse .m-yuck{display:inline}
.wj .wj-tail{transform-origin:168px 205px;animation:wag 1.4s ease-in-out infinite}
.wj.happy .wj-tail{animation:wag .2s ease-in-out infinite}
.wj .wj-head{transform-origin:120px 130px;transition:transform .35s}
.wj.meh .wj-head{transform:rotate(-16deg)}
.wj.sniff .wj-head{animation:sniff .35s ease-in-out infinite}
.wj.yuck .wj-head{animation:shake .25s ease-in-out 5}
.wj.happy .wj-head{animation:hop .45s ease-in-out infinite}
.wj.refuse{animation:flee 2.8s ease-in-out forwards}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes sniff{0%,100%{transform:translateY(0)}50%{transform:translateY(9px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flee{0%{transform:none}15%{transform:scaleX(-1)}55%{transform:translateX(-330px) scaleX(-1)}75%{transform:translateX(-330px) scaleX(1)}100%{transform:none}}

.wisp{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--sc,#9ba3b1);opacity:0;animation:wisp 1.8s ease-out infinite;pointer-events:none}

.win{position:absolute;overflow:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center}

@keyframes cexp{0%{transform:scale(.7)}60%{transform:scale(1.15)}80%{transform:scale(1.4) rotate(-4deg)}90%{transform:scale(1.55) rotate(5deg)}100%{transform:scale(1.85)}}

@keyframes cca{to{filter:brightness(.15) grayscale(.5);transform:scale(.8)}}

.cook-cru{animation:ccr 3.3s ease-out forwards}
@keyframes ccr{to{transform:scale(.78)}}
#wanjiBox{left:285px;top:560px;width:220px;height:230px;z-index:8}
#wanji{position:absolute;left:0;top:0;width:220px;height:230px}

#order::before,#order::after{content:"";position:absolute;background:#fff;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.12)}

.shake{animation:scrshake .5s linear}

<div id="rotate"><div class="ph">📱</div><div>Tourne l'iPad<br>à l'horizontale !</div></div>

/* ---------- sons (générés, aucun fichier) ---------- */
let AC=null,NB=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f1,f2,dur,type='sine',vol=.2,delay=0){
  const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol=.3,type='lowpass',freq=800,delay=0){
  const a=ac();if(!a)return;
  if(!NB){NB=a.createBuffer(1,a.sampleRate*1.5,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=NB;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.05);
}
const sfx={
  pop:()=>tone(420,900,.09,'sine',.22),
  click:()=>tone(700,500,.05,'triangle',.12),
  whisk:()=>{for(let i=0;i<8;i++)noise(.07,.16,'highpass',2600,i*.14)},
  hum:d=>{const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o.frequency.value=105;f.type='lowpass';f.frequency.value=380;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.2);g.gain.setValueAtTime(.05,t+d-.2);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)},
  ding:()=>{tone(1320,0,.7,'sine',.22);tone(1760,0,.9,'sine',.16,.14)},

  squish:()=>{noise(.16,.28,'bandpass',1300);tone(300,120,.12,'sine',.12)},
  trash:()=>noise(.4,.3,'lowpass',300),

/* ---------- voix de Kicuit ---------- */
let VOICE=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>/^fr[-_]FR/i.test(v.lang)&&/Am[eé]lie|Audrey|Marie|Aurelie|Aurélie/i.test(v.name))||vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let talkTimer=null;
function talking(on){document.querySelectorAll('.kc').forEach(k=>k.classList.toggle('talking',on))}
function speak(text,immediate){
  clearTimeout(talkTimer);talking(true);
  const clean=text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{2B06}\u{2194}-\u{21FF}]/gu,'').replace(/°C/g,' degrés').replace(/–/g,' à ');
  const fallback=()=>{talkTimer=setTimeout(()=>talking(false),Math.min(6000,600+clean.length*55))};
  if(!DB.voice||!('speechSynthesis' in window)){fallback();return;}
  const u=new SpeechSynthesisUtterance(clean);u.lang='fr-FR';if(VOICE)u.voice=VOICE;
  u.rate=isA()?.95:1.03;u.pitch=1.25;
  u.onend=u.onerror=()=>talking(false);
  fallback();
  speechSynthesis.cancel();
  if(immediate)speechSynthesis.speak(u);else setTimeout(()=>speechSynthesis.speak(u),70);
}
let lastSay='';
function say(text){
  lastSay=text;$('bubbleText').textContent=text;
  const b=$('bubble');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  speak(text);
}
$('bubble').addEventListener('click',()=>lastSay&&speak(lastSay));

function identify(list){
  const s=new Set(list),h=k=>s.has(k);
  if(!s.size)return null;
  const sweet=h('sucre')||h('chocolat')||h('fraise'),salty=h('tomate')||h('gruyere');
  if(sweet&&salty)return 'mystere';
  if(h('farine')&&h('oeuf')&&h('sucre'))return h('chocolat')?'gateauChoco':h('fraise')?'gateauFraise':'gateau';
  if(h('farine')&&h('beurre')&&h('sucre')&&h('chocolat')&&!h('oeuf'))return 'cookies';
  if(h('farine')&&h('tomate')&&h('gruyere'))return 'pizza';
  if(h('lait')&&h('chocolat')&&!h('farine')&&!h('oeuf'))return 'chocolatChaud';
  if(h('oeuf')&&!h('farine')&&!sweet)return 'omelette';
  if(h('tomate')&&h('gruyere')&&!h('farine'))return 'gratin';
  return 'mystere';
}
const fmtMin=m=>{const mm=Math.floor(m),ss=Math.round((m-mm)*60);return ss?`${mm} min ${ss}`:`${mm} min`;};

/* le cœur du jeu : que devient la pâte ? */
function evaluate(rid,app,temp,time){
  const R=RECIPES[rid];
  if(R.mystery){
    const ext=app==='four'?temp>=260:time>=8;
    return ext?{st:'explose',why:'Mixture mystère + énorme chaleur = explosion verte garantie !'}:{st:'vert',why:'Ces ingrédients ne vont pas ensemble… Essaie une vraie recette !'};
  }
  if(app==='micro'){
    const [a,b]=R.micro.m;
    if(time>=8||time>b*2.5)return {st:'explose',why:"Trop longtemps au micro-ondes : l'eau du plat se change en vapeur d'un coup… BOUM !"};
    if(time>b)return {st:'brule',why:`Trop long : au micro-ondes, ce plat ne doit pas dépasser ${fmtMin(b)}.`};
    if(time<a)return {st:'cru',why:`Pas assez longtemps : il faut au moins ${fmtMin(a)}.`};
    if(R.micro.q==='mou')return {st:'mou',why:"Le micro-ondes cuit sans dorer : c'est tout mou ! Pour ce plat, le four est meilleur."};
    return {st:'parfait',why:`${fmtMin(time)} au micro-ondes : c'était parfait.`};
  }
  const [t0,t1]=R.four.t,[m0,m1]=R.four.m;
  if(temp>=260)return time>=m0?{st:'explose',why:"Plus de 260 °C ! L'eau de la pâte se transforme en vapeur trop vite : ça gonfle… et BOUM !"}:{st:'brule',why:`Beaucoup trop chaud : reste entre ${t0} et ${t1} °C.`};
  if(temp<t0-50)return {st:'cru',why:`Le four est presque froid ! Il faut entre ${t0} et ${t1} °C.`};
  const oT=temp>t1,oM=time>m1,uT=temp<t0,uM=time<m0;
  if(oT&&oM)return {st:'carbonise',why:`Trop chaud ET trop long : tout est carbonisé ! Vise ${t0}–${t1} °C pendant ${m0}–${m1} min.`};
  if(oT)return {st:'brule',why:`Trop chaud : le dessus brûle avant que l'intérieur cuise. Reste sous ${t1} °C.`};
  if(oM)return {st:'brule',why:`Trop long : après ${m1} min, ça noircit.`};
  if(uT)return {st:'cru',why:`Pas assez chaud : il faut au moins ${t0} °C.`};
  if(uM)return {st:'cru',why:`Pas assez de temps : laisse au moins ${m0} min.`};
  return {st:'parfait',why:`${temp} °C pendant ${time} min : parfait !`};
}

/* ---------- utilitaires d'animation ---------- */
function pos(el){const r=el.getBoundingClientRect(),s=$('stage').getBoundingClientRect();return {x:(r.left-s.left+r.width/2)/SCALE,y:(r.top-s.top+r.height/2)/SCALE};}
function fly(html,fromEl,toEl,{dur=650,size=64,arc=120,spin=0,scaleTo=1}={}){
  return new Promise(res=>{
    const a=pos(fromEl),b=pos(toEl),d=document.createElement('div');d.className='flyer';
    d.style.width=size+'px';d.style.height=size+'px';d.innerHTML=html;$('stage').appendChild(d);
    const mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-arc,fr=[];
    for(let i=0;i<=14;i++){const t=i/14,x=(1-t)*(1-t)*a.x+2*(1-t)*t*mx+t*t*b.x,y=(1-t)*(1-t)*a.y+2*(1-t)*t*my+t*t*b.y;
      fr.push({transform:`translate(${x-size/2}px,${y-size/2}px) scale(${1+(scaleTo-1)*t}) rotate(${spin*t}deg)`});}
    const an=d.animate(fr,{duration:dur,easing:'ease-in-out',fill:'forwards'});an.onfinish=()=>{d.remove();res();};
  });
}
function burst(el,chars,n=8,spread=140){
  const c=pos(el);
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='particle';p.textContent=pick(chars);$('stage').appendChild(p);
    const dx=rnd(-spread,spread),dy=rnd(-spread*1.3,-40);
    p.animate([{transform:`translate(${c.x-20}px,${c.y-20}px) scale(.4)`,opacity:1},{transform:`translate(${c.x-20+dx}px,${c.y-20+dy}px) scale(1.2)`,opacity:0}],{duration:rnd(900,1500),easing:'ease-out',delay:i*60,fill:'both'}).onfinish=()=>p.remove();
  }
}
function smokeFrom(el,color,count=1){
  const c=pos(el);
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='particle';
    p.style.cssText=`width:40px;height:40px;border-radius:50%;background:${color}`;$('stage').appendChild(p);
    const x=c.x+rnd(-50,50);
    p.animate([{transform:`translate(${x}px,${c.y-60}px) scale(.4)`,opacity:.8},{transform:`translate(${x+rnd(-30,30)}px,${c.y-200}px) scale(2.4)`,opacity:0}],{duration:1500,easing:'ease-out',fill:'forwards'}).onfinish=()=>p.remove();
  }
}

  S.k.phase='mixing';renderBtns();
  const w=document.createElement('div');w.className='whisk';
  w.innerHTML='<svg viewBox="0 0 70 120"><rect x="30" y="70" width="10" height="48" rx="5" fill="#c98d5a"/><g fill="none" stroke="#9aa6bf" stroke-width="4"><path d="M35 72 q-30 -40 0 -68 q30 28 0 68z"/><path d="M35 72 q-16 -40 0 -68 q16 28 0 68z"/><path d="M35 72 v-68"/></g></svg>';
  $('bowl').appendChild(w);sfx.whisk();
  await sleep(1200);w.remove();
  S.k.mixed=identify(S.k.bowl);S.k.phase='mixed';renderBowl();renderBtns();sfx.pop();
  const R=RECIPES[S.k.mixed];
  if(R.mystery)say(T('Hmm… une mixture mystère ! On la fait cuire quand même ? Touche le four ou le micro-ondes.','Mixture mystère ! Ces ingrédients ne forment pas une recette connue… Tu veux quand même la cuire ?'));
  else say(T(`Ça ressemble à ${R.art} ! Maintenant, touche le four ou le micro-ondes.`,`Pâte prête : ${R.art}. Four ou micro-ondes ? Choisis bien la température et le temps.`));
}

/* réglages de cuisson */
const THERMO=(lv,c)=>`<svg viewBox="0 0 30 70" style="height:64px;width:28px"><rect x="10" y="4" width="10" height="46" rx="5" fill="#fff" stroke="#5d6c8c" stroke-width="2.5"/><circle cx="15" cy="56" r="10" fill="${c}" stroke="#5d6c8c" stroke-width="2.5"/><rect x="12.5" y="${48-lv*13}" width="5" height="${lv*13+6}" fill="${c}"/></svg>`;
const GLASS=h=>`<svg viewBox="0 0 40 60" style="height:${h}px;width:${h*.67}px"><rect x="4" y="2" width="32" height="6" rx="3" fill="#8a5a36"/><rect x="4" y="52" width="32" height="6" rx="3" fill="#8a5a36"/><path d="M9 8 h22 q0 16 -9 22 q9 6 9 22 h-22 q0 -16 9 -22 q-9 -6 -9 -22z" fill="#e8f6ff" stroke="#8a5a36" stroke-width="2.5"/><path d="M13 46 q7 -6 14 0 v6 h-14z" fill="#ffc94a"/><path d="M14 13 h12 q-2 8 -6 10 q-4 -2 -6 -10z" fill="#ffc94a"/></svg>`;
function openPanel(app){
  if(S.k.phase==='prep'&&S.k.bowl.length){say(T("D'abord, mélange avec la cuillère !",'Mélange d\'abord la pâte.'));return;}
  if(S.k.phase!=='mixed'){if(S.k.phase==='prep')say(T('Ouvre le frigo et choisis des ingrédients !','Le saladier est vide : commence par le frigo.'));return;}
  sfx.click();S.k.app=app;S.k.temp=null;S.k.time=null;
  const card=$('panelCard'),four=app==='four';
  let h=`<h2>${four?'🔥 Le four':'⚡ Le micro-ondes'}</h2>`;
  if(isA()){
    if(four)h+=`<div class="prow"><div class="plab">Chaleur</div>${[['Doux',150,1,'#5bb8ff'],['Moyen',190,2,'#ffa23a'],['Très chaud',270,3,'#ff3b3b']].map(([l,v,n,c])=>`<button class="opt" data-k="temp" data-v="${v}">${THERMO(n,c)}<div class="fl">${'🔥'.repeat(n)}</div>${l}</button>`).join('')}</div>`;
    const tv=four?[10,25,60]:[1,3,10];
    h+=`<div class="prow"><div class="plab">Temps</div>${[['Court',tv[0],44],['Moyen',tv[1],62],['Long',tv[2],84]].map(([l,v,s])=>`<button class="opt" data-k="time" data-v="${v}">${GLASS(s)}${l}</button>`).join('')}</div>`;
  }else{
    if(four){S.k.temp=120;S.k.time=10;
      h+=`<div class="rlab">Température</div><div class="rrow"><button class="step" data-k="temp" data-d="-10">−</button><div class="rval" id="rvTemp"></div><button class="step" data-k="temp" data-d="10">+</button></div><input type="range" id="rTemp" min="50" max="300" step="10" value="120">`;
      h+=`<div class="rlab">Temps de cuisson</div><div class="rrow"><button class="step" data-k="time" data-d="-1">−</button><div class="rval" id="rvTime"></div><button class="step" data-k="time" data-d="1">+</button></div><input type="range" class="rtime" id="rTime" min="1" max="90" step="1" value="10">`;
    }else{S.k.temp=0;S.k.time=1;
      h+=`<div class="rlab">Temps de cuisson</div><div class="rrow"><button class="step" data-k="time" data-d="-0.5">−</button><div class="rval" id="rvTime"></div><button class="step" data-k="time" data-d="0.5">+</button></div><input type="range" class="rtime" id="rTime" min="0.5" max="15" step="0.5" value="1">`;
    }
  }
  h+=`<div class="pfoot"><button class="btn b-grey" data-pa="cancel">Annuler</button><button class="btn b-orange" data-pa="go" id="goBtn">${four?'🔥':'⚡'} Allumer !</button></div>`;
  card.innerHTML=h;$('panel').classList.remove('hidden');
  if(isA())$('goBtn').disabled=true;else updR();
  say(T(four?'Choisis la chaleur et le temps, puis allume le four !':'Choisis le temps, puis allume le micro-ondes !',four?'Règle la température et le temps.':'Règle le temps de cuisson.'));
}
function updR(){
  if($('rvTemp')){$('rvTemp').textContent=S.k.temp+' °C';$('rTemp').value=S.k.temp;}
  if($('rvTime')){$('rvTime').textContent=S.k.app==='four'?S.k.time+' min':fmtMin(S.k.time);$('rTime').value=S.k.time;}
}
$('panelCard').addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o){o.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');sfx.pop();S.k[o.dataset.k]=+o.dataset.v;
    const lab=o.textContent.replace(/🔥/g,'').trim();speak(lab+' !');
    $('goBtn').disabled=!(S.k.time!=null&&(S.k.app==='micro'||S.k.temp!=null));return;}
  const st=e.target.closest('.step');
  if(st){sfx.click();const k=st.dataset.k,lim=k==='temp'?[50,300]:S.k.app==='four'?[1,90]:[.5,15];S.k[k]=Math.min(lim[1],Math.max(lim[0],+(S.k[k]+ +st.dataset.d).toFixed(1)));updR();return;}
  const pa=e.target.closest('[data-pa]');
  if(pa&&pa.dataset.pa==='cancel'){$('panel').classList.add('hidden');sfx.click();}
  if(pa&&pa.dataset.pa==='go')cook();
});
$('panelCard').addEventListener('input',e=>{if(e.target.id==='rTemp')S.k.temp=+e.target.value;if(e.target.id==='rTime')S.k.time=+e.target.value;updR();});
$('panel').addEventListener('click',e=>{if(e.target.id==='panel'){$('panel').classList.add('hidden');}});
$('oven').addEventListener('click',()=>openPanel('four'));
$('micro').addEventListener('click',()=>openPanel('micro'));

/* textes selon le résultat */
const LINES={
  parfait:['Bravo ! C\'est parfait ! Donne-le à Wanji !','Parfait ! '],
  mou:['Hihi, c\'est tout mou, comme une éponge !','Tout mou ! '],
  cru:['Oh oh, c\'est encore tout cru ! Il fallait plus chaud, ou plus longtemps.','Encore cru. '],
  brule:['Oups ! C\'est tout noir, ça a brûlé !','Brûlé ! '],
  carbonise:['Oh là là, c\'est du charbon ! Que de fumée !','Carbonisé ! '],
  vert:['Beurk, une mixture verte qui fume ! On la donne à Wanji ?','Mixture verte ! '],
  explose:['BOUM ! Ça a explosé ! Il y a de la pâte partout ! Aide-moi à nettoyer : touche les taches !','BOUM ! ']
};
async function cook(){
  $('panel').classList.add('hidden');
  const app=S.k.app,rid=S.k.mixed,temp=S.k.temp,time=S.k.time;
  const res=evaluate(rid,app,temp,time);S.k.result={rid,...res};
  S.k.phase='cooking';renderBtns();
  const el=$(app==='four'?'oven':'micro'),win=el.querySelector('.win'),disp=el.querySelector('.disp');
  sfx.click();
  if(app==='four')disp.textContent=temp+'°';
  await fly(`<div style="width:100%;height:100%;border-radius:50%;background:${RECIPES[rid].pate};box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)"></div>`,$('bowl'),win,{dur:600,size:80,arc:80});
  S.k.bowl=[];S.k.mixed=null;renderBowl();
  win.classList.add('on');win.innerHTML=`<div class="wdish cook-${res.st}">${dishSVG(rid)}</div>`;
  say(T(app==='four'?'Le four chauffe… Regarde par la vitre !':'Ça tourne, ça tourne…',app==='four'?`Cuisson à ${temp} °C pendant ${time} min…`:`Micro-ondes : ${fmtMin(time)}…`));
  sfx.hum(3.4);
  const total=time*60,t0=performance.now(),D=3300;
  let smokeT=null;
  if(['brule','carbonise','vert','explose'].includes(res.st)){
    const col=res.st==='vert'||(res.st==='explose'&&rid==='mystere')?'rgba(110,210,80,.75)':res.st==='explose'?'rgba(200,200,210,.7)':'rgba(90,90,100,.75)';
    smokeT=setInterval(()=>{if(performance.now()-t0>D*.35)smokeFrom(el,col,res.st==='carbonise'?2:1)},260);
  }
  await new Promise(done=>{(function tick(){const p=Math.min(1,(performance.now()-t0)/D),s=Math.round(total*(1-p));disp.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(p<1)requestAnimationFrame(tick);else done();})();});
  clearInterval(smokeT);
  win.classList.remove('on');win.innerHTML='';disp.textContent='';
  if(res.st==='explose'){explode(rid);return;}
  sfx.ding();
  $('bowl').classList.add('hidden');
  const smoky=['brule','carbonise','vert'].includes(res.st);
  const wc=res.st==='vert'?'#7ddc5a':'#8f96a3';
  $('plate').innerHTML=plateSVG+`<div class="pdish st-${res.st}">${dishSVG(rid)}</div>`+(smoky?[0,1,2].map(i=>`<div class="wisp" style="left:${100+i*40}px;top:40px;--sc:${wc};animation-delay:${i*.5}s"></div>`).join(''):'');
  $('plate').classList.remove('hidden');
  if(res.st==='parfait'){burst($('plate'),['✨','⭐','✨'],10);P().found[rid]=true;saveDB();award('r_'+rid);}
  if(res.st==='vert')award('vert');
  if(res.st==='carbonise')award('carbo');
  if(res.st==='mou')award('eponge');
  S.k.phase='result';renderBtns();
  say(T(LINES[res.st][0],LINES[res.st][1]+res.why));
}
function splatSVG(c){return `<svg viewBox="0 0 100 100" style="width:100%;height:100%"><g fill="${c}" stroke="rgba(0,0,0,.18)" stroke-width="2"><circle cx="50" cy="50" r="28"/><circle cx="22" cy="40" r="11"/><circle cx="78" cy="34" r="12"/><circle cx="70" cy="76" r="10"/><circle cx="30" cy="74" r="13"/><circle cx="90" cy="60" r="5"/><circle cx="9" cy="62" r="5"/><circle cx="52" cy="11" r="6"/></g><g fill="${c}"><circle cx="50" cy="50" r="26"/><rect x="45" y="70" width="10" height="26" rx="5"/></g><ellipse cx="41" cy="41" rx="9" ry="6" fill="#fff" opacity=".4"/></svg>`}
async function explode(rid){
  const kit=$('s-kitchen');
  sfx.boom();
  $('flash').animate([{opacity:.95},{opacity:0}],{duration:600});
  kit.classList.remove('shake');void kit.offsetWidth;kit.classList.add('shake');
  setW('meh');sfx.whine();
  const n=isA()?5:7,c=RECIPES[rid].pate;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='splat';const sz=rnd(100,150);
    s.style.cssText=`left:${rnd(300,1020)}px;top:${rnd(120,560)}px;width:${sz}px;height:${sz}px;transform:rotate(${rnd(0,360)}deg)`;
    s.innerHTML=splatSVG(c);kit.appendChild(s);
    s.addEventListener('click',()=>wipe(s),{once:true});
  }
  award('boom');
  S.k.phase='clean';renderBtns();
  say(T(LINES.explose[0],LINES.explose[1]+S.k.result.why+' Nettoie les taches !'));
}
function wipe(s){
  sfx.squish();s.classList.add('wipe');burst(s,['🫧','✨'],3,60);
  setTimeout(()=>{s.remove();
    if(!document.querySelector('.splat')){award('menage');setW(null);kReset();say(T('Tout propre ! Merci ! On recommence ?','Cuisine nettoyée. Ajuste tes réglages et retente !'));}
  },360);
}

/* Wanji goûte */
async function feed(){
  const {rid,st}=S.k.result,R=RECIPES[rid];
  S.k.phase='feeding';renderBtns();
  if(R.choco){
    const kc=$('kicuitK').querySelector('.kc');kc.classList.add('alarm');sfx.alert();
    say(T('Stop ! Le chocolat, c\'est dangereux pour les chiens ! C\'est toi qui vas goûter, et Wanji aura une croquette.','Stop ! Le chocolat est toxique pour les chiens : ne jamais leur en donner ! Tu le goûtes toi-même, Wanji aura une croquette.'));
    await sleep(2600);kc.classList.remove('alarm');
    const t=$('taster');t.innerHTML=`<div class="av">${avatar(S.player)}</div>`;t.classList.remove('hidden');
    await fly(dishSVG(rid),$('plate').querySelector('.pdish'),t,{dur:700,size:110,arc:60});
    $('plate').classList.add('hidden');
    const good=st==='parfait'||st==='mou';
    sfx[good?'crunch':'yuck']();
    t.insertAdjacentHTML('beforeend',`<div class="tb">${good?'Miam ! 😋':'Beurk ! 🤢'}</div>`);
    if(good)burst(t,['😋','✨'],5,80);
    await sleep(1200);
    await fly('<svg viewBox="0 0 40 40"><path d="M8 14 a6 6 0 1 1 8 -6 h8 a6 6 0 1 1 8 6 a6 6 0 1 1 -8 6 h-8 a6 6 0 1 1 -8 -6z" fill="#c98d5a" stroke="#8a5a36" stroke-width="2"/></svg>',$('kicuitK'),$('wbowl'),{dur:700,size:46,arc:140,spin:360});
    setW('happy');sfx.bark();burst($('wanji'),['❤️','💕'],6,90);award('ami');
    say(T('Wanji adore sa croquette ! Tu protèges bien ton chien !','Wanji est ravi avec sa croquette. Bien joué !'));
    await sleep(2400);setW(null);S.k.phase='done';renderBtns();return;
  }
  const food=document.createElement('div');food.className='wfood';food.innerHTML=`<div class="st-${st}" style="width:100%;height:100%">${dishSVG(rid)}</div>`;
  await fly(dishSVG(rid),$('plate').querySelector('.pdish'),$('wbowl'),{dur:700,size:110,arc:80});
  $('plate').classList.add('hidden');$('wbowl').appendChild(food);
  let line='';
  if(st==='parfait'){
    setW('sniff');await sleep(700);setW('happy');sfx.bark();sfx.crunch();burst($('wanji'),['❤️','💕','😋'],9,110);
    food.style.opacity='0';
    line=T('Wanji se régale ! Il remue la queue !','Wanji se régale !');
    if(S.k.order===rid){
      const p=P();p.stars++;saveDB();sfx.fanfare();award('commande');if(p.stars>=3)award('star3');
      line+=T(' Et c\'est exactement ce qu\'il voulait ! Tu gagnes une étoile !',` Commande réussie : +1 étoile (${p.stars} au total) !`);
      S.k.order=null;
    }else if(S.k.order)line+=T(` Mais il voulait ${RECIPES[S.k.order].art}…`,` Mais sa commande, c'était ${RECIPES[S.k.order].art}.`);
  }else if(st==='mou'){
    setW('sniff');await sleep(800);setW('meh');sfx.crunch();food.style.opacity='0';
    line=T('Wanji mange… mais il trouve ça bizarre, tout mou !','Wanji mange, mais la texture le laisse perplexe.');
  }else if(st==='cru'){
    setW('sniff');await sleep(1100);setW('meh');sfx.whine();
    line=T('Wanji renifle… et penche la tête. Non merci, c\'est cru !','Wanji renifle et refuse : c\'est cru.');
  }else if(st==='vert'){
    setW('sniff');await sleep(600);setW('refuse');sfx.yuck();burst($('wanji'),['🤢','💨'],5,90);
    line=T('Wanji refuse catégoriquement et part se cacher !','Wanji refuse catégoriquement. Même un chien a ses limites !');
  }else{
    setW('sniff');await sleep(700);setW('yuck');sfx.yuck();burst($('wanji'),['🤢','💨'],5,90);
    line=T('Beurk ! Wanji fait la grimace !','Grimace de Wanji : c\'est immangeable.');
  }
  say(line);
  await sleep(2800);setW(null);food.remove();
  S.k.phase='done';renderBtns();renderOrder();
}
$('wanji').addEventListener('click',()=>{if(['prep','mixed','done'].includes(S.k.phase))wanjiTap($('wanjiBox'));});
$('kicuitK').addEventListener('click',()=>{
  if(S.k.phase==='cooking'||S.k.phase==='feeding')return;
  sfx.click();
  say(T(pick(['Tu peux caresser Wanji, il adore ça !','Essaie le bouton très chaud… si tu oses !','Regarde la bulle de Wanji pour savoir ce qu\'il veut !']),pick(['Astuce : la plupart des gâteaux cuisent entre 160 et 200 °C.','Le micro-ondes chauffe l\'eau à l\'intérieur des aliments, mais il ne dore rien.','Ton carnet de recettes se remplit à chaque plat parfait. Ouvre-le en haut à droite.','Au-delà de 260 °C… je ne réponds plus de rien !'])));
});

/* carnet de recettes (Rafael) */
$('kBook').addEventListener('click',()=>{
  sfx.click();const p=P(),n=REAL.filter(r=>p.found[r]).length;
  $('bookCard').innerHTML=`<h2>📖 Carnet de recettes · ${n}/${REAL.length}</h2><div class="blist">${REAL.map(r=>{const R=RECIPES[r],f=p.found[r],b=R.best==='four'?`🔥 four, ${R.four.t[0]}–${R.four.t[1]} °C, ${R.four.m[0]}–${R.four.m[1]} min`:`⚡ micro-ondes, ${fmtMin(R.micro.m[0])} à ${fmtMin(R.micro.m[1])}`;
    return `<div class="brow"><div class="bd ${f?'':'lock'}">${dishSVG(r)}</div><div><div class="bn">${R.n}</div>${f?`<div class="bi2">${R.ing.map(ingSVG).join('')}</div><div class="bx">${b}</div>`:`<div class="bx">${R.ing.length} ingrédients · meilleur au ${R.best==='four'?'four 🔥':'micro-ondes ⚡'}</div><div class="bx">Pas encore réussie</div>`}</div></div>`;}).join('')}</div><div class="pfoot"><button class="btn" id="bookClose">Fermer</button></div>`;
  $('bookM').classList.remove('hidden');
  say(n<REAL.length?'Les recettes grises restent à découvrir. Le nom est un indice !':'Carnet complet ! Tu es un vrai chef.');
});
$('bookM').addEventListener('click',e=>{if(e.target.id==='bookM'||e.target.id==='bookClose'){$('bookM').classList.add('hidden');sfx.click();}});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
