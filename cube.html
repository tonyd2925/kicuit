<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kicuit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Le Cube de Rafael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: one narrow column; a level path on the home screen, one level card at a time */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --ink: #1A1E2C;
  --muted: #5C6378;
  --line: #D7DCE6;
  --red: #E0363A;
  --orange: #F2841C;
  --yellow: #F4C21B;
  --green: #189A55;
  --blue: #2259E0;
  --white: #FFFFFF;
  --accent: var(--blue);
  --good: #189A55;
  --bad: #D3343A;
  --shadow: 0 2px 0 #C9CFDB;
  --f-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141D; --surface: #1B1F2C; --surface-2: #232838; --ink: #EDF0F7; --muted: #A3AAC0; --line: #313849;
    --accent: #5A86FF; --good: #3CC27C; --bad: #FF5A5F; --shadow: 0 2px 0 #0A0C12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141D; --surface: #1B1F2C; --surface-2: #232838; --ink: #EDF0F7; --muted: #A3AAC0; --line: #313849;
  --accent: #5A86FF; --good: #3CC27C; --bad: #FF5A5F; --shadow: 0 2px 0 #0A0C12; color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.5rem; font-weight: 600; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stickers { display: flex; gap: 5px; }
.stickers i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.hero { display: flex; flex-direction: column; gap: 8px; }
.hero p { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--f-display); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Level path */
.path { display: flex; flex-direction: column; gap: 10px; }
.node {
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow);
}
.node[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.node .num {
  width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; color: #fff; background: var(--c);
}
.node .num.light { color: #1A1E2C; }
.node .name { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; line-height: 1.2; }
.node .sub { color: var(--muted); font-size: .9rem; }
.pill { font-size: .8rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.done { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.lock { background: var(--surface-2); color: var(--muted); }
.pill.go { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }

.progress { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow), var(--green), var(--blue)); }

/* Level screen */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.step { flex: 1 1 140px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: .9rem; }
.step b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-size: .75rem; flex: none; }
.step.ok b { background: var(--good); border-color: var(--good); color: #fff; }
ul.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.btn {
  border: none; border-radius: 14px; padding: 12px 18px; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem;
  background: var(--accent); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000);
}
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn[disabled] { opacity: .45; box-shadow: none; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.btn.good { background: var(--good); box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 60%, #000); }
.btn.bad { background: var(--bad); box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

/* Moves */
.seq { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 58px; padding: 6px 8px; border-radius: 12px; background: var(--surface-2); border: 2px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.chip .m { font-family: var(--f-mono); font-weight: 700; font-size: 1.3rem; line-height: 1.1; }
.chip .n { font-size: .68rem; color: var(--muted); font-weight: 700; text-align: center; line-height: 1.15; }
.chip.blank .m { color: transparent; }
.chip.blank { border-style: dashed; }
.chip.filled { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.chip.next { border-color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center;
}
.key .m { font-family: var(--f-mono); font-weight: 700; font-size: 1.25rem; }
.key .n { font-size: .66rem; color: var(--muted); font-weight: 700; text-align: center; line-height: 1.1; }
.key:active { transform: translateY(2px); box-shadow: none; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.feedback { font-weight: 800; min-height: 1.5em; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
.stars { display: flex; gap: 6px; }
.stars i { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: block; }
.stars i.on { background: var(--yellow); border-color: var(--yellow); }

/* Quiz */
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.qcount { color: var(--muted); font-weight: 700; font-size: .9rem; }

/* Challenge */
.scramble { font-family: var(--f-mono); font-weight: 700; font-size: 1.1rem; line-height: 1.8; background: var(--surface-2); border-radius: 12px; padding: 12px; word-spacing: .3em; }
.clock { font-family: var(--f-mono); font-weight: 700; font-size: 3rem; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.streak { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.streak i { width: 30px; height: 30px; border-radius: 8px; border: 2px dashed var(--line); display: block; }
.streak i.on { border: none; background: var(--green); }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.badge.on { border-color: var(--yellow); background: color-mix(in srgb, var(--yellow) 16%, var(--surface)); }
.badge b { font-family: var(--f-display); display: block; font-size: 1.05rem; }
.badge span { color: var(--muted); font-size: .85rem; font-weight: 700; }
.times { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-mono); font-size: .9rem; }
.times li { background: var(--surface-2); border-radius: 8px; padding: 3px 8px; }

.home { background: none; align-self: flex-start; color: var(--muted); font-weight: 700; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }

/* 3D cube viewer */
.viewer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.scene { width: 240px; height: 240px; perspective: 900px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.rc { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
.cb { position: absolute; width: 50px; height: 50px; left: -25px; top: -25px; transform-style: preserve-3d; }
.cb > i { position: absolute; inset: 0; display: block; background: #14161D; border-radius: 4px; backface-visibility: hidden; }
.cb > i.st { box-shadow: inset 0 0 0 3.5px #14161D; border-radius: 9px; }
.cb.hl > i.st { box-shadow: inset 0 0 0 3.5px #14161D, inset 0 0 0 7px rgba(255, 255, 255, .85); }
.vhint { color: var(--muted); font-size: .9rem; text-align: center; max-width: 34ch; }
.movename { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; min-height: 1.6em; text-align: center; }
.movename b { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
.formrow { display: flex; flex-direction: column; gap: 8px; }
button.chip { cursor: pointer; font: inherit; color: inherit; }
button.chip.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); transform: translateY(-2px); }
.seg { display: flex; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .85rem; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* Who plays + Nana mode */
.who { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.wcard { border: 1px solid var(--line); background: var(--surface); border-radius: 22px; padding: 22px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wcard .av { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; color: #fff; }
.wcard .wn { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; }
.wcard .wm { color: var(--muted); font-weight: 700; }
.ntiles { display: flex; flex-direction: column; gap: 12px; }
.ntile { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); }
.ntile[disabled] { opacity: .45; box-shadow: none; }
.ntile .big { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; color: #fff; background: var(--c); }
.ntile .nt { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; }
.ntile .star { width: 40px; height: 40px; }
.nprompt { font-family: var(--f-display); font-weight: 600; font-size: 1.6rem; text-align: center; text-wrap: balance; }
.say { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 52px; height: 52px; font-size: 1.5rem; box-shadow: var(--shadow); }
.dots { display: flex; justify-content: center; gap: 8px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.dots i.on { background: var(--yellow); border-color: var(--yellow); }
.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; justify-items: center; }
.cbtn { width: 86px; height: 86px; border-radius: 22px; border: 4px solid #14161D; box-shadow: 0 5px 0 #14161D; }
.cbtn:active { transform: translateY(4px); box-shadow: none; }
.icons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ibtn { border: 2px solid var(--line); background: var(--surface); border-radius: 22px; padding: 10px; box-shadow: var(--shadow); display: grid; place-items: center; }
.ibtn svg { width: 100%; max-width: 120px; height: auto; display: block; }
.ibtn:active { transform: translateY(3px); box-shadow: none; }
.ibtn.hint { border-color: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--yellow) 45%, transparent); } }
.bigbtn { font-size: 1.5rem; padding: 18px 22px; border-radius: 20px; }
.count { font-family: var(--f-display); font-weight: 700; font-size: 2.6rem; text-align: center; }
.win { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px 0; }
.win svg { width: 140px; height: 140px; }
@media (prefers-reduced-motion: reduce) { .ibtn.hint { animation: none; } }
/* Solver */
.ftabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ftab { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 6px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .9rem; }
.ftab i { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #14161D; flex: none; display: block; }
.ftab.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.ftab .n { margin-left: auto; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.ftab.full .n { color: var(--good); }
.editor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 300px); margin: 0 auto; padding: 10px; background: #14161D; border-radius: 18px; }
.cell { aspect-ratio: 1; border-radius: 12px; border: none; background: #3A3F4F; }
.cell.empty { background: repeating-linear-gradient(45deg, #3A3F4F 0 6px, #444A5C 6px 12px); }
.cell[disabled] { cursor: default; box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .25); }
.palette { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pcol { width: 44px; height: 44px; border-radius: 14px; border: 3px solid #14161D; }
.pcol.on { outline: 4px solid var(--accent); outline-offset: 3px; }
.net { display: grid; grid-template-columns: repeat(4, max-content); gap: 4px; justify-content: center; }
.mface { display: grid; grid-template-columns: repeat(3, 12px); gap: 2px; padding: 3px; border-radius: 6px; background: #14161D; border: 2px solid transparent; }
.mface.on { border-color: var(--accent); }
.mface i { width: 12px; height: 12px; border-radius: 3px; background: #444A5C; display: block; }
.err { color: var(--bad); font-weight: 800; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stepcount { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; text-align: center; }
.solseq { max-height: 220px; overflow-y: auto; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.foot { display: flex; justify-content: center; }
.link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: .85rem; }
.celebrate { text-align: center; font-family: var(--f-display); font-size: 1.3rem; font-weight: 600; color: var(--good); }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .btn:active, .key:active { transform: none; } }
</style>

</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
const MOVES = {
  "R": "Droite monte", "R'": "Droite descend", "L": "Gauche descend", "L'": "Gauche monte",
  "U": "Haut à gauche", "U'": "Haut à droite", "U2": "Haut 2 fois", "D": "Bas à droite", "D'": "Bas à gauche",
  "F": "Devant horaire", "F'": "Devant anti-horaire",
  "R2": "Droite 2 fois", "L2": "Gauche 2 fois", "D2": "Bas 2 fois", "F2": "Devant 2 fois",
  "B": "Derrière, le haut va à gauche", "B'": "Derrière, le haut va à droite", "B2": "Derrière 2 fois"
};
const PAD = ["R","R'","L","L'","U","U'","U2","D","D'","F","F'"];
const COLORS = ["--white","--yellow","--red","--orange","--green","--blue","--red","--orange","--green"];

const LEVELS = [
  { name: "Connaître son cube", sub: "Les pièces et les mouvements",
    tips: ["Les centres ne bougent jamais.", "Une arête a 2 couleurs, un coin en a 3.", "Blanc en face de jaune, rouge en face d'orange, bleu en face de vert."],
    formulas: [{ name: "La petite danse", seq: ["R","U","R'","U'"] }],
    quiz: [
      { q: "Quelle pièce ne bouge jamais ?", a: ["Le centre", "Le coin", "L'arête"], r: 0 },
      { q: "Combien de couleurs a un coin ?", a: ["2", "3", "1"], r: 1 },
      { q: "Quelle couleur est en face du blanc ?", a: ["Le rouge", "Le vert", "Le jaune"], r: 2 },
      { q: "Que veut dire R' ?", a: ["Droite monte", "Droite descend", "Haut à droite"], r: 1 },
      { q: "Que veut dire U ?", a: ["Haut à gauche", "Haut à droite", "Bas à droite"], r: 0 }
    ],
    challenge: "Prends un cube terminé et fais la petite danse 6 fois de suite. S'il redevient comme au départ, c'est réussi.", scramble: false },
  { name: "La marguerite", sub: "4 pétales blancs autour du jaune",
    tips: ["Centre jaune en haut.", "Amène chaque arête blanche à côté du centre jaune, blanc vers le haut.", "Avant de tourner une face, mets les pétales déjà posés à l'abri avec U."],
    formulas: [],
    quiz: [
      { q: "Autour de quel centre fait-on la marguerite ?", a: ["Le blanc", "Le jaune", "Le rouge"], r: 1 },
      { q: "Combien de pétales blancs faut-il ?", a: ["4", "8", "6"], r: 0 },
      { q: "Avant de tourner une face, tu vérifies…", a: ["que le cube est propre", "que tu ne fais pas tomber un pétale", "l'heure"], r: 1 }
    ],
    challenge: "Mélange ton cube, puis fais la marguerite sans regarder le tuto." , scramble: true },
  { name: "La croix blanche", sub: "Descendre les pétales",
    tips: ["Tourne le haut pour mettre l'autre couleur du pétale au-dessus de son centre.", "Tourne cette face 2 fois : le pétale descend.", "Ensuite, garde toujours le blanc en bas."],
    formulas: [],
    quiz: [
      { q: "Le pétale a du rouge sur le côté. Tu l'amènes au-dessus de…", a: ["n'importe quel centre", "le centre rouge", "le centre blanc"], r: 1 },
      { q: "Pour faire descendre le pétale, tu tournes sa face…", a: ["1 fois", "2 fois", "3 fois"], r: 1 },
      { q: "Après la croix, où est le blanc ?", a: ["En bas", "En haut", "Devant"], r: 0 }
    ],
    challenge: "Mélange, puis fais la marguerite et la croix blanche, avec les côtés de la bonne couleur.", scramble: true },
  { name: "Les coins blancs", sub: "Le premier étage",
    tips: ["Blanc en bas.", "Mets le coin en haut, juste au-dessus de sa place, devant à droite.", "Petite danse jusqu'à ce qu'il soit rangé (5 fois maximum)."],
    formulas: [{ name: "La petite danse", seq: ["R","U","R'","U'"] }],
    quiz: [
      { q: "Où mets-tu le coin avant de danser ?", a: ["En bas à gauche", "En haut, devant à droite, au-dessus de sa place", "N'importe où"], r: 1 },
      { q: "Combien de petites danses au maximum pour un coin ?", a: ["5", "1", "20"], r: 0 },
      { q: "Un coin est coincé en bas, mal placé. Tu fais…", a: ["Rien", "Une petite danse pour le remonter", "Tu démontes le cube"], r: 1 }
    ],

const RC = (() => {
  const COL = { U: "#F4C21B", D: "#FFFFFF", F: "#189A55", B: "#2259E0", R: "#F2841C", L: "#E0363A" };
  const S = 52;
  const FACES = [
    ["F", "translateZ(25px)", c => c.p[2] === 1],
    ["B", "rotateY(180deg) translateZ(25px)", c => c.p[2] === -1],
    ["R", "rotateY(90deg) translateZ(25px)", c => c.p[0] === 1],
    ["L", "rotateY(-90deg) translateZ(25px)", c => c.p[0] === -1],
    ["U", "rotateX(90deg) translateZ(25px)", c => c.p[1] === 1],
    ["D", "rotateX(-90deg) translateZ(25px)", c => c.p[1] === -1]

  const AX = { x: 0, y: 1, z: 2 };
  const MV = { R: ["x", 1, -90], L: ["x", -1, 90], U: ["y", 1, -90], D: ["y", -1, 90], F: ["z", 1, -90], B: ["z", -1, 90] };
  const I = () => [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  function rot(axis, deg) {
    const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    if (axis === "x") return [[1, 0, 0], [0, c, -s], [0, s, c]];
    if (axis === "y") return [[c, 0, s], [0, 1, 0], [-s, 0, c]];
    return [[c, -s, 0], [s, c, 0], [0, 0, 1]];
  }
  const mul = (A, B) => A.map((r, i) => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
  const mv = (A, v) => A.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
  const rnd = x => Math.round(x);
  const sg = [1, -1, 1];

  const el = document.createElement("div"); el.className = "viewer";
  el.innerHTML = `<div class="movename" aria-live="polite"></div><div class="scene"><div class="rc"></div></div>`;
  const scene = el.querySelector(".scene"), rc = el.querySelector(".rc"), label = el.querySelector(".movename");
  let cubies = [], vx = -26, vy = -36, busy = false, token = 0, speed = 900, quiet = false;

  function place(c, R) {
    const A = R ? mul(R, c.O) : c.O, q = R ? mv(R, c.p) : c.p;
    const m = (i, j) => A[i][j] * sg[i] * sg[j];
    c.el.style.transform = `matrix3d(${m(0,0)},${m(1,0)},${m(2,0)},0,${m(0,1)},${m(1,1)},${m(2,1)},0,${m(0,2)},${m(1,2)},${m(2,2)},0,${q[0] * S},${-q[1] * S},${q[2] * S},1)`;
  }
  function view() { rc.style.transform = `rotateX(${vx}deg) rotateY(${vy}deg)`; }
  function build() {
    token++; busy = false; rc.innerHTML = ""; cubies = [];
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
      if (!x && !y && !z) continue;
      const c = { p: [x, y, z], h: [x, y, z], O: I(), el: document.createElement("div") };
      c.el.className = "cb";
      c.el.innerHTML = FACES.map(([f, tr, out]) => `<i class="${out(c) ? "st" : ""}" style="transform:${tr};${out(c) ? "background:" + COL[f] : ""}"></i>`).join("");
      rc.appendChild(c.el); place(c); cubies.push(c);
    }
    vx = -26; vy = -36; view(); label.innerHTML = "";
  }
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function turn(m, tk) {
    const [axis, layer, base] = MV[m[0]];
    const angle = base * (m.includes("'") ? -1 : 1) * (m.includes("2") ? 2 : 1);
    const k = AX[axis], group = cubies.filter(c => rnd(c.p[k]) === layer);
    label.innerHTML = quiet ? "" : `<b>${m}</b>${esc(MOVES[m] || "")}`;
    group.forEach(c => c.el.classList.add("hl"));
    await wait(speed * .35);
    if (tk !== token) return;
    const dur = speed * (m.includes("2") ? 1.5 : 1);
    await new Promise(res => {
      const t0 = performance.now();
      const step = now => {
        if (tk !== token) return res();

    group.forEach(c => { c.O = mul(R, c.O).map(r => r.map(rnd)); c.p = mv(R, c.p).map(rnd); place(c); c.el.classList.remove("hl"); });
  }
  async function play(seq, onStep) {
    if (busy) return; busy = true; const tk = token;
    for (let i = 0; i < seq.length; i++) {
      if (tk !== token) return;
      onStep && onStep(i);
      await turn(seq[i], tk);

  build();

    seq.forEach(m => {
      const [axis, layer, base] = MV[m[0]];
      const R = rot(axis, base * (m.includes("'") ? -1 : 1) * (m.includes("2") ? 2 : 1)), k = AX[axis];
      cubies.filter(c => rnd(c.p[k]) === layer).forEach(c => { c.O = mul(R, c.O).map(r => r.map(rnd)); c.p = mv(R, c.p).map(rnd); place(c); });
    });
  }
  function solved() {
    return cubies.every(c => Math.abs(c.h[0]) + Math.abs(c.h[1]) + Math.abs(c.h[2]) < 2 ||
      (c.p.every((v, i) => v === c.h[i]) && c.O.every((r, i) => r.every((v, j) => v === (i === j ? 1 : 0)))));
  }
  return { el, play, apply, solved, setQuiet: q => { quiet = q; label.innerHTML = ""; }, reset: build, setSpeed: ms => { speed = ms; }, get speed() { return speed; }, get busy() { return busy; } };
})();

    RC.apply(seq); NG.sol = [inv(seq[1]), inv(seq[0])];
    NG.opts = shuffle(["R", "R'", "U", "U'"]); NG.prompt = "Deux tours à réparer !"; render(); say(NG.prompt);

}
function nStart(i) { NG = { level: i, score: 0, win: false }; view = { screen: "ngame" }; nNext(); }
async function nGood() {
  NG.score++; NG.hint = false;
  if (NG.score >= NLV[NG.level].need) { NS.done[NG.level] = true; nsave(); NG.win = true; render(); say("Bravo Nana ! Tu as gagné une étoile !"); return; }
  NG.prompt = rand(["Bravo !", "Super !", "Génial !", "Trop fort !"]); render(); say(NG.prompt);
  await sleep(1300); if (view.screen === "ngame" && NG && !NG.win) nNext();
}
async function nPick(m) {
  if (RC.busy || NG.win) return;
  const lv = NG.level;
  if (lv === 0) {
    if (m === NG.target) return nGood();
    say(`Ça, c'est ${art(m)}. Cherche ${art(NG.target)} !`); return;
  }
  if (lv === 1) {
    if (m === NG.ans) return nGood();
    NG.hint = true; NG.prompt = "Regarde encore !"; render(); say(NG.prompt);
    RC.reset(); await sleep(600); await RC.play([NG.ans]); return;
  }
  NG.taps.push(m); render();
  await RC.play([m]);
  if (!NG) return;
  if (RC.solved()) return nGood();
  if (NG.taps.length >= NG.sol.length) {
    NG.prompt = "Oups ! On revient en arrière."; render(); say(NG.prompt);
    await RC.play(NG.taps.slice().reverse().map(inv));
    if (!NG) return;
    NG.taps = []; NG.hint = true; NG.prompt = "Essaie le dessin qui brille."; render(); say(NG.prompt);
  } else render();
}
async function nDance() {
  if (RC.busy || NG.win || NG.dancing) return;
  NG.dancing = true;
  NG.prompt = `Danse numéro ${NG.dances + 1}. Fais pareil !`; render(); say(NG.prompt);
  await sleep(1500); if (!NG) return; await RC.play(DANCE);
  if (!NG) return;
  NG.dancing = false;
  NG.dances++;
  if (NG.dances >= 6) { NG.score = 6; NS.done[4] = true; nsave(); NG.win = true; render(); say("Magie ! Ton cube est redevenu tout neuf. Bravo Nana !"); return; }
  NG.score = NG.dances; NG.prompt = "Bien joué ! Encore une ?"; render();
}

/* ---------- Solver ---------- */
const SOLVER_BASE = "vendor/cubejs/";
const USE_WORKER = true;
const FL = ["U", "R", "F", "D", "L", "B"];
const FHEX = { U: "#F4C21B", R: "#F2841C", F: "#189A55", D: "#FFFFFF", L: "#E0363A", B: "#2259E0" };
const FNAME = { U: "jaune", R: "orange", F: "vert", D: "blanc", L: "rouge", B: "bleu" };
const FORDER = ["F", "R", "B", "L", "U", "D"];
const FTIP = {
  F: "Jaune en haut, vert devant toi. Recopie la face qui te regarde.",
  R: "Tourne tout le cube d'un quart de tour vers la gauche : l'orange est devant toi, le jaune toujours en haut.",
  B: "Encore un quart de tour vers la gauche : le bleu est devant toi, le jaune en haut.",
  L: "Encore un quart de tour vers la gauche : le rouge est devant toi, le jaune en haut.",
  U: "Remets le vert devant toi, puis bascule le cube vers toi : tu vois le jaune, et le vert est en bas.",
  D: "Remets le vert devant toi, puis bascule le cube vers l'arrière : tu vois le blanc, et le vert est en haut."
};
const FWHERE = { F: "devant", R: "droite", B: "derrière", L: "gauche", U: "dessus", D: "dessous" };
const SOLVED = FL.map(f => f.repeat(9)).join("");
let SV = null;
function svNew() {
  const faces = {}; FL.forEach(f => { faces[f] = Array(9).fill(null); faces[f][4] = f; });
  return { faces, cur: "F", paint: "F", sol: null, step: 0, err: "", thinking: false };
}
const svString = () => FL.map(f => SV.faces[f].map(x => x || "?").join("")).join("");
const sinv = m => m.endsWith("2") ? m : inv(m);
function loadScript(src) { return new Promise((res, rej) => { const t = document.createElement("script"); t.src = src; t.onload = res; t.onerror = rej; document.head.appendChild(t); }); }
let cubeLib = null;
function needCube() { if (!cubeLib) cubeLib = window.Cube ? Promise.resolve() : loadScript(SOLVER_BASE + "cube.js"); return cubeLib; }
let worker = null, workerFailed = false, mainSolver = null;
function getWorker() {
  if (!USE_WORKER || workerFailed || typeof Worker === "undefined") return null;
  if (!worker) { try { worker = new Worker("solver-worker.js"); worker.postMessage({ cmd: "init" }); } catch (e) { workerFailed = true; worker = null; } }
  return worker;
}
function solveState(state) {
  const w = getWorker();
  if (w) return new Promise((res, rej) => {
    const on = e => { if (e.data.cmd === "solve") { w.removeEventListener("message", on); res(e.data.sol); } else if (e.data.cmd === "error") { w.removeEventListener("message", on); rej(e.data.msg); } };
    w.addEventListener("message", on);
    w.onerror = () => { workerFailed = true; worker = null; solveState(state).then(res, rej); };
    w.postMessage({ cmd: "solve", state });
  });
  if (!mainSolver) mainSolver = needCube().then(() => window.Cube.initSolver ? null : loadScript(SOLVER_BASE + "solve.js")).then(() => new Promise(r => setTimeout(() => { window.Cube.initSolver(); r(); }, 50)));
  return mainSolver.then(() => window.Cube.fromString(state).solve());
}
function validate(str) {
  const empty = (str.match(/\?/g) || []).length;
  if (empty) return `Il reste ${empty} case${empty > 1 ? "s" : ""} à colorier.`;
  for (const f of FL) { const n = str.split(f).length - 1; if (n !== 9) return `Il y a ${n} cases ${FNAME[f]}${n > 1 ? "s" : ""} : il en faut exactement 9. Vérifie tes faces.`; }
  if (str === SOLVED) return "Ton cube est déjà fini, bravo !";
  const c = window.Cube.fromString(str);
  if (c.asString() !== str) return "Une pièce n'existe pas sur un vrai cube : une couleur est mal recopiée. Vérifie les coins et les bords.";
  const perm = a => a.slice().sort((x, y) => x - y).every((v, i) => v === i);
  const par = a => { let n = 0; for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) n++; return n % 2; };
  const sum = a => a.reduce((x, y) => x + y, 0);
  if (!perm(c.cp) || !perm(c.ep)) return "Une pièce apparaît deux fois : une couleur est mal recopiée.";
  if (sum(c.co) % 3 || sum(c.eo) % 2 || par(c.cp) !== par(c.ep)) return "Ce mélange est impossible : une case a dû être mal recopiée (ou le cube a été démonté et remonté). Vérifie tes faces.";
  return "";
}

function renderSolver() {
  const top = `<div class="top"><button class="back" data-go="${SV.from || "who"}">← Retour</button><span class="label">Solveur</span></div>`;
  if (SV.sol) {

      <section class="card"><div class="stepcount">${done ? `Bravo ! ${n} coups` : `Coup ${SV.step + 1} sur ${n}`}</div>
        <div class="vslot"></div>
        <div class="row"><button class="btn ghost" data-sprev="1" ${SV.step ? "" : "disabled"}>◀ Retour</button><button class="btn" data-snext="1" ${done ? "disabled" : ""}>Coup suivant ▶</button></div>
        <div class="seq solseq">${SV.sol.map((m, k) => chip(m, k < SV.step ? "filled" : k === SV.step ? "next" : "")).join("")}</div>
      </section>

      ${SV.thinking ? `<div class="row" style="align-items:center;justify-content:center"><div class="spin"></div><strong>Je réfléchis…</strong></div>` : `<button class="btn good bigbtn" data-ssolve="1">Trouver la solution</button>`}
      <div class="row"><button class="btn ghost" data-sclear="1">Tout effacer</button><button class="btn ghost" data-sdemo="1">Exemple mélangé</button></div>
    </section>`;
}
async function svSolve() {
  SV.err = ""; await needCube();
  const str = svString(), msg = validate(str);
  if (msg) { SV.err = msg; return render(); }
  SV.thinking = true; render();
  try {
    const sol = await solveState(str);
    if (!SV) return;
    SV.thinking = false; SV.sol = sol.trim() ? sol.trim().split(/\s+/) : []; SV.step = 0;
    RC.reset(); RC.setQuiet(false); RC.apply(SV.sol.slice().reverse().map(sinv)); render();
  } catch (e) { SV.thinking = false; SV.err = "Le solveur n'a pas réussi à se lancer. Recharge la page et réessaie."; render(); }
}

function go(target) {
  stopTimer();
  if (view.screen === "ngame") { NG = null; RC.reset(); RC.setQuiet(false); RC.setSpeed(900); try { speechSynthesis.cancel(); } catch (e) {} }
  if (view.screen === "solver" && target !== "solver") RC.reset();
  if (target === "solver") { const from = view.screen === "map" ? "map" : "who"; if (!SV) SV = svNew(); SV.from = from; view = { screen: "solver" }; needCube().catch(() => {}); getWorker(); }
  else if (target === "who") view = { screen: "who" };
  else if (target === "nana") view = { screen: "nmap" };
  else if (target === "map") view = { screen: "map" };
  else if (target === "chrono") view = { screen: "chrono", scr: scramble() };
  else view = { screen: "level", level: Number(target), scr: scramble() };
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.sface) { SV.cur = d.sface; SV.err = ""; return render(); }
  if (d.spaint) { SV.paint = d.spaint; return render(); }
  if (d.scell !== undefined) { const k = Number(d.scell), a = SV.faces[SV.cur]; a[k] = a[k] === SV.paint ? null : SV.paint; SV.err = ""; return render(); }
  if (d.sclear) { const keep = SV.from; SV = svNew(); SV.from = keep; return render(); }
  if (d.sdemo) { needCube().then(() => { const str = window.Cube.random().asString(); FL.forEach((f, i) => { SV.faces[f] = str.slice(i * 9, i * 9 + 9).split(""); }); SV.err = ""; render(); }); return; }
  if (d.ssolve) { svSolve(); return; }
  if (d.snext) { if (RC.busy || SV.step >= SV.sol.length) return; const m = SV.sol[SV.step]; SV.step++; render(); RC.play([m]); return; }
  if (d.sprev) { if (RC.busy || !SV.step) return; SV.step--; render(); RC.play([sinv(SV.sol[SV.step])]); return; }
  if (d.snew) { const keep = SV.from; SV = svNew(); SV.from = keep; RC.reset(); return render(); }
  if (d.nlvl !== undefined) { nStart(Number(d.nlvl)); return; }
  if (d.npick) { nPick(d.npick); return; }
  if (d.nsay) { if (NG) say(NG.win ? "Bravo Nana !" : NG.prompt); return; }
  if (d.nreplay) { if (!RC.busy) { RC.reset(); RC.play([NG.ans]); } return; }
  if (d.ndance) { nDance(); return; }
  if (b.id === "nunlock") { NS.unlockAll = !NS.unlockAll; nsave(); return render(); }
  if (d.one) { if (!RC.busy) RC.play([d.one], k => { document.getElementById("app").querySelectorAll("button.chip.now").forEach(x => x.classList.remove("now")); if (k >= 0) b.classList.add("now"); }); return; }
  if (d.play !== undefined) {
    const row = b.closest(".formrow"), f = LEVELS[view.level].formulas[Number(d.play)];
    RC.play(f.seq, k => { row.querySelectorAll("button.chip").forEach((x, j) => x.classList.toggle("now", j === k)); });
    return;
  }
  if (d.reset) { RC.reset(); return; }
  if (d.speed) { RC.setSpeed(Number(d.speed)); document.getElementById("app").querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); return; }
  if (d.go !== undefined) { if (view.screen === "level" && d.go !== String(view.level)) RC.reset(); return go(d.go); }
  if (b.id === "unlock") { S.unlockAll = !S.unlockAll; save(); return render(); }
  if (d.quiz) { quiz = { level: view.level ?? quiz.level, idx: 0, score: 0, picked: null }; view = { screen: "quiz" }; return render(); }
  if (d.pick !== undefined) { const q = LEVELS[quiz.level].quiz[quiz.idx]; quiz.picked = Number(d.pick); if (quiz.picked === q.r) quiz.score++; return render(); }
  if (d.qnext) {
    quiz.idx++; quiz.picked = null;
    if (quiz.idx >= LEVELS[quiz.level].quiz.length && quiz.score === LEVELS[quiz.level].quiz.length) { S.levels[quiz.level].quiz = true; save(); }
    return render();
  }
  if (d.drill !== undefined) { const lvl = view.screen === "drill" ? drill.level : view.level; drill = { level: lvl, f: Number(d.drill), pos: 0, errors: 0 }; view = { screen: "drill" }; return render(); }
  if (d.key) {
    const f = LEVELS[drill.level].formulas[drill.f];
    if (d.key === f.seq[drill.pos]) {
      drill.pos++; drill.msg = ""; drill.msgCls = "";
      if (drill.pos >= f.seq.length) {
        const st = S.levels[drill.level];
        if (drill.errors === 0) { st.drills[f.name] = (st.drills[f.name] || 0) + 1; drill.msg = "Parfait, sans erreur ! Une étoile de plus."; drill.msgCls = "good"; }
        else { drill.msg = "Formule complète. Refais-la sans erreur pour gagner une étoile."; drill.msgCls = "good"; }
        save();
      }
      return render();
    }
    drill.errors++; drill.msg = "Ce n'est pas ce mouvement. Réfléchis encore."; drill.msgCls = "bad"; render();
    const slots = document.getElementById("slots"); if (slots) { slots.classList.add("shake"); }
    return;
  }
  if (d.hint) { const f = LEVELS[drill.level].formulas[drill.f]; drill.errors++; drill.msg = `Le mouvement suivant est ${f.seq[drill.pos]} : ${MOVES[f.seq[drill.pos]]}.`; drill.msgCls = ""; return render(); }
  if (d.newscr) { view.scr = scramble(); return render(); }
  if (d.res) {
    const st = S.levels[view.level];
    const t = timer ? performance.now() - timer.t0 : view.lastTime;
    if (d.res === "ok") { st.streak = Math.min(st.streak + 1, 3); if (t) st.best = st.best ? Math.min(st.best, t) : t; }
    else st.streak = levelDone(view.level) ? st.streak : 0;
    stopTimer(); view.lastTime = 0; save(); view.scr = scramble(); return render();
  }
  if (b.id === "tstart" || b.id === "cstart") {
    if (timer) {
      const t = performance.now() - timer.t0; stopTimer();
      if (b.id === "cstart") { S.solves.push(t); save(); view.scr = scramble(); }
      else view.lastTime = t;
      return render();
    }
    timer = { t0: performance.now() };
    timer.int = setInterval(() => { const c = document.getElementById("clock"); if (c && timer) c.textContent = fmt(performance.now() - timer.t0); }, 100);
    return render();
  }
});

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
