<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kicuit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="version.js"></script>
<title>Le Cube de Rafael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: one narrow column; a level path on the home screen, one level card at a time */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --ink: #1A1E2C;
  --muted: #5C6378;
  --line: #D7DCE6;
  --red: #E0363A;
  --orange: #FF5F00;
  --yellow: #FFE234;
  --green: #189A55;
  --blue: #2259E0;
  --white: #FFFFFF;
  --accent: var(--blue);
  --good: #189A55;
  --bad: #D3343A;
  --shadow: 0 2px 0 #C9CFDB;
  --f-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141D; --surface: #1B1F2C; --surface-2: #232838; --ink: #EDF0F7; --muted: #A3AAC0; --line: #313849;
    --accent: #5A86FF; --good: #3CC27C; --bad: #FF5A5F; --shadow: 0 2px 0 #0A0C12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141D; --surface: #1B1F2C; --surface-2: #232838; --ink: #EDF0F7; --muted: #A3AAC0; --line: #313849;
  --accent: #5A86FF; --good: #3CC27C; --bad: #FF5A5F; --shadow: 0 2px 0 #0A0C12; color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.5rem; font-weight: 600; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stickers { display: flex; gap: 5px; }
.stickers i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.hero { display: flex; flex-direction: column; gap: 8px; }
.hero p { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--f-display); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Level path */
.path { display: flex; flex-direction: column; gap: 10px; }
.node {
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow);
}
.node[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.node .num {
  width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; color: #fff; background: var(--c);
}
.node .num.light { color: #1A1E2C; }
.node .name { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; line-height: 1.2; }
.node .sub { color: var(--muted); font-size: .9rem; }
.pill { font-size: .8rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.done { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.lock { background: var(--surface-2); color: var(--muted); }
.pill.go { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }

.progress { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow), var(--green), var(--blue)); }

/* Level screen */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.step { flex: 1 1 140px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: .9rem; }
.step b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-size: .75rem; flex: none; }
.step.ok b { background: var(--good); border-color: var(--good); color: #fff; }
ul.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.btn {
  border: none; border-radius: 14px; padding: 12px 18px; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem;
  background: var(--accent); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000);
}
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn[disabled] { opacity: .45; box-shadow: none; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.btn.good { background: var(--good); box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 60%, #000); }
.btn.bad { background: var(--bad); box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

/* Moves */
.seq { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 58px; padding: 6px 8px; border-radius: 12px; background: var(--surface-2); border: 2px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.chip .m { font-family: var(--f-mono); font-weight: 700; font-size: 1.3rem; line-height: 1.1; }
.chip .n { font-size: .68rem; color: var(--muted); font-weight: 700; text-align: center; line-height: 1.15; }
.chip.blank .m { color: transparent; }
.chip.blank { border-style: dashed; }
.chip.filled { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.chip.next { border-color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center;
}
.key .m { font-family: var(--f-mono); font-weight: 700; font-size: 1.25rem; }
.key .n { font-size: .66rem; color: var(--muted); font-weight: 700; text-align: center; line-height: 1.1; }
.key:active { transform: translateY(2px); box-shadow: none; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.feedback { font-weight: 800; min-height: 1.5em; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
.stars { display: flex; gap: 6px; }
.stars i { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: block; }
.stars i.on { background: var(--yellow); border-color: var(--yellow); }

/* Quiz */
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.qcount { color: var(--muted); font-weight: 700; font-size: .9rem; }

/* Challenge */
.scramble { font-family: var(--f-mono); font-weight: 700; font-size: 1.1rem; line-height: 1.8; background: var(--surface-2); border-radius: 12px; padding: 12px; word-spacing: .3em; }
.clock { font-family: var(--f-mono); font-weight: 700; font-size: 3rem; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.streak { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.streak i { width: 30px; height: 30px; border-radius: 8px; border: 2px dashed var(--line); display: block; }
.streak i.on { border: none; background: var(--green); }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.badge.on { border-color: var(--yellow); background: color-mix(in srgb, var(--yellow) 16%, var(--surface)); }
.badge b { font-family: var(--f-display); display: block; font-size: 1.05rem; }
.badge span { color: var(--muted); font-size: .85rem; font-weight: 700; }
.times { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-mono); font-size: .9rem; }
.times li { background: var(--surface-2); border-radius: 8px; padding: 3px 8px; }

.home { background: none; align-self: flex-start; color: var(--muted); font-weight: 700; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }

/* 3D cube viewer */
.viewer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.scene { width: 240px; height: 240px; perspective: 900px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.rc { position: relative; width: 0; height: 0; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
.cb { position: absolute; width: 50px; height: 50px; left: -25px; top: -25px; -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
.cb > i { -webkit-backface-visibility: hidden; position: absolute; inset: 0; display: block; background: #14161D; border-radius: 4px; backface-visibility: hidden; }
.cb > i.st { box-shadow: inset 0 0 0 3.5px #14161D; border-radius: 9px; }
.rc.focus .cb:not(.hl) > i.st { filter: brightness(.38) saturate(.5); }
.cb > i.st { transition: filter .25s; }
.cb.mk > i.st { box-shadow: inset 0 0 0 3.5px #14161D, inset 0 0 0 9px #FF2D95; }
.cb.hl > i.st { box-shadow: inset 0 0 0 3.5px #14161D, inset 0 0 0 7px rgba(255, 255, 255, .85); }
.vhint { color: var(--muted); font-size: .9rem; text-align: center; max-width: 34ch; }
.movename { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; min-height: 1.6em; text-align: center; }
.movename b { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
.formrow { display: flex; flex-direction: column; gap: 8px; }
button.chip { cursor: pointer; font: inherit; color: inherit; }
button.chip.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); transform: translateY(-2px); }
.seg { display: flex; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .85rem; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* Who plays + Nana mode */
.who { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.wcard { border: 1px solid var(--line); background: var(--surface); border-radius: 22px; padding: 22px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wcard .av { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; color: #fff; }
.wcard .wn { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; }
.wcard .wm { color: var(--muted); font-weight: 700; }
.ntiles { display: flex; flex-direction: column; gap: 12px; }
.ntile { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); }
.ntile[disabled] { opacity: .45; box-shadow: none; }
.ntile .big { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 2.2rem; color: #fff; background: var(--c); }
.ntile .nt { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; }
.ntile .star { width: 40px; height: 40px; }
.nprompt { font-family: var(--f-display); font-weight: 600; font-size: 1.6rem; text-align: center; text-wrap: balance; }
.say { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 52px; height: 52px; font-size: 1.5rem; box-shadow: var(--shadow); }
.dots { display: flex; justify-content: center; gap: 8px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.dots i.on { background: var(--yellow); border-color: var(--yellow); }
.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; justify-items: center; }
.cbtn { width: 86px; height: 86px; border-radius: 22px; border: 4px solid #14161D; box-shadow: 0 5px 0 #14161D; }
.cbtn:active { transform: translateY(4px); box-shadow: none; }
.icons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ibtn { border: 2px solid var(--line); background: var(--surface); border-radius: 22px; padding: 10px; box-shadow: var(--shadow); display: grid; place-items: center; }
.ibtn svg { width: 100%; max-width: 120px; height: auto; display: block; }
.ibtn:active { transform: translateY(3px); box-shadow: none; }
.ibtn[disabled] { opacity: .5; }
.ibtn.hint { border-color: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--yellow) 45%, transparent); } }
.bigbtn { font-size: 1.5rem; padding: 18px 22px; border-radius: 20px; }
.count { font-family: var(--f-display); font-weight: 700; font-size: 2.6rem; text-align: center; }
.win { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px 0; }
.win svg { width: 140px; height: 140px; }
@media (prefers-reduced-motion: reduce) { .ibtn.hint { animation: none; } }
/* Solver */
.ftabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ftab { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 6px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .9rem; }
.ftab i { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #14161D; flex: none; display: block; }
.ftab.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.ftab .n { margin-left: auto; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.ftab.full .n { color: var(--good); }
.ftab { min-width: 0; }
@media (max-width: 380px) { .ftab i { display: none; } }
@media (max-width: 440px) { .ftab { padding: 8px 6px; gap: 5px; font-size: .8rem; } .ftab i { width: 16px; height: 16px; border-width: 1.5px; } .ftab .n { font-size: .7rem; } }
.editor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 300px); margin: 0 auto; padding: 10px; background: #14161D; border-radius: 18px; }
.cell { aspect-ratio: 1; border-radius: 12px; border: none; background: #3A3F4F; touch-action: manipulation; }
.cell.pop { animation: pop .18s ease-out; }
@keyframes pop { 50% { transform: scale(.9); } }
.cell.empty { background: repeating-linear-gradient(45deg, #3A3F4F 0 6px, #444A5C 6px 12px); }
.cell[disabled] { cursor: default; box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .25); }
.palette { display: grid; grid-template-columns: repeat(4, minmax(0, 76px)); justify-content: center; gap: 8px; }
.pcol { width: 100%; height: 64px; gap: 2px; border-radius: 14px; border: 3px solid #14161D; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3px; }
.pcol b, .pcol span { font-size: .72rem; font-weight: 800; background: rgba(255, 255, 255, .88); color: #14161D; border-radius: 6px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.pcol.over b { background: var(--bad); color: #fff; }
.pcol.erase { background: var(--surface-2); color: var(--ink); justify-content: center; font-size: 1.5rem; padding: 0; }
.tool { text-align: center; font-weight: 800; }
.tool i { display: inline-block; width: 16px; height: 16px; border-radius: 5px; border: 2px solid #14161D; vertical-align: -3px; margin-right: 4px; }
.pcol.on { outline: 4px solid var(--accent); outline-offset: 3px; }
.net { display: grid; grid-template-columns: repeat(4, max-content); gap: 4px; justify-content: center; }
.mface { display: grid; grid-template-columns: repeat(3, 12px); gap: 2px; padding: 3px; border-radius: 6px; background: #14161D; border: 2px solid transparent; }
.mface.on { border-color: var(--accent); }
.mface i { width: 12px; height: 12px; border-radius: 3px; background: #444A5C; display: block; }
.err { color: var(--bad); font-weight: 800; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stepcount { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; text-align: center; }
.solseq { max-height: 220px; overflow-y: auto; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
/* Solver move card */
.mcard { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; border: 3px solid var(--line); border-radius: 18px; padding: 12px; background: var(--surface-2); }
.mcard svg { width: 96px; height: 96px; display: block; }
.mcard .mc { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; text-wrap: balance; }
.mcard .mc .sw { display: inline-block; width: 26px; height: 26px; border-radius: 7px; border: 3px solid #14161D; vertical-align: -5px; margin-right: 6px; }
.mcard .md { font-weight: 800; color: var(--muted); }
.twice { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 800; background: var(--yellow); color: #14161D; border-radius: 999px; padding: 3px 12px; }
.twice i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #14161D; display: block; }
.twice i.on { background: #14161D; }
.mcard.start .mc { font-size: 1.2rem; }
@media (max-width: 380px) { .mcard { grid-template-columns: 72px 1fr; } .mcard svg { width: 72px; height: 72px; } .mcard .mc { font-size: 1.25rem; } }
/* v28 */
.pile { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.pcard { position: relative; width: 120px; border: 3px solid var(--pc); border-radius: 16px; background: var(--surface); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pcard svg { width: 70px; height: 70px; }
.pcard b { position: absolute; left: 8px; top: 4px; font-family: var(--f-display); font-size: 1.2rem; }
.pcard span { font-size: .78rem; font-weight: 800; text-align: center; min-height: 1.2em; color: var(--muted); }
.pcard.now { box-shadow: 0 0 0 5px color-mix(in srgb, var(--yellow) 60%, transparent); }
.pcard.now span { color: var(--ink); }
.pcard.gone { opacity: .35; }
.detective { text-align: center; font-weight: 800; color: var(--muted); margin: 0; }
.chunks { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-start; }
.chunk { display: flex; flex-direction: column; gap: 4px; }
.chunk > .seq { gap: 6px; }
.chunk small { font-size: .72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tempo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tempo button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .9rem; }
.tempo button.ok { border-color: var(--good); color: var(--good); }
.coach { border: 3px solid var(--accent); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.splits { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.splits td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.splits td:last-child { text-align: right; font-family: var(--f-mono); font-weight: 700; }
.splits tr.slow td { color: var(--bad); font-weight: 800; }

const KEY = "cube-rafael-v1";
let S = load();
let view = { screen: "who" };
let quiz = null, drill = null, timer = null;

function blankLevel() { return { quiz: false, drills: {}, streak: 0, best: null, recog: false, tempo: {} }; }
function blank() { return { levels: LEVELS.map(blankLevel), unlockAll: false, solves: [], splits: null, rev: null }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.levels && d.levels.length <= LEVELS.length) {
        while (d.levels.length < LEVELS.length) d.levels.push(blankLevel());
        d.levels.forEach(l => { if (!l.tempo) l.tempo = {}; if (l.recog == null) l.recog = false; });
        if (!d.solves) d.solves = [];
        return d;
      }
    }
  } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const drillDone = (i, f) => (S.levels[i].drills[f.name] || 0) >= 3;
function levelDone(i) { const L = S.levels[i]; return L.quiz && L.streak >= 3 && LEVELS[i].formulas.every(f => drillDone(i, f)); }
function unlocked(i) { return S.unlockAll || i === 0 || levelDone(i - 1); }
function doneCount() { return LEVELS.filter((_, i) => levelDone(i)).length; }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(ms) { const t = Math.floor(ms / 100), d = t % 10, s = Math.floor(t / 10) % 60, m = Math.floor(t / 600); return `${m}:${String(s).padStart(2, "0")}.${d}`; }
function chip(m, cls = "") { return `<span class="chip ${cls}"><span class="m">${esc(m)}</span><span class="n">${esc(MOVES[m] || "")}</span></span>`; }
function scramble(n = 22) {
  const faces = ["R", "L", "U", "D", "F"], suf = ["", "'", "2"]; const out = []; let last = "";
  while (out.length < n) { const f = faces[Math.floor(Math.random() * faces.length)]; if (f === last) continue; last = f; out.push(f + suf[Math.floor(Math.random() * 3)]); }
  return out;
}
function stopTimer() { if (timer) { clearInterval(timer.int); timer = null; } }


/* ---------- 3D cube ---------- */
const RC = (() => {
  const COL = { U: "#FFE234", D: "#FFFFFF", F: "#189A55", B: "#2259E0", R: "#FF5F00", L: "#E0363A" };
  const S = 52;
  const FACES = [
    ["F", "translateZ(25px)", c => c.p[2] === 1],
    ["B", "rotateY(180deg) translateZ(25px)", c => c.p[2] === -1],
    ["R", "rotateY(90deg) translateZ(25px)", c => c.p[0] === 1],
    ["L", "rotateY(-90deg) translateZ(25px)", c => c.p[0] === -1],
    ["U", "rotateX(90deg) translateZ(25px)", c => c.p[1] === 1],
    ["D", "rotateX(-90deg) translateZ(25px)", c => c.p[1] === -1]
  ];
  const AX = { x: 0, y: 1, z: 2 };
  const MV = { R: ["x", 1, -90], L: ["x", -1, 90], U: ["y", 1, -90], D: ["y", -1, 90], F: ["z", 1, -90], B: ["z", -1, 90] };
  const I = () => [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  function rot(axis, deg) {
    const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    if (axis === "x") return [[1, 0, 0], [0, c, -s], [0, s, c]];
    if (axis === "y") return [[c, 0, s], [0, 1, 0], [-s, 0, c]];
    return [[c, -s, 0], [s, c, 0], [0, 0, 1]];
  }
  const mul = (A, B) => A.map((r, i) => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
  const mv = (A, v) => A.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
  const rnd = x => Math.round(x);
  const sg = [1, -1, 1];

  const el = document.createElement("div"); el.className = "viewer";
  el.innerHTML = `<div class="movename" aria-live="polite"></div><div class="scene"><div class="rc"></div></div>`;
  const scene = el.querySelector(".scene"), rc = el.querySelector(".rc"), label = el.querySelector(".movename");
  let cubies = [], vx = -26, vy = -36, busy = false, token = 0, speed = 900, quiet = false, pre = null, focus = false;

  function place(c, R) {
    const A = R ? mul(R, c.O) : c.O, q = R ? mv(R, c.p) : c.p;
    const m = (i, j) => A[i][j] * sg[i] * sg[j];
    c.el.style.transform = `matrix3d(${m(0,0)},${m(1,0)},${m(2,0)},0,${m(0,1)},${m(1,1)},${m(2,1)},0,${m(0,2)},${m(1,2)},${m(2,2)},0,${q[0] * S},${-q[1] * S},${q[2] * S},1)`;
  }
  function view() { rc.style.transform = `rotateX(${vx}deg) rotateY(${vy}deg)`; }
  function build() {
    token++; busy = false; rc.innerHTML = ""; cubies = [];
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
      if (!x && !y && !z) continue;
      const c = { p: [x, y, z], h: [x, y, z], O: I(), el: document.createElement("div") };
      c.el.className = "cb";
      c.el.innerHTML = FACES.map(([f, tr, out]) => `<i class="${out(c) ? "st" : ""}" style="transform:${tr};${out(c) ? "background:" + COL[f] : ""}"></i>`).join("");
      rc.appendChild(c.el); place(c); cubies.push(c);
    }
    vx = -26; vy = -36; view(); label.innerHTML = "";
  }
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function turn(m, tk) {
    const [axis, layer, base] = MV[m[0]];
    const angle = base * (m.includes("'") ? -1 : 1) * (m.includes("2") ? 2 : 1);
    const k = AX[axis], group = cubies.filter(c => rnd(c.p[k]) === layer);
    label.innerHTML = quiet ? "" : `<b>${m}</b>${esc(MOVES[m] || "")}`;
    group.forEach(c => c.el.classList.add("hl"));
    if (focus) rc.classList.add("focus");
    await wait(pre != null ? pre : speed * .35);
    if (tk !== token) return;
    const dur = speed * (m.includes("2") ? 1.5 : 1);
    await new Promise(res => {
      const t0 = performance.now();
      const step = now => {
        if (tk !== token) return res();
        const t = Math.min(1, (now - t0) / dur), R = rot(axis, angle * ease(t));
        group.forEach(c => place(c, R));
        if (t < 1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    if (tk !== token) return;
    const R = rot(axis, angle);
    group.forEach(c => { c.O = mul(R, c.O).map(r => r.map(rnd)); c.p = mv(R, c.p).map(rnd); place(c); c.el.classList.remove("hl"); });
    rc.classList.remove("focus");
  }
  async function play(seq, onStep) {
    if (busy) return; busy = true; const tk = token;
    for (let i = 0; i < seq.length; i++) {
      if (tk !== token) return;
      onStep && onStep(i);
      await turn(seq[i], tk);
      if (tk !== token) return;
      await wait(speed * .3);
    }
    onStep && onStep(-1);
    busy = false;
  }
  let drag = null;
  scene.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vx, vy }; try { scene.setPointerCapture(e.pointerId); } catch (_) {} });
  scene.addEventListener("pointermove", e => { if (!drag) return; vy = drag.vy + (e.clientX - drag.x) * .5; vx = Math.max(-80, Math.min(80, drag.vx - (e.clientY - drag.y) * .5)); view(); });
  const end = () => { drag = null; };
  scene.addEventListener("pointerup", end); scene.addEventListener("pointercancel", end);
  build();
  function apply(seq) {
    seq.forEach(m => {
      const [axis, layer, base] = MV[m[0]];
      const R = rot(axis, base * (m.includes("'") ? -1 : 1) * (m.includes("2") ? 2 : 1)), k = AX[axis];
      cubies.filter(c => rnd(c.p[k]) === layer).forEach(c => { c.O = mul(R, c.O).map(r => r.map(rnd)); c.p = mv(R, c.p).map(rnd); place(c); });
    });
  }
  function solved() {
    return cubies.every(c => Math.abs(c.h[0]) + Math.abs(c.h[1]) + Math.abs(c.h[2]) < 2 ||
      (c.p.every((v, i) => v === c.h[i]) && c.O.every((r, i) => r.every((v, j) => v === (i === j ? 1 : 0)))));
  }
  const whites = () => cubies.filter(c => c.h[1] === -1 && Math.abs(c.h[0]) + Math.abs(c.h[2]) === 1).map(c => ({ h: c.h.slice(), p: c.p.slice(), n: mv(c.O, [0, -1, 0]).map(rnd) }));
  const mark = hs => cubies.forEach(c => c.el.classList.toggle("mk", hs.some(h => h[0] === c.h[0] && h[1] === c.h[1] && h[2] === c.h[2])));
  return { el, play, apply, solved, whites, mark, setQuiet: q => { quiet = q; label.innerHTML = ""; }, reset: build, setSpeed: ms => { speed = ms; }, setGuide: (p, f) => { pre = p; focus = f; }, get speed() { return speed; }, get busy() { return busy; } };
})();

function viewerCard(i) {
  const L = LEVELS[i];
  const st = S.levels[i];
  const forms = L.formulas.map((f, k) => `<div class="formrow" data-f="${k}"><strong>${esc(f.name)}</strong>
    ${chunked(f, m => `<button class="chip" data-one="${m}"><span class="m">${esc(m)}</span><span class="n">${esc(MOVES[m])}</span></button>`)}
    <button class="btn" data-play="${k}">▶ Voir ${L.formulas.length > 1 ? "cette formule" : "la formule"}</button>
    <span class="label">Fais avec moi, sur ton cube</span>
    <div class="tempo">${TEMPOS.map(([key, lbl, ms]) => `<button class="${(st.tempo[f.name] || []).includes(key) ? "ok" : ""}" data-tempo="${k}:${key}:${ms}">${lbl}${(st.tempo[f.name] || []).includes(key) ? " ✓" : ""}</button>`).join("")}</div>
    ${view.tempoAsk && view.tempoAsk.f === k ? `<button class="btn good" data-tempook="${k}:${view.tempoAsk.key}">✔ Je l'ai faite en même temps (${esc(view.tempoAsk.key)})</button>` : ""}
    </div>`).join("");
  const pad = i === 0 ? `<div><span class="label">Touche un mouvement pour le voir</span>
    <div class="pad" style="margin-top:8px">${PAD.map(m => `<button class="key" data-one="${m}"><span class="m">${m}</span><span class="n">${MOVES[m]}</span></button>`).join("")}</div></div>` : "";
  return `<section class="card">
    <div class="top"><h3>Regarde sur le cube</h3>

function validate(str) {

  for (const f of FL) { const n = str.split(f).length - 1; if (n !== 9) return `Il y a ${n} cases ${FNAME[f]}${n > 1 ? "s" : ""} : il en faut exactement 9. Vérifie tes faces.`; }

  if (c.asString() !== str) return "Une pièce n'existe pas sur un vrai cube : une couleur est mal recopiée. Vérifie les coins et les bords.";
  const perm = a => a.slice().sort((x, y) => x - y).every((v, i) => v === i);
  const par = a => { let n = 0; for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) n++; return n % 2; };

}

const MDESC = {

  const all = base === "F" || base === "B";

    const on = all || c === col || r === row;
    cells += `<rect x="${21 + c * 18}" y="${21 + r * 18}" width="16" height="16" rx="3.5" fill="${on ? hex : "#E4E8EF"}" ${base === "B" ? 'fill-opacity=".45" stroke-dasharray="3 2"' : ""} stroke="${ink}" stroke-width="1.6"/>`;
  }

  const line = (x1, y1, x2, y2) => { const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1); return `<line x1="${x1}" y1="${y1}" x2="${x2 - dx * 8}" y2="${y2 - dy * 8}" stroke="${ink}" stroke-width="5.5" stroke-linecap="round"/>${head(x2, y2, dx, dy)}`; };

  if (base === "L") arrow = prime ? line(9, 74, 9, 22) : line(9, 22, 9, 74);

async function svSolve(full) {
  SV.err = ""; await needCube();
  const str = svString(), msg = validate(str);
  if (msg) { SV.err = msg; return render(); }
  if (!full) { try { SV.coach = coachStage(str); } catch (e) { SV.coach = null; } if (SV.coach != null) return render(); }
  SV.thinking = true; render();
  try {
    const sol = await solveState(str);
    if (!SV) return;
    SV.thinking = false; SV.sol = sol.trim() ? sol.trim().split(/\s+/) : []; SV.steps = svSteps(SV.sol); SV.step = 0; if (SV.voice == null) SV.voice = true;
    RC.reset(); svGuide(); RC.apply(SV.sol.slice().reverse().map(sinv)); render();
  } catch (e) { SV.thinking = false; SV.err = "Le solveur n'a pas réussi à se lancer. Recharge la page et réessaie."; render(); }

/* ---------- Raf v28 helpers ---------- */
function chunked(f, cell) {
  if (!f.chunks) return `<div class="seq">${f.seq.map((m, k) => cell(m, k)).join("")}</div>`;
  let k = 0;
  return `<div class="chunks">${f.chunks.map(([len, label]) => { const part = f.seq.slice(k, k + len).map((m, j) => cell(m, k + j)).join(""); k += len; return `<div class="chunk"><small>${esc(label)}</small><div class="seq">${part}</div></div>`; }).join("")}</div>`;
}
const TEMPOS = [["lent", "🐢 Lent", 1600], ["normal", "🚶 Normal", 900], ["rapide", "🐇 Rapide", 450]];
let RG = null; // reconnaissance
const recogFormulas = i => { const seen = new Set(), out = []; LEVELS.slice(3, i + 1).forEach(L => L.formulas.forEach(f => { if (!seen.has(f.name)) { seen.add(f.name); out.push(f); } })); return out; };
const invSeq = seq => seq.slice().reverse().map(m => m.endsWith("2") ? m : inv(m));
function recogNext() {
  const pool = recogFormulas(RG.level), mine = LEVELS[RG.level].formulas;
  const ans = rand(Math.random() < .6 ? mine : pool);
  const opts = shuffle([ans, ...shuffle(pool.filter(f => f !== ans)).slice(0, 3)]);
  RG.ans = ans; RG.opts = opts; RG.picked = null;
  RC.reset(); RC.setQuiet(false); RC.setSpeed(900); RC.setGuide(null, false); RC.apply(invSeq(ans.seq));
}
function renderRecog() {
  const done = RG.idx >= RG.total;
  const top = `<div class="top"><button class="back" data-go="${RG.level}">← Niveau ${RG.level}</button><span class="qcount">${done ? "Fini" : `Cube ${RG.idx + 1} / ${RG.total}`}</span></div>`;
  if (done) {
    const ok = RG.score >= RG.total - 1;
    return `${top}<section class="card"><h2>${ok ? "Œil de champion !" : "Presque !"}</h2><p>${RG.score} bonne${RG.score > 1 ? "s" : ""} réponse${RG.score > 1 ? "s" : ""} sur ${RG.total}.${ok ? "" : " Il en faut au moins " + (RG.total - 1) + "."}</p>
      <div class="row"><button class="btn" data-go="${RG.level}">Retour au niveau</button><button class="btn ghost" data-recog="1">Rejouer</button></div></section>`;
  }
  const opts = RG.opts.map((f, k) => {
    let cls = ""; if (RG.picked != null) { if (f === RG.ans) cls = "right"; else if (k === RG.picked) cls = "wrong"; }
    return `<button class="opt ${cls}" data-rpick="${k}" ${RG.picked != null ? "disabled" : ""}>${esc(f.name)}</button>`;
  }).join("");
  return `${top}<header class="hero"><h2>Quelle formule répare ce cube ?</h2><p>Jaune en haut, vert devant toi. Fais tourner le cube du doigt pour bien regarder.</p></header>
    <section class="card"><div class="vslot"></div><div class="options">${opts}</div>
    ${RG.picked != null ? `<p class="feedback ${RG.opts[RG.picked] === RG.ans ? "good" : "bad"}">${RG.opts[RG.picked] === RG.ans ? "Bien vu ! Regarde-la réparer le cube." : `C'était « ${esc(RG.ans.name)} ». Regarde-la réparer le cube.`}</p>
    <button class="btn" data-rnext="1">Cube suivant</button>` : ""}</section>`;
}
/* Coach du solveur : à quelle étape de la méthode de Raf en est ce cube ? */
function coachStage(str) {
  const C = window.Cube; let c = C.fromString(str);
  const ok = (idx, o) => idx.every(i => (o === "e" ? c.ep[i] === i && c.eo[i] === 0 : c.cp[i] === i && c.co[i] === 0));
  if (!ok([4, 5, 6, 7], "e")) return 2;
  if (!ok([4, 5, 6, 7], "c")) return 3;
  if (!ok([8, 9, 10, 11], "e")) return 4;
  if (![0, 1, 2, 3].every(i => c.eo[i] === 0)) return 5;
  let aligned = null;
  for (let k = 0; k < 4; k++) { const t = c.clone(); for (let j = 0; j < k; j++) t.move("U"); if ([0, 1, 2, 3].every(i => t.ep[i] === i)) { aligned = t; break; } }
  if (!aligned) return 6;
  c = aligned;
  if (![0, 1, 2, 3].every(i => c.cp[i] === i)) return 7;
  if ([0, 1, 2, 3].every(i => c.co[i] === 0)) return 9;
  return 8;
}
function renderCoach() {
  const i = SV.coach;
  if (i === 9) return `<div class="coach"><span class="label">Indice</span><h3>Presque fini !</h3><p>Tout est rangé : il reste juste à tourner le haut (le jaune) jusqu'à ce que les couleurs des côtés soient alignées.</p>
    <div class="row"><button class="btn ghost" data-sfull="1">Montre-moi</button></div></div>`;
  const L = LEVELS[i];
  const forms = L.formulas.map(f => `<div><strong>${esc(f.name)}</strong>${chunked(f, m => chip(m))}</div>`).join("");
  return `<div class="coach"><span class="label">Indice de la méthode</span>
    <h3>Tu en es au niveau ${i} : ${esc(L.name)}</h3>
    ${i === 2 ? "<p>Pas encore de croix blanche en bas : fais d'abord la marguerite (niveau 1), puis la croix.</p>" : ""}
    <ul class="tips">${L.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    ${forms}
    <div class="row"><button class="btn" data-go="${i}">Ouvrir le niveau ${i}</button><button class="btn ghost" data-sfull="1">Toute la solution</button></div>

/* ---------- Marguerite pas à pas (Raf, niveau 1) ---------- */

  { t: "Au milieu", c: "mid", need: 3,
    why: "L'arête est au milieu. Tourne la face d'à côté (pas celle où est le blanc) dans le sens qui fait monter le blanc vers le haut." },
  { t: "En bas, blanc sur le côté", c: "downS", need: 3,
    why: "Tourne sa face une fois : l'arête remonte au milieu. Ensuite, c'est comme l'étape « Au milieu »." },
  { t: "En haut mais à l'envers", c: "topF", need: 3,
    why: "Elle est en haut mais son blanc regarde sur le côté. Tourne sa face : elle descend au milieu. Ensuite, c'est comme l'étape « Au milieu »." },
  { t: "Protège tes pétales", c: "protect", need: 3,

  const f = LEVELS[drill.level].formulas[drill.f], cnt = S.levels[drill.level].drills[f.name] || 0;
  const slots = chunked(f, (m, k) => k < drill.pos ? chip(m, "filled") : chip(m, "blank" + (k === drill.pos ? " next" : "")));
  const keys = PAD.map(m => `<button class="key" data-key="${m}"><span class="m">${m}</span><span class="n">${MOVES[m]}</span></button>`).join("");
  const finished = drill.pos >= f.seq.length;
  return `<div class="top"><button class="back" data-go="${drill.rev ? "map" : drill.level}">← ${drill.rev ? "Carte" : "Niveau " + drill.level}</button>
    <div class="stars">${[0, 1, 2].map(s => `<i class="${s < cnt ? "on" : ""}"></i>`).join("")}</div></div>
    <section class="card"><span class="label">${drill.rev ? "Révision du jour · niveau " + drill.level : "De mémoire"}</span><h2>${esc(f.name)}</h2>
    <div class="seq" id="slots">${slots}</div>
    <p class="feedback ${drill.msgCls || ""}" id="fb">${esc(drill.msg || "Tape les mouvements dans l'ordre.")}</p>
    ${finished ? (drill.rev ? `<div class="row"><button class="btn" data-go="map">Retour à la carte</button>${drill.errors ? `<button class="btn ghost" data-rraf="1">Réessayer</button>` : ""}</div>` : `<div class="row"><button class="btn" data-drill="${drill.f}">Encore une fois</button><button class="btn ghost" data-go="${drill.level}">Retour au niveau</button></div>`)
      : `<div class="pad">${keys}</div>
        <button class="link" data-hint="1" style="align-self:flex-start">Je ne sais plus (indice)</button>`}
    </section>`;
}

function splitsHTML() {
  const sp = S.splits; if (!sp || sp.length !== 4) return "";
  const names = ["Croix blanche", "Premier étage", "Deuxième couronne", "Dernière couche"], lvl = [2, 3, 4, 5];
  const d = sp.map((t, k) => t - (k ? sp[k - 1] : 0)), slow = d.indexOf(Math.max(...d));
  return `<section class="card"><span class="label">Dernier essai, étape par étape</span>
    <table class="splits">${d.map((t, k) => `<tr class="${k === slow ? "slow" : ""}"><td>${names[k]}</td><td>${fmt(t)}</td></tr>`).join("")}</table>
    <p>Ton étape la plus lente : <strong>${names[slow]}</strong>. Pour gagner du temps, révise le niveau ${lvl[slow]}${slow === 3 ? " à 8" : ""}${slow === 0 ? " ou le niveau bonus « Croix directe »" : ""}.</p></section>`;
}
function renderChrono() {
  const best = S.solves.length ? Math.min(...S.solves) : null;
  const badges = [
    ["Apprenti", "Finir le cube", best != null],
    ["Rapide", "Moins de 5 minutes", best != null && best < 300000],
    ["Champion", "Moins de 2 minutes", best != null && best < 120000],
    ["Maître", "Moins de 1 minute", best != null && best < 60000]
  ].map(([n, d, on]) => `<div class="badge ${on ? "on" : ""}"><b>${n}</b><span>${d}</span></div>`).join("");
  const last = S.solves.slice(-8).reverse().map(t => `<li>${fmt(t)}</li>`).join("");
  return `<div class="top"><button class="back" data-go="map">← Carte</button><span class="label">Mode chrono</span></div>
    <header class="hero"><h2>Résous le cube en entier</h2><p>Fais le mélange, lance le chrono, et arrête-le quand le cube est fini.</p></header>
    <section class="card"><span class="label">Mélange</span><div class="scramble">${view.scr.join(" ")}</div>
      <button class="link" data-newscr="1" style="align-self:flex-start">Autre mélange</button>
      <div class="clock" id="clock">${fmt(timer ? performance.now() - timer.t0 : 0)}</div>
      ${timer && (timer.splits || []).length < 3 ? `<button class="btn ghost bigbtn" id="csplit">Étape finie : ${["croix blanche", "premier étage", "deuxième couronne"][(timer.splits || []).length]} ✓</button>` : ""}
      <button class="btn" id="cstart">${timer ? "Stop : cube fini !" : "Lancer le chrono"}</button>
      <p style="color:var(--muted);font-size:.9rem">Touche « Étape finie » à la fin de chaque étape : tu verras laquelle te prend le plus de temps.</p>
      ${best != null ? `<p><strong>Record :</strong> ${fmt(best)}</p>` : ""}
      ${last ? `<div><span class="label">Derniers temps</span><ul class="times">${last}</ul></div>` : ""}</section>
    ${splitsHTML()}
    <section class="card"><span class="label">Badges</span><div class="badges">${badges}</div></section>`;
}

function render() {
  const app = document.getElementById("app");
  if (view.screen === "who") app.innerHTML = renderWho();
  else if (view.screen === "nmap") app.innerHTML = renderNanaMap();
  else if (view.screen === "ngame") app.innerHTML = renderNana();
  else if (view.screen === "solver") app.innerHTML = renderSolver();
  else if (view.screen === "map") app.innerHTML = renderMap();
  else if (view.screen === "level") app.innerHTML = renderLevel(view.level);
  else if (view.screen === "quiz") app.innerHTML = renderQuiz();
  else if (view.screen === "drill") app.innerHTML = renderDrill();
  else if (view.screen === "chrono") app.innerHTML = renderChrono();
  else if (view.screen === "recog") app.innerHTML = renderRecog();
  else if (view.screen === "daisy") app.innerHTML = renderDaisy();
  const slot = app.querySelector(".vslot"); if (slot) slot.appendChild(RC.el);
}

function go(target) {
  stopTimer();
  if (view.screen === "ngame") { NG = null; RC.reset(); RC.setQuiet(false); RC.setSpeed(900); RC.setGuide(null, false); try { speechSynthesis.cancel(); } catch (e) {} }
  if (view.screen === "recog") { RG = null; RC.reset(); }
  if (view.screen === "daisy") { DS = null; RC.mark([]); RC.reset(); RC.setSpeed(900); }
  if (view.screen === "solver" && target !== "solver") { RC.reset(); RC.setGuide(null, false); RC.setSpeed(900); RC.setQuiet(false); try { speechSynthesis.cancel(); } catch (e) {} }
  if (target === "solver") { const from = view.screen === "map" ? "map" : "who"; if (!SV) SV = svNew(); SV.from = from; view = { screen: "solver" }; needCube().catch(() => {}); getWorker(); }
  else if (target === "who") view = { screen: "who" };
  else if (target === "nana") view = { screen: "nmap" };
  else if (target === "map") view = { screen: "map" };
  else if (target === "chrono") view = { screen: "chrono", scr: scramble() };
  else view = { screen: "level", level: Number(target), scr: scramble() };
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (SV && view.screen === "solver" && !d.sclear) SV.sure = false;
  if (SV) SV.pop = -1;
  if (d.sface) { SV.cur = d.sface; SV.err = ""; return render(); }
  if (d.spaint) { SV.paint = d.spaint; return render(); }
  if (d.scell !== undefined) {
    const k = Number(d.scell), a = SV.faces[SV.cur], v = SV.paint === "X" ? null : SV.paint;
    if (a[k] !== v) { SV.hist.push([[SV.cur, k, a[k]]]); a[k] = v; SV.coach = null; }
    SV.pop = k; SV.err = ""; return render();
  }
  if (d.sundo) { SV.coach = null; const last = SV.hist.pop(); if (last) { last.forEach(([f, k, old]) => { SV.faces[f][k] = old; }); SV.cur = last[0][0]; } SV.err = ""; return render(); }
  if (d.sfaceclear) { const a = SV.faces[SV.cur], ch = []; a.forEach((c, k) => { if (k !== 4 && c) { ch.push([SV.cur, k, c]); a[k] = null; } }); if (ch.length) SV.hist.push(ch); return render(); }
  if (d.sclear) {
    if (!SV.sure) { SV.sure = true; return render(); }
    const keep = SV.from, ch = []; FL.forEach(f => SV.faces[f].forEach((c, k) => { if (k !== 4 && c) ch.push([f, k, c]); }));
    SV = svNew(); SV.from = keep; if (ch.length) SV.hist.push(ch); return render();
  }
  if (d.sdemo) { SV.coach = null; needCube().then(() => { const str = window.Cube.random().asString(), ch = []; FL.forEach((f, i) => { SV.faces[f].forEach((c, k) => ch.push([f, k, c])); SV.faces[f] = str.slice(i * 9, i * 9 + 9).split(""); }); SV.hist.push(ch); SV.err = ""; render(); }); return; }
  if (d.ssolve) { svSolve(); return; }
  if (d.snext) { if (RC.busy || SV.step >= SV.steps.length) return; const st = SV.steps[SV.step]; SV.step++; svGuide(); render(); svSay(st); RC.play([st.m]); return; }
  if (d.sreplay) { if (RC.busy || !SV.step) return; const st = SV.steps[SV.step - 1]; svGuide(); RC.apply([inv(st.m)]); svSay(st); RC.play([st.m]); return; }
  if (d.sprev) { if (RC.busy || !SV.step) return; const st = SV.steps[SV.step - 1]; SV.step--; svGuide(); render(); RC.play([inv(st.m)]); return; }
  if (d.svoice) { SV.voice = !SV.voice; if (!SV.voice) { try { speechSynthesis.cancel(); } catch (e) {} } return render(); }
  if (d.snew) { const keep = SV.from; SV = svNew(); SV.from = keep; RC.reset(); return render(); }
  if (d.nlvl !== undefined) { nStart(Number(d.nlvl)); return; }
  if (d.nrev) { nStartRev(); return; }
  if (d.dstep !== undefined) { stopTimer(); if (view.screen === "daisy") { DS = null; RC.mark([]); } dStart(Number(d.dstep)); return; }
  if (d.dmv) { dMove(d.dmv); return; }
  if (d.dundo) { dUndo(); return; }
  if (d.dhint) { dHint(); return; }
  if (d.dshow) { dShow(); return; }
  if (d.dnew) { if (DS && !DS.busy) { if (DS.done && DS.score >= DSTEPS[DS.step].need) DS.score = 0; dNew(); } return; }
  if (d.nrewatch) { nRewatch(); return; }
  if (d.nreal) { nReal(d.nreal); return; }
  if (d.recog) { stopTimer(); RG = { level: view.screen === "recog" ? RG.level : view.level, idx: 0, total: 5, score: 0 }; view = { screen: "recog" }; recogNext(); return render(); }
  if (d.rpick !== undefined) {
    if (!RG || RG.picked != null || RC.busy) return;
    RG.picked = Number(d.rpick); if (RG.opts[RG.picked] === RG.ans) RG.score++;
    render(); RC.play(RG.ans.seq); return;
  }
  if (d.rnext) {
    if (!RG || RC.busy) return;
    RG.idx++;
    if (RG.idx >= RG.total) { if (RG.score >= RG.total - 1) { S.levels[RG.level].recog = true; save(); } RC.reset(); return render(); }
    recogNext(); return render();
  }
  if (d.rraf) { const pool = revPool(); if (!pool.length) return; const [lv, k] = rand(pool); drill = { level: lv, f: k, pos: 0, errors: 0, rev: true }; view = { screen: "drill" }; return render(); }
  if (d.tempo) {
    if (RC.busy) return;
    const [k, key, ms] = d.tempo.split(":"), f = LEVELS[view.level].formulas[Number(k)], row = b.closest(".formrow");
    view.tempoAsk = null; RC.reset(); RC.setSpeed(Number(ms));
    row.querySelectorAll("[data-tempo]").forEach(x => x.disabled = true);
    RC.play(f.seq, j => { row.querySelectorAll("button.chip").forEach((x, n) => x.classList.toggle("now", n === j)); if (j < 0) { RC.setSpeed(900); view.tempoAsk = { f: Number(k), key }; render(); } });
    return;
  }
  if (d.tempook) {
    const [k, key] = d.tempook.split(":"), f = LEVELS[view.level].formulas[Number(k)], st = S.levels[view.level];
    const have = st.tempo[f.name] || []; if (!have.includes(key)) have.push(key); st.tempo[f.name] = have; view.tempoAsk = null; save(); return render();
  }
  if (d.sfull) { SV.coach = null; svSolve(true); return; }
  if (d.npick) { nPick(d.npick); return; }
  if (d.nsay) { if (NG) say(NG.win ? "Bravo Nana !" : NG.prompt); return; }
  if (d.nreplay) { if (NG && NG.ready && !RC.busy) { const g = NG; g.ready = false; RC.reset(); RC.play([g.ans]).then(() => { if (NG === g) g.ready = true; }); } return; }
  if (d.ndance) { nDance(false); return; }
  if (d.nagain) { nDance(true); return; }
  if (b.id === "nunlock") { NS.unlockAll = !NS.unlockAll; nsave(); return render(); }
  if (d.one) { if (!RC.busy) RC.play([d.one], k => { document.getElementById("app").querySelectorAll("button.chip.now").forEach(x => x.classList.remove("now")); if (k >= 0) b.classList.add("now"); }); return; }
  if (d.play !== undefined) {
    const row = b.closest(".formrow"), f = LEVELS[view.level].formulas[Number(d.play)];
    RC.play(f.seq, k => { row.querySelectorAll("button.chip").forEach((x, j) => x.classList.toggle("now", j === k)); });
    return;
  }
  if (d.reset) { RC.reset(); return; }
  if (d.speed) { RC.setSpeed(Number(d.speed)); document.getElementById("app").querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); return; }
  if (d.go !== undefined) { if (view.screen === "level" && d.go !== String(view.level)) RC.reset(); return go(d.go); }
  if (b.id === "unlock") { S.unlockAll = !S.unlockAll; save(); return render(); }
  if (d.quiz) { quiz = { level: view.level ?? quiz.level, idx: 0, score: 0, picked: null }; view = { screen: "quiz" }; return render(); }
  if (d.pick !== undefined) { const q = LEVELS[quiz.level].quiz[quiz.idx]; quiz.picked = Number(d.pick); if (quiz.picked === q.r) quiz.score++; return render(); }
  if (d.qnext) {
    quiz.idx++; quiz.picked = null;
    if (quiz.idx >= LEVELS[quiz.level].quiz.length && quiz.score === LEVELS[quiz.level].quiz.length) { S.levels[quiz.level].quiz = true; save(); }
    return render();
  }
  if (d.drill !== undefined) { const lvl = view.screen === "drill" ? drill.level : view.level; drill = { level: lvl, f: Number(d.drill), pos: 0, errors: 0 }; view = { screen: "drill" }; return render(); }
  if (d.key) {
    const f = LEVELS[drill.level].formulas[drill.f];
    if (d.key === f.seq[drill.pos]) {
      drill.pos++; drill.msg = ""; drill.msgCls = "";
      if (drill.pos >= f.seq.length) {
        const st = S.levels[drill.level];
        if (drill.rev) {
          if (drill.errors === 0) { const t = dayKey(); if (!S.rev || S.rev.date !== t) S.rev = { date: t, days: (S.rev ? S.rev.days : 0) + 1 }; drill.msg = `Révision réussie ! ${S.rev.days} jour${S.rev.days > 1 ? "s" : ""} de révision.`; }
          else drill.msg = "Formule complète, mais avec une erreur. Réessaie pour valider la révision.";
          drill.msgCls = "good";
        }
        else if (drill.errors === 0) { st.drills[f.name] = (st.drills[f.name] || 0) + 1; drill.msg = "Parfait, sans erreur ! Une étoile de plus."; drill.msgCls = "good"; }
        else { drill.msg = "Formule complète. Refais-la sans erreur pour gagner une étoile."; drill.msgCls = "good"; }
        save();
      }
      return render();
    }
    drill.errors++; drill.msg = "Ce n'est pas ce mouvement. Réfléchis encore."; drill.msgCls = "bad"; render();
    const slots = document.getElementById("slots"); if (slots) { slots.classList.add("shake"); }
    return;
  }
  if (d.hint) { const f = LEVELS[drill.level].formulas[drill.f]; drill.errors++; drill.msg = `Le mouvement suivant est ${f.seq[drill.pos]} : ${MOVES[f.seq[drill.pos]]}.`; drill.msgCls = ""; return render(); }
  if (d.newscr) { view.scr = scramble(); return render(); }
  if (d.res) {
    const st = S.levels[view.level];
    const t = timer ? performance.now() - timer.t0 : view.lastTime;
    const goal = LEVELS[view.level].goal;
    if (d.res === "ok" && goal && !(t && t <= goal)) { view.goalMsg = t ? `Réussi, mais en ${fmt(t)} : l'objectif est moins de ${fmt(goal)}. Encore un essai !` : "Lance le chrono : ce défi se joue contre la montre."; stopTimer(); view.lastTime = 0; return render(); }
    view.goalMsg = "";
    if (d.res === "ok") { st.streak = Math.min(st.streak + 1, 3); if (t) st.best = st.best ? Math.min(st.best, t) : t; }
    else st.streak = levelDone(view.level) ? st.streak : 0;
    stopTimer(); view.lastTime = 0; save(); view.scr = scramble(); return render();
  }
  if (b.id === "csplit") { if (timer) { (timer.splits = timer.splits || []).push(performance.now() - timer.t0); render(); } return; }
  if (b.id === "tstart" || b.id === "cstart") {
    if (timer) {
      const t = performance.now() - timer.t0, timer0 = timer; stopTimer();
      if (b.id === "cstart") { S.solves.push(t); const sp = timer0 && timer0.splits || []; S.splits = sp.length === 3 ? [...sp, t] : null; save(); view.scr = scramble(); }
      else view.lastTime = t;
      return render();
    }
    timer = { t0: performance.now() };
    timer.int = setInterval(() => { const c = document.getElementById("clock"); if (c && timer) c.textContent = fmt(performance.now() - timer.t0); }, 100);
    return render();
  }
});

/* Pas de zoom sur iPad : Safari ignore user-scalable=no, on bloque le pincement et le double-tap */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTouchEnd < 350 && !e.target.closest("button, a")) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
